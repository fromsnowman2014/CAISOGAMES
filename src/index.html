<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Feeding Caiso - Save the Villagers!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/10;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            box-shadow: 0 0 60px rgba(108, 92, 231, 0.4);
        }
        #touchFeedBtn {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 18px 50px;
            font-size: 28px;
            font-family: 'Fredoka One', cursive;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.5);
            transition: transform 0.1s;
            z-index: 100;
            display: none;
        }
        #touchFeedBtn:active { transform: translateX(-50%) scale(0.95); }
        @media (max-width: 768px) { #touchFeedBtn { display: block; } }
        #loadingScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #2d3436 0%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            z-index: 1000;
        }
        .loading-text {
            font-family: 'Fredoka One', cursive;
            font-size: 36px;
            color: #a29bfe;
            animation: pulse 1s infinite;
        }
        .loading-bar {
            width: 200px;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }
        .loading-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            border-radius: 4px;
            animation: load 1.5s ease-out forwards;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes load { to { width: 100%; } }
    </style>
</head>

        dorito: { name: 'Dorito', asset: 'foodDorito', hungerReduction: 0.8, unlockLevel: 10, color: '#f39c12', key: '2' },
        burger: { name: 'Burger', asset: 'foodBurger', hungerReduction: 1.5, unlockLevel: 20, color: '#e67e22', key: '3' },
        dynamite: { name: 'Dynamite', asset: 'foodDynamite', hungerReduction: 5.0, unlockLevel: 30, color: '#e74c3c', key: '4' },
        pizza: { name: 'Pizza', asset: 'foodPizza', hungerReduction: 2.5, unlockLevel: 50, color: '#f39c12', key: '5' },
        watermelon: { name: 'Watermelon', asset: 'foodWatermelon', hungerReduction: 7.0, unlockLevel: 100, color: '#27ae60', key: '6' }
    };

    // ============================================
    // IMAGE LOADER
    // ============================================
    class ImageLoader {
        constructor() {
            this.images = {};
            this.loaded = 0;
            this.total = 0;
        }

        loadAll(assets) {
            return new Promise((resolve) => {
                const keys = Object.keys(assets);
                this.total = keys.length;
                if (this.total === 0) { resolve(); return; }

                keys.forEach(key => {
                    const img = new Image();
                    const svgBlob = new Blob([assets[key]], { type: 'image/svg+xml' });
                    const url = URL.createObjectURL(svgBlob);
                    img.onload = () => {
                        this.images[key] = img;
                        this.loaded++;
                        URL.revokeObjectURL(url);
                        if (this.loaded >= this.total) resolve();
                    };
                    img.onerror = () => {
                        this.loaded++;
                        if (this.loaded >= this.total) resolve();
                    };
                    img.src = url;
                });
            });
        }

        get(key) { return this.images[key]; }
    }

    // ============================================
    // VILLAGER CLASS
    // ============================================
    class Villager {
        constructor(id, startX, targetX) {
            this.id = id;
            this.x = startX;
            this.y = 380 + Math.random() * 40;
            this.targetX = targetX;
            this.speed = 0.3 + Math.random() * 0.2;
            this.scared = false;
            this.scaredTimer = 0;
            this.bobOffset = Math.random() * Math.PI * 2;
            this.scale = 0.7 + Math.random() * 0.3;
            this.active = true;
            this.beingEaten = false;
            this.eatenProgress = 0;
        }

        update(deltaTime, dangerLevel) {
            if (!this.active) return;

            // Move toward Caiso (backing up into mouth)
            const moveSpeed = this.speed * (this.scared ? 1.5 : 1) * (deltaTime / 16);
            this.x += moveSpeed;

            // Get scared when close to Caiso
            if (this.x > this.targetX - 150 && !this.scared) {
                this.scared = true;
            }

            // Being eaten animation
            if (this.beingEaten) {
                this.eatenProgress += deltaTime / 500;
                this.x += 2;
                if (this.eatenProgress >= 1) {
                    this.active = false;
                }
            }

            // Bob animation
            this.bobOffset += deltaTime * 0.01;
        }

        draw(ctx, images) {
            if (!this.active) return;

            const bob = Math.sin(this.bobOffset) * 3;
            const imgKey = this.scared ? 'villagerScared' : 'villager';
            const img = images.get(imgKey);

            if (img) {
                ctx.save();
                const width = 40 * this.scale;
                const height = 60 * this.scale;

                if (this.beingEaten) {
                    ctx.globalAlpha = 1 - this.eatenProgress;
                    ctx.translate(this.x, this.y + bob - this.eatenProgress * 30);
                    ctx.scale(1 - this.eatenProgress * 0.5, 1 - this.eatenProgress * 0.5);
                } else {
                    ctx.translate(this.x, this.y + bob);
                }

                ctx.drawImage(img, -width/2, -height/2, width, height);
                ctx.restore();
            }
        }
    }

    // ============================================
    // PLAYER CLASS
    // ============================================
    class Player {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.throwing = false;
            this.throwTimer = 0;
        }

        throw() {
            this.throwing = true;
            this.throwTimer = 300;
        }

        update(deltaTime) {
            if (this.throwTimer > 0) {
                this.throwTimer -= deltaTime;
                if (this.throwTimer <= 0) {
                    this.throwing = false;
                }
            }
        }

        draw(ctx, images) {
            const img = images.get(this.throwing ? 'playerThrowing' : 'player');
            if (img) {
                const width = 100;
                const height = 125;
                ctx.drawImage(img, this.x - width/2, this.y - height/2, width, height);
            }
        }
    }

    // ============================================
    // CAISO CLASS (using images)
    // ============================================
    class Caiso {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.expression = 'idle';
            this.bounceOffset = 0;
            this.eatTimer = 0;
            this.guiltyTimer = 0;
        }

        reset() {
            this.expression = 'idle';
            this.eatTimer = 0;
            this.guiltyTimer = 0;
        }

        eat() {
            this.expression = 'eating';
            this.eatTimer = 400;
        }

        showGuilty() {
            this.expression = 'guilty';
            this.guiltyTimer = 600;
        }

        update(deltaTime) {
            this.bounceOffset = Math.sin(Date.now() * 0.003) * 8;

            if (this.eatTimer > 0) {
                this.eatTimer -= deltaTime;
                if (this.eatTimer <= 0 && this.expression === 'eating') {
                    this.expression = 'idle';
                }
            }

            if (this.guiltyTimer > 0) {
                this.guiltyTimer -= deltaTime;
                if (this.guiltyTimer <= 0 && this.expression === 'guilty') {
                    this.expression = 'idle';
                }
            }
        }

        draw(ctx, images) {
            let imgKey = 'caisoIdle';
            if (this.expression === 'eating') imgKey = 'caisoEating';
            else if (this.expression === 'happy') imgKey = 'caisoHappy';
            else if (this.expression === 'sad') imgKey = 'caisoSad';

            const img = images.get(imgKey);
            if (img) {
                const width = 220;
                const height = 242;
                ctx.save();
                ctx.translate(this.x, this.y + this.bounceOffset);
                // Flip horizontally to face left
                ctx.scale(-1, 1);
                ctx.drawImage(img, -width/2, -height/2, width, height);
                ctx.restore();
            }
        }

        getMouthPosition() {
            return { x: this.x - 60, y: this.y + 30 + this.bounceOffset };
        }
    }

    // ============================================
    // FLYING FOOD CLASS
    // ============================================
    class FlyingFood {
        constructor(foodData, startX, startY, endX, endY, images) {
            this.foodData = foodData;
            this.images = images;
            this.startX = startX;
            this.startY = startY;
            this.endX = endX;
            this.endY = endY;
            this.x = startX;
            this.y = startY;
            this.progress = 0;
            this.duration = 450;
            this.elapsed = 0;
            this.rotation = 0;
            this.arrived = false;
        }

        update(deltaTime) {
            this.elapsed += deltaTime;
            this.progress = Math.min(this.elapsed / this.duration, 1);

            const t = this.progress;
            this.x = this.startX + (this.endX - this.startX) * t;

            const controlY = Math.min(this.startY, this.endY) - 120;
            this.y = (1 - t) * (1 - t) * this.startY +
                     2 * (1 - t) * t * controlY +
                     t * t * this.endY;

            this.rotation += 0.15;

            if (this.progress >= 1) {
                this.arrived = true;
            }
        }

        draw(ctx) {
            const img = this.images.get(this.foodData.asset);
            if (img) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                const size = 50;
                ctx.drawImage(img, -size/2, -size/2, size, size);
                ctx.restore();
            }
        }
    }

    // ============================================
    // MAIN GAME CLASS
    // ============================================
    class Game {
        constructor(canvas) {
            this.canvas = canvas;
            this.ctx = canvas.getContext('2d');
            this.canvas.width = GAME_WIDTH;
            this.canvas.height = GAME_HEIGHT;

            this.images = new ImageLoader();
            this.state = 'loading';
            this.hunger = 100;
            this.villagerCount = 100;
            this.level = 1;
            this.combo = 0;
            this.maxCombo = 0;
            this.totalHungerReduced = 0;
            this.selectedFoodKey = 'apple';
            this.gameTime = 0;

            this.lastTime = 0;
            this.villagerTimer = 0;
            this.comboTimer = 0;

            this.villagers = [];
            this.flyingFoods = [];
            this.particles = [];
            this.floatingTexts = [];

            this.caiso = new Caiso(GAME_WIDTH - 130, 320);
            this.player = new Player(200, 480);

            this.init();
        }

        async init() {
            await this.images.loadAll(ASSETS);
            this.state = 'menu';
            this.setupEventListeners();
            this.hideLoading();
        }

        hideLoading() {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
            }, 800);
        }

        setupEventListeners() {
            document.addEventListener('keydown', (e) => this.handleKeyDown(e));
            document.getElementById('touchFeedBtn').addEventListener('click', () => this.feedCaiso());
            this.canvas.addEventListener('click', (e) => this.handleClick(e));
        }

        handleKeyDown(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                if (this.state === 'menu') this.startGame();
                else if (this.state === 'playing') this.feedCaiso();
            } else if (e.code === 'KeyR') {
                if (this.state === 'gameover' || this.state === 'victory') this.startGame();
            } else if (e.code === 'KeyC' || e.code === 'KeyP') {
                if (this.state === 'playing') this.state = 'paused';
                else if (this.state === 'paused') this.state = 'playing';
            } else if (e.key >= '1' && e.key <= '6') {
                this.selectFoodByKey(e.key);
            }
        }

        handleClick(e) {
            if (this.state === 'menu') this.startGame();
            else if (this.state === 'gameover' || this.state === 'victory') this.startGame();
            else if (this.state === 'paused') {
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (GAME_WIDTH / rect.width);
                const y = (e.clientY - rect.top) * (GAME_HEIGHT / rect.height);
                this.handleFoodMenuClick(x, y);
            }
        }

        handleFoodMenuClick(x, y) {
            const foods = Object.entries(FOODS);
            foods.forEach(([key, food], index) => {
                const itemY = 180 + index * 50;
                if (y >= itemY - 20 && y <= itemY + 30 && food.unlockLevel <= this.level) {
                    this.selectedFoodKey = key;
                }
            });
        }

        selectFoodByKey(key) {
            const foodEntries = Object.entries(FOODS);
            const index = parseInt(key) - 1;
            if (index >= 0 && index < foodEntries.length) {
                const [foodKey, food] = foodEntries[index];
                if (food.unlockLevel <= this.level) {
                    this.selectedFoodKey = foodKey;
                }
            }
        }

        startGame() {
            this.state = 'playing';
            this.hunger = 100;
            this.villagerCount = 100;
            this.level = 1;
            this.combo = 0;
            this.maxCombo = 0;
            this.totalHungerReduced = 0;
            this.selectedFoodKey = 'apple';
            this.gameTime = 0;
            this.villagerTimer = 0;
            this.comboTimer = 0;
            this.flyingFoods = [];
            this.particles = [];
            this.floatingTexts = [];
            this.caiso.reset();

            // Create initial villagers
            this.villagers = [];
            for (let i = 0; i < 15; i++) {
                this.spawnVillager(i);
            }
        }

        spawnVillager(id) {
            const startX = -50 - Math.random() * 200;
            const targetX = this.caiso.x - 80;
            this.villagers.push(new Villager(id, startX, targetX));
        }

        feedCaiso() {
            if (this.state !== 'playing') return;

            const food = FOODS[this.selectedFoodKey];
            if (food.unlockLevel > this.level) return;

            this.player.throw();

            const mouthPos = this.caiso.getMouthPosition();
            this.flyingFoods.push(new FlyingFood(
                food,
                this.player.x + 30,
                this.player.y - 40,
                mouthPos.x,
                mouthPos.y,
                this.images
            ));

            this.comboTimer = COMBO_TIMEOUT;
        }

        consumeFood(food) {
            const multiplier = this.getComboMultiplier();
            const reduction = food.hungerReduction * multiplier;

            this.hunger = Math.max(0, this.hunger - reduction);
            this.totalHungerReduced += reduction;

            this.combo++;
            if (this.combo > this.maxCombo) this.maxCombo = this.combo;

            const newLevel = Math.floor(this.totalHungerReduced / 5) + 1;
            if (newLevel > this.level) this.levelUp(newLevel);

            const mouthPos = this.caiso.getMouthPosition();
            this.addFloatingText(`-${reduction.toFixed(1)}%`, mouthPos.x, mouthPos.y - 60, '#2ed573');
            if (this.combo >= 3) {
                this.addFloatingText(`${this.combo}x COMBO!`, mouthPos.x, mouthPos.y - 90, '#f39c12');
            }
            this.addParticles(mouthPos.x, mouthPos.y, food.color, 12);
            this.caiso.eat();

            if (this.hunger <= 0) {
                this.state = 'victory';
                this.caiso.expression = 'happy';
                this.addParticles(GAME_WIDTH / 2, GAME_HEIGHT / 2, '#ffd700', 50);
            }
        }

        levelUp(newLevel) {
            this.level = newLevel;
            this.addFloatingText(`LEVEL ${newLevel}!`, GAME_WIDTH / 2, 120, '#00d2d3');
            this.addParticles(GAME_WIDTH / 2, 80, '#00d2d3', 30);

            Object.entries(FOODS).forEach(([key, food]) => {
                if (food.unlockLevel === newLevel) {
                    this.addFloatingText(`${food.name} UNLOCKED!`, GAME_WIDTH / 2, 160, food.color);
                }
            });
        }

        getComboMultiplier() {
            if (this.combo >= 10) return 3.0;
            if (this.combo >= 5) return 2.0;
            if (this.combo >= 3) return 1.5;
            return 1.0;
        }

        consumeVillager() {
            if (this.villagerCount <= 0) return;

            // Find closest villager to Caiso
            let closestVillager = null;
            let closestDist = Infinity;

            this.villagers.forEach(v => {
                if (v.active && !v.beingEaten) {
                    const dist = this.caiso.x - v.x;
                    if (dist < closestDist && dist > 0) {
                        closestDist = dist;
                        closestVillager = v;
                    }
                }
            });

            if (closestVillager) {
                closestVillager.beingEaten = true;
                this.villagerCount--;
                this.addFloatingText('-1', 80, GAME_HEIGHT - 60, '#e74c3c');
                this.caiso.showGuilty();

                // Spawn new villager to replace
                if (this.villagerCount > 0) {
                    this.spawnVillager(Date.now());
                }

                if (this.villagerCount <= 0) {
                    this.state = 'gameover';
                    this.caiso.expression = 'sad';
                }
            }
        }

        addFloatingText(text, x, y, color) {
            this.floatingTexts.push({ text, x, y, color, alpha: 1, vy: -2, life: 60 });
        }

        addParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                this.particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12 - 6,
                    color,
                    size: Math.random() * 8 + 4,
                    life: 40 + Math.random() * 20
                });
            }
        }

        update(deltaTime) {
            if (this.state !== 'playing') return;

            this.gameTime += deltaTime;

            // Villager timer
            this.villagerTimer += deltaTime;
            if (this.villagerTimer >= VILLAGER_CONSUME_INTERVAL) {
                this.villagerTimer = 0;
                this.consumeVillager();
            }

            // Combo timer
            if (this.comboTimer > 0) {
                this.comboTimer -= deltaTime;
                if (this.comboTimer <= 0) this.combo = 0;
            }

            // Update entities
            this.caiso.update(deltaTime);
            this.player.update(deltaTime);

            // Update villagers
            this.villagers.forEach(v => v.update(deltaTime, this.villagerTimer / VILLAGER_CONSUME_INTERVAL));
            this.villagers = this.villagers.filter(v => v.active);

            // Update flying foods
            this.flyingFoods.forEach((food, index) => {
                food.update(deltaTime);
                if (food.arrived) {
                    this.consumeFood(food.foodData);
                    this.flyingFoods.splice(index, 1);
                }
            });

            // Update particles
            this.particles = this.particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.4;
                p.life--;
                return p.life > 0;
            });

            // Update floating texts
            this.floatingTexts = this.floatingTexts.filter(t => {
                t.y += t.vy;
                t.alpha -= 0.015;
                t.life--;
                return t.life > 0;
            });
        }

        render() {
            this.drawBackground();

            if (this.state === 'loading') {
                this.drawLoadingScreen();
            } else if (this.state === 'menu') {
                this.drawMenuScreen();
            } else if (this.state === 'playing' || this.state === 'paused') {
                this.drawGame();
                if (this.state === 'paused') this.drawPauseMenu();
            } else if (this.state === 'gameover') {
                this.drawGameOverScreen();
            } else if (this.state === 'victory') {
                this.drawVictoryScreen();
            }
        }

        drawBackground() {
            const ctx = this.ctx;

            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            skyGrad.addColorStop(0, '#87CEEB');
            skyGrad.addColorStop(0.6, '#E0F7FA');
            skyGrad.addColorStop(1, '#81C784');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Sun
            ctx.fillStyle = '#FFF59D';
            ctx.beginPath();
            ctx.arc(100, 80, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFEB3B';
            ctx.beginPath();
            ctx.arc(100, 80, 30, 0, Math.PI * 2);
            ctx.fill();

            // Clouds
            this.drawCloud(ctx, 200, 60, 0.8);
            this.drawCloud(ctx, 500, 40, 1);
            this.drawCloud(ctx, 750, 70, 0.6);

            // Distant buildings (village)
            ctx.fillStyle = '#78909C';
            ctx.fillRect(20, 250, 40, 80);
            ctx.fillRect(70, 270, 35, 60);
            ctx.fillRect(115, 260, 45, 70);
            // Roofs
            ctx.fillStyle = '#5D4037';
            ctx.beginPath();
            ctx.moveTo(15, 250); ctx.lineTo(40, 220); ctx.lineTo(65, 250);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(65, 270); ctx.lineTo(87, 245); ctx.lineTo(110, 270);
            ctx.fill();

            // Ground
            ctx.fillStyle = '#81C784';
            ctx.fillRect(0, 430, GAME_WIDTH, 150);

            // Path/road
            ctx.fillStyle = '#A1887F';
            ctx.beginPath();
            ctx.moveTo(0, 400);
            ctx.quadraticCurveTo(GAME_WIDTH / 2, 420, GAME_WIDTH, 380);
            ctx.lineTo(GAME_WIDTH, 480);
            ctx.quadraticCurveTo(GAME_WIDTH / 2, 500, 0, 480);
            ctx.fill();

            // Grass tufts
            ctx.fillStyle = '#4CAF50';
            for (let i = 0; i < 20; i++) {
                const gx = (i * 47) % GAME_WIDTH;
                const gy = 440 + (i * 13) % 80;
                ctx.beginPath();
                ctx.moveTo(gx, gy);
                ctx.lineTo(gx - 5, gy - 15);
                ctx.lineTo(gx, gy - 10);
                ctx.lineTo(gx + 5, gy - 15);
                ctx.lineTo(gx, gy);
                ctx.fill();
            }
        }

        drawCloud(ctx, x, y, scale) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(x, y, 25 * scale, 0, Math.PI * 2);
            ctx.arc(x + 25 * scale, y - 10 * scale, 30 * scale, 0, Math.PI * 2);
            ctx.arc(x + 55 * scale, y, 25 * scale, 0, Math.PI * 2);
            ctx.arc(x + 30 * scale, y + 10 * scale, 20 * scale, 0, Math.PI * 2);
            ctx.fill();
        }

        drawGame() {
            const ctx = this.ctx;

            // Danger zone indicator
            const timerProgress = this.villagerTimer / VILLAGER_CONSUME_INTERVAL;
            ctx.fillStyle = `rgba(231, 76, 60, ${0.1 + timerProgress * 0.2})`;
            ctx.fillRect(GAME_WIDTH - 250, 300, 250, 200);

            // Draw villagers
            this.villagers.forEach(v => v.draw(ctx, this.images));

            // Draw Caiso
            this.caiso.draw(ctx, this.images);

            // Draw player
            this.player.draw(ctx, this.images);

            // Draw flying foods
            this.flyingFoods.forEach(food => food.draw(ctx));

            // Draw particles
            this.particles.forEach(p => {
                ctx.globalAlpha = p.life / 60;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Draw floating texts
            ctx.font = 'bold 26px Fredoka One';
            ctx.textAlign = 'center';
            this.floatingTexts.forEach(t => {
                ctx.globalAlpha = t.alpha;
                ctx.fillStyle = t.color;
                ctx.fillText(t.text, t.x, t.y);
            });
            ctx.globalAlpha = 1;

            this.drawUI();
        }

        drawUI() {
            const ctx = this.ctx;

            // Hunger bar
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            this.roundRect(ctx, 50, 15, GAME_WIDTH - 100, 35, 10);
            ctx.fill();

            const hungerWidth = (GAME_WIDTH - 110) * (this.hunger / 100);
            const hGrad = ctx.createLinearGradient(55, 0, 55 + hungerWidth, 0);
            if (this.hunger > 50) {
                hGrad.addColorStop(0, '#e74c3c');
                hGrad.addColorStop(1, '#c0392b');
            } else if (this.hunger > 25) {
                hGrad.addColorStop(0, '#f39c12');
                hGrad.addColorStop(1, '#e67e22');
            } else {
                hGrad.addColorStop(0, '#2ecc71');
                hGrad.addColorStop(1, '#27ae60');
            }
            ctx.fillStyle = hGrad;
            this.roundRect(ctx, 55, 20, hungerWidth, 25, 8);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 18px Fredoka One';
            ctx.textAlign = 'center';
            ctx.fillText(`HUNGER: ${this.hunger.toFixed(1)}%`, GAME_WIDTH / 2, 40);

            // Level
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            this.roundRect(ctx, 15, 55, 100, 35, 8);
            ctx.fill();
            ctx.fillStyle = '#00BCD4';
            ctx.font = 'bold 20px Fredoka One';
            ctx.textAlign = 'center';
            ctx.fillText(`LVL: ${this.level}`, 65, 80);

            // Combo
            if (this.combo > 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                this.roundRect(ctx, GAME_WIDTH - 130, 55, 115, 40, 8);
                ctx.fill();

                const comboColor = this.combo >= 10 ? '#e74c3c' :
                                   this.combo >= 5 ? '#f39c12' :
                                   this.combo >= 3 ? '#f1c40f' : '#fff';
                ctx.fillStyle = comboColor;
                ctx.font = 'bold 18px Fredoka One';
                ctx.textAlign = 'center';

                if (this.combo >= 10) {
                    ctx.fillText('FRENZY!', GAME_WIDTH - 72, 73);
                    ctx.fillText(`x${this.getComboMultiplier()}`, GAME_WIDTH - 72, 90);
                } else {
                    ctx.fillText(`COMBO x${this.combo}`, GAME_WIDTH - 72, 80);
                }
            }

            // Villager counter
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            this.roundRect(ctx, 15, GAME_HEIGHT - 75, 120, 55, 10);
            ctx.fill();

            const vColor = this.villagerCount > 50 ? '#2ecc71' :
                          this.villagerCount > 25 ? '#f39c12' : '#e74c3c';
            ctx.fillStyle = vColor;
            ctx.font = 'bold 26px Fredoka One';
            ctx.textAlign = 'center';
            ctx.fillText(`${this.villagerCount}`, 75, GAME_HEIGHT - 42);
            ctx.font = '14px Nunito';
            ctx.fillStyle = '#fff';
            ctx.fillText('VILLAGERS', 75, GAME_HEIGHT - 25);

            // Timer bar
            const timerProgress = this.villagerTimer / VILLAGER_CONSUME_INTERVAL;
            ctx.fillStyle = 'rgba(231, 76, 60, 0.3)';
            ctx.fillRect(0, GAME_HEIGHT - 8, GAME_WIDTH, 8);
            ctx.fillStyle = `rgb(231, ${Math.floor(76 + (1 - timerProgress) * 100)}, 60)`;
            ctx.fillRect(0, GAME_HEIGHT - 8, GAME_WIDTH * timerProgress, 8);

            // Food panel
            this.drawFoodPanel();

            // Controls
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '13px Nunito';
            ctx.textAlign = 'center';
            ctx.fillText('SPACE: Feed | C: Menu | 1-6: Select Food', GAME_WIDTH / 2, GAME_HEIGHT - 12);
        }

        drawFoodPanel() {
            const ctx = this.ctx;
            const panelX = GAME_WIDTH - 190;
            const panelY = GAME_HEIGHT - 90;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            this.roundRect(ctx, panelX, panelY, 175, 70, 10);
            ctx.fill();

            const foods = Object.entries(FOODS);
            let col = 0, row = 0;

            foods.forEach(([key, food], index) => {
                const x = panelX + 15 + col * 55;
                const y = panelY + 10 + row * 33;

                const isUnlocked = food.unlockLevel <= this.level;
                const isSelected = key === this.selectedFoodKey;

                if (isSelected && isUnlocked) {
                    ctx.fillStyle = 'rgba(108, 92, 231, 0.5)';
                    this.roundRect(ctx, x - 3, y - 3, 50, 28, 5);
                    ctx.fill();
                }

                const img = this.images.get(food.asset);
                if (img && isUnlocked) {
                    ctx.drawImage(img, x + 5, y, 35, 22);
                } else {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.font = '18px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🔒', x + 22, y + 18);
                }

                col++;
                if (col >= 3) { col = 0; row++; }
            });
        }

        drawMenuScreen() {
            const ctx = this.ctx;

            this.caiso.draw(ctx, this.images);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 52px Fredoka One';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#6c3483';
            ctx.lineWidth = 4;
            ctx.strokeText('FEEDING CAISO', GAME_WIDTH / 2, 90);
            ctx.fillText('FEEDING CAISO', GAME_WIDTH / 2, 90);

            ctx.font = 'bold 22px Fredoka One';
            ctx.fillStyle = '#9b59b6';
            ctx.fillText('Save the Villagers!', GAME_WIDTH / 2, 125);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            this.roundRect(ctx, GAME_WIDTH / 2 - 220, GAME_HEIGHT - 180, 440, 130, 15);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = '17px Nunito';
            ctx.fillText('Feed Caiso before it eats all the villagers!', GAME_WIDTH / 2, GAME_HEIGHT - 145);
            ctx.fillText('Reduce hunger to 0% to WIN!', GAME_WIDTH / 2, GAME_HEIGHT - 120);
            ctx.fillText('Every 2 seconds, Caiso eats a villager...', GAME_WIDTH / 2, GAME_HEIGHT - 95);

            ctx.font = 'bold 26px Fredoka One';
            ctx.fillStyle = '#f1c40f';
            const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
            ctx.globalAlpha = pulse;
            ctx.fillText('PRESS SPACE OR TAP TO START', GAME_WIDTH / 2, GAME_HEIGHT - 55);
            ctx.globalAlpha = 1;
        }

        drawPauseMenu() {
            const ctx = this.ctx;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = 'rgba(45, 52, 54, 0.95)';
            this.roundRect(ctx, GAME_WIDTH / 2 - 200, 80, 400, 400, 20);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 30px Fredoka One';
            ctx.textAlign = 'center';
            ctx.fillText('CHOOSE FOOD', GAME_WIDTH / 2, 130);

            const foods = Object.entries(FOODS);
            foods.forEach(([key, food], index) => {
                const y = 180 + index * 50;
                const isUnlocked = food.unlockLevel <= this.level;
                const isSelected = key === this.selectedFoodKey;

                ctx.fillStyle = isSelected ? 'rgba(108, 92, 231, 0.5)' : 'rgba(0, 0, 0, 0.3)';
                this.roundRect(ctx, GAME_WIDTH / 2 - 170, y - 18, 340, 42, 8);
                ctx.fill();

                const img = this.images.get(food.asset);
                if (img && isUnlocked) {
                    ctx.drawImage(img, GAME_WIDTH / 2 - 155, y - 12, 40, 30);
                } else {
                    ctx.fillStyle = '#666';
                    ctx.font = '22px Arial';
                    ctx.textAlign = 'left';
                    ctx.fillText('🔒', GAME_WIDTH / 2 - 150, y + 8);
                }

                ctx.font = '17px Nunito';
                ctx.textAlign = 'left';
                ctx.fillStyle = isUnlocked ? '#fff' : '#666';
                ctx.fillText(food.name, GAME_WIDTH / 2 - 100, y + 6);

                ctx.textAlign = 'right';
                if (isUnlocked) {
                    ctx.fillStyle = '#2ecc71';
                    ctx.fillText(`-${food.hungerReduction}%`, GAME_WIDTH / 2 + 90, y + 6);
                    ctx.fillStyle = '#a29bfe';
                    ctx.fillText(`[${food.key}]`, GAME_WIDTH / 2 + 150, y + 6);
                } else {
                    ctx.fillStyle = '#e74c3c';
                    ctx.fillText(`Lv.${food.unlockLevel}`, GAME_WIDTH / 2 + 150, y + 6);
                }
            });

            ctx.fillStyle = '#a29bfe';
            ctx.font = '16px Nunito';
            ctx.textAlign = 'center';
            ctx.fillText('Press C to close', GAME_WIDTH / 2, 470);
        }

        drawGameOverScreen() {
            const ctx = this.ctx;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            this.caiso.expression = 'sad';
            this.caiso.draw(ctx, this.images);

            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 54px Fredoka One';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', GAME_WIDTH / 2, 90);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            this.roundRect(ctx, GAME_WIDTH / 2 - 150, GAME_HEIGHT - 200, 300, 110, 15);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = '18px Nunito';
            ctx.fillText(`Final Level: ${this.level}`, GAME_WIDTH / 2, GAME_HEIGHT - 165);
            ctx.fillText(`Max Combo: ${this.maxCombo}x`, GAME_WIDTH / 2, GAME_HEIGHT - 140);
            ctx.fillText(`Time: ${Math.floor(this.gameTime / 1000)}s`, GAME_WIDTH / 2, GAME_HEIGHT - 115);

            ctx.font = 'bold 24px Fredoka One';
            ctx.fillStyle = '#f1c40f';
            ctx.fillText('PRESS R OR TAP TO RETRY', GAME_WIDTH / 2, GAME_HEIGHT - 50);
        }

        drawVictoryScreen() {
            const ctx = this.ctx;

            ctx.fillStyle = 'rgba(46, 204, 113, 0.25)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Particles
            this.particles.forEach(p => {
                ctx.globalAlpha = p.life / 60;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            this.caiso.expression = 'happy';
            this.caiso.draw(ctx, this.images);

            ctx.fillStyle = '#2ecc71';
            ctx.font = 'bold 54px Fredoka One';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.strokeText('YOU WIN!', GAME_WIDTH / 2, 90);
            ctx.fillText('YOU WIN!', GAME_WIDTH / 2, 90);

            ctx.fillStyle = '#f1c40f';
            ctx.font = 'bold 22px Fredoka One';
            ctx.fillText('Caiso is full! Villagers are safe!', GAME_WIDTH / 2, 125);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            this.roundRect(ctx, GAME_WIDTH / 2 - 150, GAME_HEIGHT - 200, 300, 130, 15);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = '18px Nunito';
            ctx.fillText(`Final Level: ${this.level}`, GAME_WIDTH / 2, GAME_HEIGHT - 165);
            ctx.fillText(`Max Combo: ${this.maxCombo}x`, GAME_WIDTH / 2, GAME_HEIGHT - 140);
            ctx.fillText(`Villagers Saved: ${this.villagerCount}`, GAME_WIDTH / 2, GAME_HEIGHT - 115);
            ctx.fillText(`Time: ${Math.floor(this.gameTime / 1000)}s`, GAME_WIDTH / 2, GAME_HEIGHT - 90);

            ctx.font = 'bold 24px Fredoka One';
            ctx.fillStyle = '#f1c40f';
            ctx.fillText('PRESS R OR TAP TO PLAY AGAIN', GAME_WIDTH / 2, GAME_HEIGHT - 40);

            // Celebration particles
            if (Math.random() < 0.15) {
                this.addParticles(
                    Math.random() * GAME_WIDTH,
                    Math.random() * GAME_HEIGHT / 2,
                    ['#f1c40f', '#2ecc71', '#e74c3c', '#9b59b6'][Math.floor(Math.random() * 4)],
                    5
                );
            }
        }

        drawLoadingScreen() {
            const ctx = this.ctx;
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.fillStyle = '#a29bfe';
            ctx.font = '32px Fredoka One';
            ctx.textAlign = 'center';
            ctx.fillText('Loading...', GAME_WIDTH / 2, GAME_HEIGHT / 2);
        }

        roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        gameLoop(timestamp) {
            const deltaTime = Math.min(timestamp - this.lastTime, 50);
            this.lastTime = timestamp;

            this.update(deltaTime);
            this.render();

            requestAnimationFrame((t) => this.gameLoop(t));
        }

        start() {
            requestAnimationFrame((t) => this.gameLoop(t));
        }
    }

    // Initialize
    const canvas = document.getElementById('gameCanvas');
    const game = new Game(canvas);
    game.start();
    </script>
</body>
</html>
