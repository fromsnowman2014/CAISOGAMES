<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feeding Caiso v4.0 - Phase 4: Neon Kawaii</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #0a0a1a;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Nunito', sans-serif;
        }

        #version-indicator {
            position: absolute;
            bottom: 5px;
            right: 5px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            z-index: 9999;
            pointer-events: none;
        }

        /* Portrait Container (9:16) - Mobile First */
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 854px;
            margin: 0 auto;
            overflow: hidden;
            touch-action: none;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        /* Canvas fills container */
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Desktop fallback - centered with pillarbox */
        @media (min-aspect-ratio: 9/16) {
            #gameContainer {
                height: 100vh;
                width: calc(100vh * 9 / 16);
                max-width: none;
                max-height: none;
                box-shadow: 0 0 60px rgba(108, 92, 231, 0.4);
                border-radius: 16px;
            }
        }

        /* Feed button - always visible on mobile */
        #touchFeedBtn {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            font-size: 22px;
            font-family: 'Fredoka One', cursive;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: 4px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.6), 0 0 30px rgba(108, 92, 231, 0.4);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        #touchFeedBtn:active {
            transform: translateX(-50%) scale(0.9);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.8);
        }

        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-text {
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            color: #a29bfe;
            animation: pulse 1s infinite;
        }

        .loading-bar {
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }

        .loading-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            border-radius: 4px;
            animation: load 2s ease-out forwards;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        @keyframes load {
            to {
                width: 100%;
            }
        }

        #backBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 14px;
            font-size: 12px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        #backBtn:hover,
        #backBtn:active {
            background: rgba(108, 92, 231, 0.8);
            border-color: rgba(108, 92, 231, 1);
        }

        #backBtn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <div id="version-indicator">v4.0 - Phase 4 (Modular)</div>
        <a href="../../" id="backBtn">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
            Hub
        </a>
        <canvas id="gameCanvas"></canvas>
        <button id="touchFeedBtn">FEED!</button>
        <div id="loadingScreen">
            <div class="loading-text">Loading...</div>
            <div class="loading-bar">
                <div class="loading-fill"></div>
            </div>
        </div>
    </div>

    <!-- ES Module Entry Point -->
    <script type="module">
        import { Game } from '/src/core/Game.js';

        // Wait for DOM
        window.onload = () => {
            const canvas = document.getElementById('gameCanvas');
            const game = new Game(canvas);
            game.start();
        };
    </script>
</body>

</html>
