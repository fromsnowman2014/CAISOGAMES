<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feeding Caiso v5.0 - Refactored</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #0a0a1a;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Nunito', sans-serif;
        }

        #version-indicator {
            position: absolute;
            bottom: 5px;
            right: 5px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            z-index: 9999;
            pointer-events: none;
        }

        /* Portrait Container (9:16) - Mobile First */
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 854px;
            margin: 0 auto;
            overflow: hidden;
            touch-action: none;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        /* Canvas fills container */
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Desktop fallback - centered with pillarbox */
        @media (min-aspect-ratio: 9/16) {
            #gameContainer {
                height: 100vh;
                width: calc(100vh * 9 / 16);
                max-width: none;
                max-height: none;
                box-shadow: 0 0 60px rgba(108, 92, 231, 0.4);
                border-radius: 16px;
            }
        }

        /* Feed button - always visible on mobile */
        #touchFeedBtn {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            font-size: 22px;
            font-family: 'Fredoka One', cursive;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: 4px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.6), 0 0 30px rgba(108, 92, 231, 0.4);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        #touchFeedBtn:active {
            transform: translateX(-50%) scale(0.9);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.8);
        }

        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-text {
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            color: #a29bfe;
            animation: pulse 1s infinite;
        }

        .loading-bar {
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }

        .loading-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            border-radius: 4px;
            animation: load 2s ease-out forwards;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        @keyframes load {
            to {
                width: 100%;
            }
        }

        #backBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 14px;
            font-size: 12px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        #backBtn:hover,
        #backBtn:active {
            background: rgba(108, 92, 231, 0.8);
            border-color: rgba(108, 92, 231, 1);
        }

        /* Glassmorphism UI */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Let clicks pass through to canvas by default */
            display: none;
            /* Hidden by default, shown in game */
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            pointer-events: auto;
        }

        /* Top Bar */
        #top-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        #level-badge {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.2);
            border: 2px solid rgba(0, 212, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        #hunger-container {
            flex-grow: 1;
            margin: 0 15px;
            height: 24px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #hunger-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            border-radius: 12px;
            transition: width 0.3s ease, background 0.3s ease;
        }

        #hunger-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        #combo-display {
            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            color: #f1c40f;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            min-width: 40px;
            text-align: right;
        }

        /* Bottom Bar */
        #bottom-bar {
            position: absolute;
            bottom: 140px;
            /* Above feed button */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        #villager-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 16px;
            color: #fff;
        }

        #villager-count {
            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            color: #2ecc71;
        }

        .stat-label {
            font-size: 10px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* Food Selector */
        #food-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 240px;
        }

        .food-item {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
            position: relative;
        }

        .food-item.selected {
            border-color: #a29bfe;
            background: rgba(108, 92, 231, 0.3);
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.4);
        }

        .food-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .food-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        /* Danger/Timer Bar */
        #danger-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(231, 76, 60, 0.2);
        }

        #danger-bar-fill {
            height: 100%;
            background: #e74c3c;
            width: 0%;
            transition: width 0.1s linear;
        }
    </style>
    <style>
        /* Separating back button style just to be clean */
        #backBtn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <div id="version-indicator">v5.0 - Refactored</div>
        <a href="../../" id="backBtn">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
            Hub
        </a>

        <!-- Glassmorphism HUD -->
        <div id="ui-layer">
            <div id="top-bar" class="glass-panel">
                <div id="level-badge">1</div>
                <div id="hunger-container">
                    <div id="hunger-bar"></div>
                    <span id="hunger-text">100%</span>
                </div>
                <div id="combo-display"></div>
            </div>

            <div id="bottom-bar">
                <div id="villager-stat" class="glass-panel">
                    <span id="villager-count">100</span>
                    <span class="stat-label">SPIRITS</span>
                </div>

                <div id="food-selector">
                    <!-- Food items injected by JS -->
                </div>
            </div>

            <div id="danger-bar-container">
                <div id="danger-bar-fill"></div>
            </div>

            <!-- Fever overlay/indicator could go here -->
        </div>

        <canvas id="gameCanvas"></canvas>
        <button id="touchFeedBtn">FEED!</button>
        <div id="loadingScreen">
            <div class="loading-text">Loading...</div>
            <div class="loading-bar">
                <div class="loading-fill"></div>
            </div>
        </div>
    </div>

    <!-- ES Module Entry Point -->
    <script type="module">
        import { Game } from './src/core/Game.js';

        // Wait for DOM
        window.onload = () => {
            const canvas = document.getElementById('gameCanvas');
            const game = new Game(canvas);
            game.start();
        };
    </script>
</body>

</html>
