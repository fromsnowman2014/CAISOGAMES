<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Caiso Mario - Chess Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(218, 165, 32, 0.3);
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #backBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #DAA520;
            border: 2px solid #DAA520;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            z-index: 100;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        #backBtn:hover {
            background: #DAA520;
            color: #000;
        }

        #backBtn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        #touchControls {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            padding: 0 20px;
        }

        .touch-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: rgba(218, 165, 32, 0.5);
            border-color: #DAA520;
        }

        .dpad {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
        }

        .dpad .touch-btn {
            width: 50px;
            height: 50px;
        }

        .action-btns {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            gap: 15px;
        }

        @media (max-width: 900px) or (pointer: coarse) {
            #touchControls {
                display: block;
            }
        }

        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #DAA520;
            z-index: 1000;
        }

        .loading-title {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #DAA520;
        }

        .loading-bar {
            width: 200px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
        }

        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #DAA520, #FFD700);
            width: 0%;
            transition: width 0.3s;
        }

        .loading-text {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <a href="../../" id="backBtn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Hub
        </a>
        <div id="touchControls">
            <div class="dpad">
                <div></div>
                <div class="touch-btn" data-key="up">↑</div>
                <div></div>
                <div class="touch-btn" data-key="left">←</div>
                <div></div>
                <div class="touch-btn" data-key="right">→</div>
                <div></div>
                <div class="touch-btn" data-key="down">↓</div>
                <div></div>
            </div>
            <div class="action-btns">
                <div class="touch-btn" data-key="attack" style="background: rgba(255,100,100,0.3);">⚔</div>
                <div class="touch-btn" data-key="jump" style="background: rgba(100,255,100,0.3);">⬆</div>
            </div>
        </div>
        <div id="loadingScreen">
            <div class="loading-title">♟ CAISO MARIO ♟</div>
            <div class="loading-bar">
                <div class="loading-fill" id="loadingFill"></div>
            </div>
            <div class="loading-text" id="loadingText">Loading...</div>
        </div>
    </div>

    <script>
    // ============================================
    // CAISO MARIO - Chess Platformer Game
    // ============================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game dimensions
    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;
    const TILE_SIZE = 32;

    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    // Responsive scaling
    function resizeGame() {
        const container = document.getElementById('gameContainer');
        const maxWidth = window.innerWidth - 20;
        const maxHeight = window.innerHeight - 20;
        const scale = Math.min(maxWidth / GAME_WIDTH, maxHeight / GAME_HEIGHT);

        container.style.width = (GAME_WIDTH * scale) + 'px';
        container.style.height = (GAME_HEIGHT * scale) + 'px';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
    }
    window.addEventListener('resize', resizeGame);
    resizeGame();

    // ============================================
    // PHYSICS CONSTANTS (Mario-style)
    // ============================================
    const PHYSICS = {
        GRAVITY_HOLDING: 0.45,
        GRAVITY_FALLING: 0.85,
        MAX_FALL_SPEED: 14,
        JUMP_FORCE: -13.5,
        JUMP_CUT: 0.4,
        ACCELERATION: 0.6,
        DECELERATION: 0.4,
        MAX_SPEED: 5.5,
        SPRINT_SPEED: 7.5,
        AIR_CONTROL: 0.65,
        FRICTION: 0.82,
        COYOTE_TIME: 8,
        JUMP_BUFFER: 10,
        CORNER_CORRECT: 6
    };

    // ============================================
    // INPUT HANDLER
    // ============================================
    const Input = {
        keys: {},
        justPressed: {},

        init() {
            window.addEventListener('keydown', (e) => {
                if (!this.keys[e.code]) {
                    this.justPressed[e.code] = true;
                }
                this.keys[e.code] = true;
                if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                    e.preventDefault();
                }
            });

            window.addEventListener('keyup', (e) => {
                this.keys[e.code] = false;
            });

            // Touch controls
            document.querySelectorAll('.touch-btn').forEach(btn => {
                const key = btn.dataset.key;
                const keyMap = {
                    'up': 'ArrowUp',
                    'down': 'ArrowDown',
                    'left': 'ArrowLeft',
                    'right': 'ArrowRight',
                    'jump': 'Space',
                    'attack': 'KeyZ'
                };

                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const code = keyMap[key];
                    if (!this.keys[code]) this.justPressed[code] = true;
                    this.keys[code] = true;
                });

                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.keys[keyMap[key]] = false;
                });
            });
        },

        isDown(key) {
            return this.keys[key] || false;
        },

        wasPressed(key) {
            return this.justPressed[key] || false;
        },

        clear() {
            this.justPressed = {};
        },

        get left() { return this.isDown('ArrowLeft') || this.isDown('KeyA'); },
        get right() { return this.isDown('ArrowRight') || this.isDown('KeyD'); },
        get jump() { return this.isDown('Space') || this.isDown('KeyW') || this.isDown('ArrowUp'); },
        get jumpPressed() { return this.wasPressed('Space') || this.wasPressed('KeyW') || this.wasPressed('ArrowUp'); },
        get attack() { return this.wasPressed('KeyZ') || this.wasPressed('KeyJ'); },
        get sprint() { return this.isDown('ShiftLeft') || this.isDown('ShiftRight'); }
    };

    // ============================================
    // SPRITE GENERATOR (Procedural)
    // ============================================
    const Sprites = {
        cache: {},

        // Generate player sprite
        createPlayer() {
            const frames = [];
            const colors = {
                skin: '#FFD5B8',
                hair: '#2D1810',
                shirt: '#FFFFFF',
                vest: '#90EE90',
                pants: '#8B4513',
                shoes: '#2D1810',
                glasses: '#333333'
            };

            // Idle frame
            for (let f = 0; f < 4; f++) {
                const c = document.createElement('canvas');
                c.width = 32; c.height = 48;
                const x = c.getContext('2d');

                const bounce = Math.sin(f * Math.PI / 2) * 1;

                // Legs
                x.fillStyle = colors.pants;
                x.fillRect(10, 32 - bounce, 5, 10);
                x.fillRect(17, 32 - bounce, 5, 10);

                // Shoes
                x.fillStyle = colors.shoes;
                x.fillRect(9, 41 - bounce, 6, 5);
                x.fillRect(17, 41 - bounce, 6, 5);

                // Body
                x.fillStyle = colors.shirt;
                x.fillRect(8, 18 - bounce, 16, 16);

                // Vest
                x.fillStyle = colors.vest;
                x.fillRect(8, 18 - bounce, 5, 14);
                x.fillRect(19, 18 - bounce, 5, 14);

                // Arms
                x.fillStyle = colors.skin;
                x.fillRect(4, 20 - bounce, 4, 10);
                x.fillRect(24, 20 - bounce, 4, 10);

                // Head
                x.fillStyle = colors.skin;
                x.fillRect(9, 4 - bounce, 14, 14);

                // Hair
                x.fillStyle = colors.hair;
                x.fillRect(9, 2 - bounce, 14, 6);
                x.fillRect(8, 5 - bounce, 3, 4);
                x.fillRect(21, 5 - bounce, 3, 4);

                // Glasses
                x.fillStyle = colors.glasses;
                x.fillRect(10, 9 - bounce, 5, 4);
                x.fillRect(17, 9 - bounce, 5, 4);
                x.fillRect(15, 10 - bounce, 2, 2);

                // Eyes behind glasses
                x.fillStyle = '#FFFFFF';
                x.fillRect(11, 10 - bounce, 3, 2);
                x.fillRect(18, 10 - bounce, 3, 2);
                x.fillStyle = '#000000';
                x.fillRect(12, 10 - bounce, 2, 2);
                x.fillRect(19, 10 - bounce, 2, 2);

                frames.push(c);
            }

            this.cache.playerIdle = frames;

            // Running frames
            const runFrames = [];
            for (let f = 0; f < 8; f++) {
                const c = document.createElement('canvas');
                c.width = 32; c.height = 48;
                const x = c.getContext('2d');

                const legPhase = Math.sin(f * Math.PI / 2);
                const armPhase = Math.cos(f * Math.PI / 2);
                const bodyBob = Math.abs(Math.sin(f * Math.PI / 4)) * 2;

                // Left leg
                x.fillStyle = colors.pants;
                x.fillRect(10 + legPhase * 3, 32 - bodyBob, 5, 10);
                // Right leg
                x.fillRect(17 - legPhase * 3, 32 - bodyBob, 5, 10);

                // Shoes
                x.fillStyle = colors.shoes;
                x.fillRect(9 + legPhase * 4, 41 - bodyBob, 6, 5);
                x.fillRect(17 - legPhase * 4, 41 - bodyBob, 6, 5);

                // Body
                x.fillStyle = colors.shirt;
                x.fillRect(8, 18 - bodyBob, 16, 16);

                // Vest
                x.fillStyle = colors.vest;
                x.fillRect(8, 18 - bodyBob, 5, 14);
                x.fillRect(19, 18 - bodyBob, 5, 14);

                // Arms
                x.fillStyle = colors.skin;
                x.fillRect(4 + armPhase * 3, 20 - bodyBob, 4, 10);
                x.fillRect(24 - armPhase * 3, 20 - bodyBob, 4, 10);

                // Head
                x.fillStyle = colors.skin;
                x.fillRect(9, 4 - bodyBob, 14, 14);

                // Hair
                x.fillStyle = colors.hair;
                x.fillRect(9, 2 - bodyBob, 14, 6);
                x.fillRect(8, 5 - bodyBob, 3, 4);
                x.fillRect(21, 5 - bodyBob, 3, 4);

                // Glasses
                x.fillStyle = colors.glasses;
                x.fillRect(10, 9 - bodyBob, 5, 4);
                x.fillRect(17, 9 - bodyBob, 5, 4);
                x.fillRect(15, 10 - bodyBob, 2, 2);

                // Eyes
                x.fillStyle = '#FFFFFF';
                x.fillRect(11, 10 - bodyBob, 3, 2);
                x.fillRect(18, 10 - bodyBob, 3, 2);
                x.fillStyle = '#000000';
                x.fillRect(12, 10 - bodyBob, 2, 2);
                x.fillRect(19, 10 - bodyBob, 2, 2);

                runFrames.push(c);
            }
            this.cache.playerRun = runFrames;

            // Jump frame
            const jumpC = document.createElement('canvas');
            jumpC.width = 32; jumpC.height = 48;
            const jx = jumpC.getContext('2d');

            // Legs spread
            jx.fillStyle = colors.pants;
            jx.fillRect(8, 34, 5, 8);
            jx.fillRect(19, 34, 5, 8);
            jx.fillStyle = colors.shoes;
            jx.fillRect(7, 41, 6, 5);
            jx.fillRect(19, 41, 6, 5);

            // Body raised
            jx.fillStyle = colors.shirt;
            jx.fillRect(8, 16, 16, 16);
            jx.fillStyle = colors.vest;
            jx.fillRect(8, 16, 5, 14);
            jx.fillRect(19, 16, 5, 14);

            // Arms up
            jx.fillStyle = colors.skin;
            jx.fillRect(3, 14, 4, 10);
            jx.fillRect(25, 14, 4, 10);

            // Head
            jx.fillStyle = colors.skin;
            jx.fillRect(9, 2, 14, 14);
            jx.fillStyle = colors.hair;
            jx.fillRect(9, 0, 14, 6);
            jx.fillRect(8, 3, 3, 4);
            jx.fillRect(21, 3, 3, 4);

            // Glasses & eyes
            jx.fillStyle = colors.glasses;
            jx.fillRect(10, 7, 5, 4);
            jx.fillRect(17, 7, 5, 4);
            jx.fillRect(15, 8, 2, 2);
            jx.fillStyle = '#FFFFFF';
            jx.fillRect(11, 8, 3, 2);
            jx.fillRect(18, 8, 3, 2);
            jx.fillStyle = '#000000';
            jx.fillRect(12, 8, 2, 2);
            jx.fillRect(19, 8, 2, 2);

            this.cache.playerJump = [jumpC];

            // Fall frame (similar but arms down)
            const fallC = document.createElement('canvas');
            fallC.width = 32; fallC.height = 48;
            const fx = fallC.getContext('2d');

            fx.drawImage(jumpC, 0, 0);
            fx.fillStyle = colors.skin;
            fx.clearRect(3, 14, 4, 10);
            fx.clearRect(25, 14, 4, 10);
            fx.fillRect(2, 18, 4, 12);
            fx.fillRect(26, 18, 4, 12);

            this.cache.playerFall = [fallC];
        },

        // Generate enemy sprites
        createEnemies() {
            // Stone Pawn
            const pawnFrames = [];
            for (let f = 0; f < 4; f++) {
                const c = document.createElement('canvas');
                c.width = 24; c.height = 32;
                const x = c.getContext('2d');

                const wobble = Math.sin(f * Math.PI / 2) * 1;

                // Base
                x.fillStyle = '#4A4A4A';
                x.fillRect(4, 24 + wobble, 16, 8);

                // Body
                x.fillStyle = '#5A5A5A';
                x.fillRect(6, 10 + wobble, 12, 16);

                // Head
                x.fillStyle = '#6A6A6A';
                x.beginPath();
                x.arc(12, 8 + wobble, 6, 0, Math.PI * 2);
                x.fill();

                // Glowing crack (eye)
                x.fillStyle = '#FF4444';
                x.fillRect(9, 6 + wobble, 2, 4);
                x.fillRect(13, 6 + wobble, 2, 4);

                // Rune markings
                x.fillStyle = '#8B0000';
                x.fillRect(8, 16 + wobble, 8, 2);
                x.fillRect(11, 14 + wobble, 2, 6);

                pawnFrames.push(c);
            }
            this.cache.enemyPawn = pawnFrames;

            // Jumping Knight
            const knightFrames = [];
            for (let f = 0; f < 4; f++) {
                const c = document.createElement('canvas');
                c.width = 32; c.height = 40;
                const x = c.getContext('2d');

                // Body
                x.fillStyle = '#2A2A2A';
                x.fillRect(8, 20, 16, 18);

                // Horse head
                x.fillStyle = '#3A3A3A';
                x.fillRect(6, 4, 20, 18);
                x.fillRect(2, 8, 6, 10);

                // Ears
                x.fillRect(8, 0, 4, 6);
                x.fillRect(20, 0, 4, 6);

                // Glowing eyes
                x.fillStyle = '#FF6600';
                x.fillRect(4, 12, 3, 3);

                // Armor details
                x.fillStyle = '#1A1A1A';
                x.fillRect(10, 22, 12, 2);
                x.fillRect(14, 24, 4, 12);

                knightFrames.push(c);
            }
            this.cache.enemyKnight = knightFrames;

            // Sniper Bishop
            const bishopFrames = [];
            for (let f = 0; f < 4; f++) {
                const c = document.createElement('canvas');
                c.width = 28; c.height = 44;
                const x = c.getContext('2d');

                // Robe
                x.fillStyle = '#4B0082';
                x.fillRect(6, 16, 16, 26);
                x.fillRect(4, 20, 20, 20);

                // Hood/head
                x.fillStyle = '#3A0066';
                x.fillRect(8, 8, 12, 12);

                // Pointed top
                x.beginPath();
                x.moveTo(14, 0);
                x.lineTo(8, 10);
                x.lineTo(20, 10);
                x.closePath();
                x.fill();

                // Glowing slit
                x.fillStyle = '#9400D3';
                x.fillRect(12, 14, 4, 2);

                // Staff
                x.fillStyle = '#DAA520';
                x.fillRect(24, 8, 3, 32);
                x.fillStyle = '#FFD700';
                x.fillRect(23, 4, 5, 6);

                bishopFrames.push(c);
            }
            this.cache.enemyBishop = bishopFrames;

            // Charging Rook
            const rookFrames = [];
            for (let f = 0; f < 4; f++) {
                const c = document.createElement('canvas');
                c.width = 36; c.height = 36;
                const x = c.getContext('2d');

                // Base
                x.fillStyle = '#1A1A1A';
                x.fillRect(4, 28, 28, 8);

                // Tower body
                x.fillStyle = '#2A2A2A';
                x.fillRect(6, 8, 24, 22);

                // Battlements
                x.fillRect(4, 2, 6, 8);
                x.fillRect(15, 2, 6, 8);
                x.fillRect(26, 2, 6, 8);

                // Gold trim
                x.fillStyle = '#DAA520';
                x.fillRect(6, 6, 24, 2);
                x.fillRect(6, 26, 24, 2);

                // Glowing window
                x.fillStyle = '#FF0000';
                x.fillRect(14, 14, 8, 8);
                x.fillStyle = '#FF6666';
                x.fillRect(16, 16, 4, 4);

                rookFrames.push(c);
            }
            this.cache.enemyRook = rookFrames;
        },

        // Generate weapon sprites
        createWeapons() {
            // Pawn weapon
            const pawnW = document.createElement('canvas');
            pawnW.width = 16; pawnW.height = 24;
            const pw = pawnW.getContext('2d');

            pw.fillStyle = '#8B4513';
            pw.fillRect(6, 8, 4, 14);
            pw.fillStyle = '#A0522D';
            pw.beginPath();
            pw.arc(8, 6, 5, 0, Math.PI * 2);
            pw.fill();
            pw.fillStyle = '#DAA520';
            pw.beginPath();
            pw.arc(8, 6, 3, 0, Math.PI * 2);
            pw.fill();

            this.cache.weaponPawn = pawnW;
        },

        // Generate tiles
        createTiles() {
            // Ground tile (bookshelf wood)
            const ground = document.createElement('canvas');
            ground.width = 32; ground.height = 32;
            const gx = ground.getContext('2d');

            gx.fillStyle = '#5D4E37';
            gx.fillRect(0, 0, 32, 32);
            gx.fillStyle = '#4A3F2F';
            gx.fillRect(0, 0, 32, 4);
            gx.fillRect(0, 28, 32, 4);
            gx.fillStyle = '#6B5B45';
            for (let i = 0; i < 4; i++) {
                gx.fillRect(i * 8 + 2, 6, 4, 20);
            }

            this.cache.tileGround = ground;

            // Platform (book)
            const platform = document.createElement('canvas');
            platform.width = 32; platform.height = 16;
            const px = platform.getContext('2d');

            px.fillStyle = '#8B0000';
            px.fillRect(0, 0, 32, 16);
            px.fillStyle = '#A52A2A';
            px.fillRect(2, 2, 28, 2);
            px.fillStyle = '#FFFAF0';
            px.fillRect(4, 6, 24, 8);
            px.fillStyle = '#DAA520';
            px.fillRect(0, 0, 3, 16);

            this.cache.tilePlatform = platform;

            // Chess tiles
            const whiteChess = document.createElement('canvas');
            whiteChess.width = 32; whiteChess.height = 32;
            const wcx = whiteChess.getContext('2d');
            wcx.fillStyle = '#F5F5F5';
            wcx.fillRect(0, 0, 32, 32);
            wcx.fillStyle = '#E8E8E8';
            wcx.fillRect(0, 0, 32, 2);
            wcx.fillRect(0, 0, 2, 32);

            this.cache.tileWhite = whiteChess;

            const blackChess = document.createElement('canvas');
            blackChess.width = 32; blackChess.height = 32;
            const bcx = blackChess.getContext('2d');
            bcx.fillStyle = '#2A2A2A';
            bcx.fillRect(0, 0, 32, 32);
            bcx.fillStyle = '#1A1A1A';
            bcx.fillRect(0, 0, 32, 2);
            bcx.fillRect(0, 0, 2, 32);

            this.cache.tileBlack = blackChess;
        },

        // Generate UI elements
        createUI() {
            // Heart icon
            const heart = document.createElement('canvas');
            heart.width = 20; heart.height = 20;
            const hx = heart.getContext('2d');

            hx.fillStyle = '#FF4444';
            hx.beginPath();
            hx.moveTo(10, 18);
            hx.bezierCurveTo(2, 12, 2, 4, 10, 8);
            hx.bezierCurveTo(18, 4, 18, 12, 10, 18);
            hx.fill();
            hx.fillStyle = '#FF8888';
            hx.beginPath();
            hx.arc(6, 7, 2, 0, Math.PI * 2);
            hx.fill();

            this.cache.uiHeart = heart;

            // Empty heart
            const emptyHeart = document.createElement('canvas');
            emptyHeart.width = 20; emptyHeart.height = 20;
            const ehx = emptyHeart.getContext('2d');

            ehx.strokeStyle = '#666666';
            ehx.lineWidth = 2;
            ehx.beginPath();
            ehx.moveTo(10, 18);
            ehx.bezierCurveTo(2, 12, 2, 4, 10, 8);
            ehx.bezierCurveTo(18, 4, 18, 12, 10, 18);
            ehx.stroke();

            this.cache.uiHeartEmpty = emptyHeart;

            // Coin
            const coin = document.createElement('canvas');
            coin.width = 16; coin.height = 16;
            const cx = coin.getContext('2d');

            cx.fillStyle = '#FFD700';
            cx.beginPath();
            cx.arc(8, 8, 7, 0, Math.PI * 2);
            cx.fill();
            cx.fillStyle = '#DAA520';
            cx.beginPath();
            cx.arc(8, 8, 5, 0, Math.PI * 2);
            cx.fill();
            cx.fillStyle = '#FFD700';
            cx.font = 'bold 10px sans-serif';
            cx.textAlign = 'center';
            cx.fillText('$', 8, 12);

            this.cache.uiCoin = coin;
        },

        init() {
            this.createPlayer();
            this.createEnemies();
            this.createWeapons();
            this.createTiles();
            this.createUI();
        }
    };

    // ============================================
    // GAME ENTITIES
    // ============================================
    class Entity {
        constructor(x, y, width, height) {
            this.x = x;
            this.y = y;
            this.width = width;
            this.height = height;
            this.velocityX = 0;
            this.velocityY = 0;
            this.facing = 1; // 1 = right, -1 = left
        }

        get left() { return this.x; }
        get right() { return this.x + this.width; }
        get top() { return this.y; }
        get bottom() { return this.y + this.height; }
        get centerX() { return this.x + this.width / 2; }
        get centerY() { return this.y + this.height / 2; }

        intersects(other) {
            return this.left < other.right &&
                   this.right > other.left &&
                   this.top < other.bottom &&
                   this.bottom > other.top;
        }
    }

    class Player extends Entity {
        constructor(x, y) {
            super(x, y, 24, 44);
            this.hp = 3;
            this.maxHp = 3;
            this.grounded = false;
            this.coyoteTime = 0;
            this.jumpBuffer = 0;
            this.attacking = false;
            this.attackTimer = 0;
            this.invincible = false;
            this.invincibleTimer = 0;
            this.animFrame = 0;
            this.animTimer = 0;
            this.state = 'idle';
            this.coins = 0;
            this.score = 0;
        }

        update(level) {
            // Handle input
            const accel = this.grounded ? PHYSICS.ACCELERATION : PHYSICS.ACCELERATION * PHYSICS.AIR_CONTROL;

            if (Input.left) {
                this.velocityX -= accel;
                this.facing = -1;
            } else if (Input.right) {
                this.velocityX += accel;
                this.facing = 1;
            } else {
                this.velocityX *= PHYSICS.FRICTION;
                if (Math.abs(this.velocityX) < 0.1) this.velocityX = 0;
            }

            // Max speed
            const maxSpeed = Input.sprint ? PHYSICS.SPRINT_SPEED : PHYSICS.MAX_SPEED;
            this.velocityX = Math.max(-maxSpeed, Math.min(maxSpeed, this.velocityX));

            // Jump buffer
            if (Input.jumpPressed) {
                this.jumpBuffer = PHYSICS.JUMP_BUFFER;
            }

            // Coyote time & jump
            if (this.grounded) {
                this.coyoteTime = PHYSICS.COYOTE_TIME;
            } else {
                this.coyoteTime--;
            }

            if (this.jumpBuffer > 0 && this.coyoteTime > 0) {
                this.velocityY = PHYSICS.JUMP_FORCE;
                this.grounded = false;
                this.coyoteTime = 0;
                this.jumpBuffer = 0;
            }
            this.jumpBuffer--;

            // Variable gravity
            if (this.velocityY < 0 && Input.jump) {
                this.velocityY += PHYSICS.GRAVITY_HOLDING;
            } else {
                this.velocityY += PHYSICS.GRAVITY_FALLING;
            }

            // Jump cut
            if (!Input.jump && this.velocityY < 0) {
                this.velocityY *= PHYSICS.JUMP_CUT;
            }

            // Terminal velocity
            this.velocityY = Math.min(this.velocityY, PHYSICS.MAX_FALL_SPEED);

            // Apply velocity
            this.x += this.velocityX;
            this.y += this.velocityY;

            // Collision with level
            this.grounded = false;
            level.collideWithTiles(this);

            // Attack
            if (Input.attack && !this.attacking) {
                this.attacking = true;
                this.attackTimer = 15;
                // Create attack hitbox
                game.createAttack(this);
            }

            if (this.attacking) {
                this.attackTimer--;
                if (this.attackTimer <= 0) {
                    this.attacking = false;
                }
            }

            // Invincibility frames
            if (this.invincible) {
                this.invincibleTimer--;
                if (this.invincibleTimer <= 0) {
                    this.invincible = false;
                }
            }

            // Animation state
            if (this.attacking) {
                this.state = 'attack';
            } else if (!this.grounded) {
                this.state = this.velocityY < 0 ? 'jump' : 'fall';
            } else if (Math.abs(this.velocityX) > 0.5) {
                this.state = 'run';
            } else {
                this.state = 'idle';
            }

            // Animation timer
            this.animTimer++;
            const animSpeed = this.state === 'run' ? 6 : 10;
            if (this.animTimer >= animSpeed) {
                this.animTimer = 0;
                this.animFrame++;
            }

            // Level bounds
            if (this.x < 0) this.x = 0;
            if (this.y > level.height * TILE_SIZE + 100) {
                this.takeDamage(1);
                this.respawn(level);
            }
        }

        takeDamage(amount) {
            if (this.invincible) return;

            this.hp -= amount;
            this.invincible = true;
            this.invincibleTimer = 90; // 1.5 seconds
            this.velocityY = PHYSICS.JUMP_FORCE * 0.5;

            if (this.hp <= 0) {
                game.gameOver();
            }
        }

        respawn(level) {
            const spawn = level.playerStart || { x: 64, y: 200 };
            this.x = spawn.x;
            this.y = spawn.y;
            this.velocityX = 0;
            this.velocityY = 0;
        }

        render(ctx, camera) {
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            // Invincibility flash
            if (this.invincible && Math.floor(this.invincibleTimer / 4) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            // Get sprite based on state
            let sprites;
            switch (this.state) {
                case 'run': sprites = Sprites.cache.playerRun; break;
                case 'jump': sprites = Sprites.cache.playerJump; break;
                case 'fall': sprites = Sprites.cache.playerFall; break;
                default: sprites = Sprites.cache.playerIdle;
            }

            const frame = sprites[this.animFrame % sprites.length];

            ctx.save();
            if (this.facing === -1) {
                ctx.translate(screenX + this.width, screenY);
                ctx.scale(-1, 1);
                ctx.drawImage(frame, 0, 0);
            } else {
                ctx.drawImage(frame, screenX, screenY);
            }
            ctx.restore();

            ctx.globalAlpha = 1;

            // Draw weapon when attacking
            if (this.attacking) {
                const weapon = Sprites.cache.weaponPawn;
                const wx = this.facing === 1 ? screenX + this.width : screenX - 16;
                const wy = screenY + 10;
                ctx.save();
                if (this.facing === -1) {
                    ctx.translate(wx + 16, wy);
                    ctx.scale(-1, 1);
                    ctx.drawImage(weapon, 0, 0);
                } else {
                    ctx.drawImage(weapon, wx, wy);
                }
                ctx.restore();
            }
        }
    }

    // ============================================
    // ENEMIES
    // ============================================
    class Enemy extends Entity {
        constructor(x, y, type) {
            const sizes = {
                pawn: [24, 32],
                knight: [32, 40],
                bishop: [28, 44],
                rook: [36, 36]
            };
            const [w, h] = sizes[type] || [24, 32];
            super(x, y, w, h);

            this.type = type;
            this.hp = type === 'rook' ? 3 : (type === 'knight' ? 2 : 1);
            this.maxHp = this.hp;
            this.animFrame = 0;
            this.animTimer = 0;
            this.state = 'patrol';
            this.cooldown = 0;
            this.stunned = false;
            this.stunTimer = 0;
            this.dead = false;
            this.deathTimer = 0;

            // Type-specific
            this.sightRange = type === 'bishop' ? 300 : 200;
            this.attackRange = type === 'rook' ? 500 : 150;
            this.moveSpeed = type === 'rook' ? 8 : (type === 'knight' ? 0 : 1.5);

            // Knight-specific
            this.charging = false;
            this.chargeTimer = 0;

            // Bishop-specific
            this.aiming = false;
            this.aimTimer = 0;

            // Rook-specific
            this.rushing = false;
        }

        update(player, level) {
            if (this.dead) {
                this.deathTimer++;
                return this.deathTimer > 30;
            }

            if (this.stunned) {
                this.stunTimer--;
                if (this.stunTimer <= 0) {
                    this.stunned = false;
                }
                return false;
            }

            this.cooldown = Math.max(0, this.cooldown - 1);

            const dx = player.centerX - this.centerX;
            const dy = player.centerY - this.centerY;
            const dist = Math.hypot(dx, dy);

            // Type-specific AI
            switch (this.type) {
                case 'pawn':
                    this.updatePawn(player, level, dist, dx);
                    break;
                case 'knight':
                    this.updateKnight(player, level, dist, dx, dy);
                    break;
                case 'bishop':
                    this.updateBishop(player, level, dist, dx, dy);
                    break;
                case 'rook':
                    this.updateRook(player, level, dist, dx, dy);
                    break;
            }

            // Apply gravity for grounded enemies
            if (this.type !== 'knight' || !this.charging) {
                this.velocityY += PHYSICS.GRAVITY_FALLING * 0.5;
                this.velocityY = Math.min(this.velocityY, PHYSICS.MAX_FALL_SPEED);
            }

            this.x += this.velocityX;
            this.y += this.velocityY;

            level.collideWithTiles(this);

            // Animation
            this.animTimer++;
            if (this.animTimer >= 10) {
                this.animTimer = 0;
                this.animFrame++;
            }

            return false;
        }

        updatePawn(player, level, dist, dx) {
            // Patrol or chase
            if (dist < this.sightRange) {
                this.facing = dx > 0 ? 1 : -1;
                this.velocityX = this.facing * this.moveSpeed * 1.5;
                this.state = 'chase';
            } else {
                this.velocityX = this.facing * this.moveSpeed;
                this.state = 'patrol';
            }

            // Turn at edges or walls
            if (this.hitWall || this.atEdge) {
                this.facing *= -1;
            }
        }

        updateKnight(player, level, dist, dx, dy) {
            if (this.charging) {
                this.chargeTimer--;
                if (this.chargeTimer <= 0) {
                    // L-shaped jump
                    const jumpX = Math.sign(dx) * 4;
                    const jumpY = -12;
                    this.velocityX = jumpX;
                    this.velocityY = jumpY;
                    this.charging = false;
                    this.cooldown = 180;
                }
            } else if (dist < this.attackRange && this.cooldown <= 0) {
                // Start charging
                this.charging = true;
                this.chargeTimer = 30;
                this.velocityX = 0;
                this.state = 'charge';
            } else {
                // Idle
                this.velocityX = 0;
                this.state = 'idle';
            }
        }

        updateBishop(player, level, dist, dx, dy) {
            // Only attack if player is on diagonal
            const onDiagonal = Math.abs(Math.abs(dx) - Math.abs(dy)) < 40;

            if (this.aiming) {
                this.aimTimer++;
                if (this.aimTimer >= 60) {
                    // Shoot
                    game.createProjectile(
                        this.centerX, this.centerY,
                        Math.sign(dx) * 6, Math.sign(dy) * 6,
                        'enemy'
                    );
                    this.aiming = false;
                    this.aimTimer = 0;
                    this.cooldown = 120;
                }
            } else if (onDiagonal && dist < this.sightRange && this.cooldown <= 0) {
                this.aiming = true;
                this.state = 'aim';
            } else {
                // Retreat if player too close
                if (dist < 80) {
                    this.velocityX = -Math.sign(dx) * 2;
                } else {
                    this.velocityX = 0;
                }
                this.state = 'idle';
            }
        }

        updateRook(player, level, dist, dx, dy) {
            // Only attack if on same X or Y axis
            const sameX = Math.abs(dx) < 40;
            const sameY = Math.abs(dy) < 40;

            if (this.rushing) {
                // Keep rushing until wall
                if (this.hitWall) {
                    this.rushing = false;
                    this.stunned = true;
                    this.stunTimer = 60;
                    this.velocityX = 0;
                }
            } else if ((sameX || sameY) && this.cooldown <= 0) {
                // Start rush
                this.rushing = true;
                if (sameY) {
                    this.velocityX = Math.sign(dx) * 10;
                } else {
                    this.velocityY = Math.sign(dy) * 10;
                }
                this.state = 'rush';
            } else {
                this.velocityX = 0;
                this.state = 'idle';
            }
        }

        takeDamage(amount) {
            this.hp -= amount;
            if (this.hp <= 0) {
                this.dead = true;
                game.addScore(this.type === 'rook' ? 300 :
                             this.type === 'knight' ? 200 :
                             this.type === 'bishop' ? 250 : 100);
            } else {
                this.stunned = true;
                this.stunTimer = 30;
            }
        }

        render(ctx, camera) {
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            if (this.dead) {
                ctx.globalAlpha = 1 - this.deathTimer / 30;
            }

            if (this.stunned) {
                ctx.globalAlpha = 0.6;
            }

            const spriteKey = `enemy${this.type.charAt(0).toUpperCase() + this.type.slice(1)}`;
            const sprites = Sprites.cache[spriteKey];

            if (sprites) {
                const frame = sprites[this.animFrame % sprites.length];

                ctx.save();
                if (this.facing === -1) {
                    ctx.translate(screenX + this.width, screenY);
                    ctx.scale(-1, 1);
                    ctx.drawImage(frame, 0, 0);
                } else {
                    ctx.drawImage(frame, screenX, screenY);
                }
                ctx.restore();
            }

            ctx.globalAlpha = 1;

            // Warning indicator for Rook
            if (this.type === 'rook' && this.rushing) {
                ctx.fillStyle = '#FF0000';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('CHECK!', screenX, screenY - 10);
            }

            // Aim line for Bishop
            if (this.type === 'bishop' && this.aiming) {
                ctx.strokeStyle = `rgba(148, 0, 211, ${0.5 + Math.sin(this.aimTimer * 0.2) * 0.5})`;
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(screenX + this.width/2, screenY + this.height/2);
                ctx.lineTo(screenX + this.width/2 + this.facing * 200,
                          screenY + this.height/2 + this.facing * 200);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }
    }

    // ============================================
    // LEVEL SYSTEM
    // ============================================
    class Level {
        constructor(data) {
            this.width = data.width;
            this.height = data.height;
            this.tiles = data.tiles;
            this.enemies = [];
            this.items = [];
            this.playerStart = data.playerStart || { x: 64, y: 200 };

            // Spawn enemies
            if (data.enemies) {
                data.enemies.forEach(e => {
                    this.enemies.push(new Enemy(e.x, e.y, e.type));
                });
            }

            // Spawn items
            if (data.items) {
                this.items = data.items.map(i => ({
                    x: i.x, y: i.y, type: i.type, collected: false
                }));
            }
        }

        getTile(x, y) {
            const tx = Math.floor(x / TILE_SIZE);
            const ty = Math.floor(y / TILE_SIZE);
            if (tx < 0 || tx >= this.width || ty < 0 || ty >= this.height) {
                return 0;
            }
            return this.tiles[ty][tx];
        }

        isSolid(tileType) {
            return tileType >= 1 && tileType <= 7;
        }

        collideWithTiles(entity) {
            entity.hitWall = false;
            entity.atEdge = false;

            // Horizontal collision
            const futureX = entity.x + entity.velocityX;

            // Check corners
            const checkY1 = entity.y + 4;
            const checkY2 = entity.bottom - 4;

            if (entity.velocityX > 0) {
                if (this.isSolid(this.getTile(futureX + entity.width, checkY1)) ||
                    this.isSolid(this.getTile(futureX + entity.width, checkY2))) {
                    entity.x = Math.floor((futureX + entity.width) / TILE_SIZE) * TILE_SIZE - entity.width;
                    entity.velocityX = 0;
                    entity.hitWall = true;
                }
            } else if (entity.velocityX < 0) {
                if (this.isSolid(this.getTile(futureX, checkY1)) ||
                    this.isSolid(this.getTile(futureX, checkY2))) {
                    entity.x = Math.floor(futureX / TILE_SIZE) * TILE_SIZE + TILE_SIZE;
                    entity.velocityX = 0;
                    entity.hitWall = true;
                }
            }

            // Vertical collision
            const futureY = entity.y + entity.velocityY;
            const checkX1 = entity.x + 4;
            const checkX2 = entity.right - 4;

            if (entity.velocityY > 0) {
                if (this.isSolid(this.getTile(checkX1, futureY + entity.height)) ||
                    this.isSolid(this.getTile(checkX2, futureY + entity.height))) {
                    entity.y = Math.floor((futureY + entity.height) / TILE_SIZE) * TILE_SIZE - entity.height;
                    entity.velocityY = 0;
                    entity.grounded = true;
                }
            } else if (entity.velocityY < 0) {
                if (this.isSolid(this.getTile(checkX1, futureY)) ||
                    this.isSolid(this.getTile(checkX2, futureY))) {
                    entity.y = Math.floor(futureY / TILE_SIZE) * TILE_SIZE + TILE_SIZE;
                    entity.velocityY = 0;
                }
            }

            // Edge detection for enemies
            if (entity.grounded) {
                const aheadX = entity.facing > 0 ? entity.right + 4 : entity.left - 4;
                if (!this.isSolid(this.getTile(aheadX, entity.bottom + 4))) {
                    entity.atEdge = true;
                }
            }
        }

        render(ctx, camera) {
            const startX = Math.floor(camera.x / TILE_SIZE);
            const startY = Math.floor(camera.y / TILE_SIZE);
            const endX = Math.ceil((camera.x + GAME_WIDTH) / TILE_SIZE);
            const endY = Math.ceil((camera.y + GAME_HEIGHT) / TILE_SIZE);

            for (let y = startY; y <= endY; y++) {
                for (let x = startX; x <= endX; x++) {
                    const tile = this.getTile(x * TILE_SIZE, y * TILE_SIZE);
                    if (tile === 0) continue;

                    const screenX = x * TILE_SIZE - camera.x;
                    const screenY = y * TILE_SIZE - camera.y;

                    let sprite;
                    switch (tile) {
                        case 1: sprite = Sprites.cache.tileGround; break;
                        case 2: sprite = Sprites.cache.tilePlatform; break;
                        case 5: sprite = Sprites.cache.tileWhite; break;
                        case 6: sprite = Sprites.cache.tileBlack; break;
                        default: sprite = Sprites.cache.tileGround;
                    }

                    if (sprite) {
                        ctx.drawImage(sprite, screenX, screenY);
                    }
                }
            }

            // Render items
            this.items.forEach(item => {
                if (item.collected) return;
                const screenX = item.x - camera.x;
                const screenY = item.y - camera.y;

                if (item.type === 'coin') {
                    const coin = Sprites.cache.uiCoin;
                    const bob = Math.sin(Date.now() / 200) * 3;
                    ctx.drawImage(coin, screenX, screenY + bob);
                }
            });
        }
    }

    // ============================================
    // CAMERA
    // ============================================
    class Camera {
        constructor() {
            this.x = 0;
            this.y = 0;
            this.smoothing = 0.08;
        }

        follow(target, level) {
            const targetX = target.centerX - GAME_WIDTH / 2;
            const targetY = target.centerY - GAME_HEIGHT / 2;

            this.x += (targetX - this.x) * this.smoothing;
            this.y += (targetY - this.y) * this.smoothing;

            // Bounds
            this.x = Math.max(0, Math.min(this.x, level.width * TILE_SIZE - GAME_WIDTH));
            this.y = Math.max(0, Math.min(this.y, level.height * TILE_SIZE - GAME_HEIGHT));
        }
    }

    // ============================================
    // PROJECTILES & ATTACKS
    // ============================================
    class Projectile {
        constructor(x, y, vx, vy, owner) {
            this.x = x;
            this.y = y;
            this.velocityX = vx;
            this.velocityY = vy;
            this.owner = owner;
            this.width = 12;
            this.height = 12;
            this.lifetime = 180;
        }

        update(level) {
            this.x += this.velocityX;
            this.y += this.velocityY;
            this.lifetime--;

            // Check collision with tiles
            if (level.isSolid(level.getTile(this.x, this.y)) ||
                level.isSolid(level.getTile(this.x + this.width, this.y + this.height))) {
                return true; // Remove
            }

            return this.lifetime <= 0;
        }

        render(ctx, camera) {
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            ctx.fillStyle = this.owner === 'enemy' ? '#9400D3' : '#DAA520';
            ctx.beginPath();
            ctx.arc(screenX + 6, screenY + 6, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = this.owner === 'enemy' ? '#FF00FF' : '#FFD700';
            ctx.beginPath();
            ctx.arc(screenX + 6, screenY + 6, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class Attack {
        constructor(owner, offsetX, offsetY, width, height, duration, damage) {
            this.owner = owner;
            this.offsetX = offsetX;
            this.offsetY = offsetY;
            this.width = width;
            this.height = height;
            this.duration = duration;
            this.damage = damage;
            this.hits = new Set();
        }

        get x() {
            return this.owner.facing === 1
                ? this.owner.x + this.owner.width + this.offsetX
                : this.owner.x - this.width - this.offsetX;
        }

        get y() { return this.owner.y + this.offsetY; }
        get left() { return this.x; }
        get right() { return this.x + this.width; }
        get top() { return this.y; }
        get bottom() { return this.y + this.height; }

        intersects(other) {
            return this.left < other.right &&
                   this.right > other.left &&
                   this.top < other.bottom &&
                   this.bottom > other.top;
        }

        update() {
            this.duration--;
            return this.duration <= 0;
        }

        render(ctx, camera) {
            // Debug hitbox
            if (false) {
                ctx.strokeStyle = '#FF0000';
                ctx.strokeRect(this.x - camera.x, this.y - camera.y, this.width, this.height);
            }
        }
    }

    // ============================================
    // PARTICLE SYSTEM
    // ============================================
    class Particle {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type;
            this.velocityX = (Math.random() - 0.5) * 4;
            this.velocityY = -Math.random() * 4 - 2;
            this.lifetime = 30 + Math.random() * 30;
            this.maxLifetime = this.lifetime;
            this.size = 4 + Math.random() * 4;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotationSpeed = (Math.random() - 0.5) * 0.3;
        }

        update() {
            this.x += this.velocityX;
            this.y += this.velocityY;
            this.velocityY += 0.15;
            this.rotation += this.rotationSpeed;
            this.lifetime--;
            return this.lifetime <= 0;
        }

        render(ctx, camera) {
            const alpha = this.lifetime / this.maxLifetime;
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(this.rotation);
            ctx.globalAlpha = alpha;

            switch (this.type) {
                case 'hit':
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                    break;
                case 'death':
                    ctx.fillStyle = '#FF4444';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'coin':
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;
            }

            ctx.restore();
        }
    }

    // ============================================
    // GAME MANAGER
    // ============================================
    const game = {
        state: 'loading',
        player: null,
        level: null,
        camera: null,
        projectiles: [],
        attacks: [],
        particles: [],
        score: 0,
        stageNum: 1,

        levels: [],

        init() {
            Input.init();
            Sprites.init();
            this.camera = new Camera();

            // Create levels
            this.createLevels();

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loadingFill').style.width = '100%';
                document.getElementById('loadingText').textContent = 'Ready!';

                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                    this.state = 'title';
                }, 500);
            }, 1000);
        },

        createLevels() {
            // Level 1: Tutorial
            const level1Tiles = [];
            const height = 20;
            const width = 60;

            for (let y = 0; y < height; y++) {
                const row = [];
                for (let x = 0; x < width; x++) {
                    // Floor
                    if (y === height - 2 || y === height - 1) {
                        row.push((x + y) % 2 === 0 ? 5 : 6); // Checkerboard
                    }
                    // Platforms
                    else if (y === 12 && x >= 8 && x <= 12) {
                        row.push(2);
                    }
                    else if (y === 10 && x >= 16 && x <= 20) {
                        row.push(2);
                    }
                    else if (y === 8 && x >= 24 && x <= 28) {
                        row.push(2);
                    }
                    else if (y === 12 && x >= 32 && x <= 38) {
                        row.push(2);
                    }
                    else if (y === 10 && x >= 42 && x <= 46) {
                        row.push(2);
                    }
                    else if (y === 8 && x >= 50 && x <= 56) {
                        row.push(2);
                    }
                    // Walls
                    else if (x === 0 || x === width - 1) {
                        row.push(1);
                    }
                    else {
                        row.push(0);
                    }
                }
                level1Tiles.push(row);
            }

            this.levels.push({
                width: width,
                height: height,
                tiles: level1Tiles,
                playerStart: { x: 64, y: 500 },
                enemies: [
                    { type: 'pawn', x: 300, y: 530 },
                    { type: 'pawn', x: 500, y: 530 },
                    { type: 'knight', x: 700, y: 530 },
                    { type: 'pawn', x: 900, y: 530 },
                    { type: 'bishop', x: 1100, y: 500 },
                    { type: 'rook', x: 1400, y: 530 }
                ],
                items: [
                    { type: 'coin', x: 320, y: 340 },
                    { type: 'coin', x: 560, y: 280 },
                    { type: 'coin', x: 800, y: 220 },
                    { type: 'coin', x: 1100, y: 340 },
                    { type: 'coin', x: 1400, y: 220 }
                ]
            });

            // Level 2: More challenging
            const level2Tiles = [];
            const h2 = 25;
            const w2 = 80;

            for (let y = 0; y < h2; y++) {
                const row = [];
                for (let x = 0; x < w2; x++) {
                    if (y >= h2 - 2) {
                        // Gaps in floor
                        if ((x >= 20 && x <= 23) || (x >= 40 && x <= 43) || (x >= 60 && x <= 63)) {
                            row.push(0);
                        } else {
                            row.push((x + y) % 2 === 0 ? 5 : 6);
                        }
                    }
                    else if (y === 15 && ((x >= 10 && x <= 14) || (x >= 25 && x <= 29))) {
                        row.push(2);
                    }
                    else if (y === 12 && ((x >= 18 && x <= 22) || (x >= 35 && x <= 40))) {
                        row.push(2);
                    }
                    else if (y === 18 && x >= 45 && x <= 55) {
                        row.push(2);
                    }
                    else if (y === 14 && x >= 60 && x <= 70) {
                        row.push(2);
                    }
                    else if (x === 0 || x === w2 - 1) {
                        row.push(1);
                    }
                    else {
                        row.push(0);
                    }
                }
                level2Tiles.push(row);
            }

            this.levels.push({
                width: w2,
                height: h2,
                tiles: level2Tiles,
                playerStart: { x: 64, y: 700 },
                enemies: [
                    { type: 'pawn', x: 200, y: 730 },
                    { type: 'knight', x: 400, y: 730 },
                    { type: 'pawn', x: 550, y: 730 },
                    { type: 'bishop', x: 750, y: 700 },
                    { type: 'knight', x: 1000, y: 730 },
                    { type: 'rook', x: 1200, y: 730 },
                    { type: 'pawn', x: 1500, y: 730 },
                    { type: 'bishop', x: 1800, y: 700 },
                    { type: 'rook', x: 2100, y: 730 }
                ],
                items: [
                    { type: 'coin', x: 380, y: 440 },
                    { type: 'coin', x: 600, y: 340 },
                    { type: 'coin', x: 900, y: 540 },
                    { type: 'coin', x: 1300, y: 440 },
                    { type: 'coin', x: 1700, y: 380 },
                    { type: 'coin', x: 2000, y: 400 }
                ]
            });
        },

        startGame() {
            this.score = 0;
            this.stageNum = 1;
            this.loadLevel(0);
            this.state = 'playing';
        },

        loadLevel(index) {
            if (index >= this.levels.length) {
                this.victory();
                return;
            }

            this.level = new Level(this.levels[index]);
            this.player = new Player(this.level.playerStart.x, this.level.playerStart.y);
            this.camera.x = 0;
            this.camera.y = 0;
            this.projectiles = [];
            this.attacks = [];
            this.particles = [];
        },

        nextLevel() {
            this.stageNum++;
            this.loadLevel(this.stageNum - 1);
        },

        createAttack(owner) {
            this.attacks.push(new Attack(owner, 0, 5, 40, 30, 12, 1));
        },

        createProjectile(x, y, vx, vy, owner) {
            this.projectiles.push(new Projectile(x, y, vx, vy, owner));
        },

        spawnParticles(x, y, type, count = 8) {
            for (let i = 0; i < count; i++) {
                this.particles.push(new Particle(x, y, type));
            }
        },

        addScore(amount) {
            this.score += amount;
        },

        gameOver() {
            this.state = 'gameover';
        },

        victory() {
            this.state = 'victory';
        },

        update() {
            if (this.state === 'title') {
                if (Input.jumpPressed || Input.attack) {
                    this.startGame();
                }
            }
            else if (this.state === 'playing') {
                // Update player
                this.player.update(this.level);

                // Update camera
                this.camera.follow(this.player, this.level);

                // Update enemies
                this.level.enemies = this.level.enemies.filter(enemy => {
                    const remove = enemy.update(this.player, this.level);

                    // Check collision with player
                    if (!enemy.dead && !this.player.invincible && enemy.intersects(this.player)) {
                        // Stomp check
                        if (this.player.velocityY > 0 &&
                            this.player.bottom < enemy.centerY) {
                            enemy.takeDamage(1);
                            this.player.velocityY = PHYSICS.JUMP_FORCE * 0.6;
                            this.spawnParticles(enemy.centerX, enemy.centerY, 'hit');
                        } else {
                            this.player.takeDamage(1);
                        }
                    }

                    return !remove;
                });

                // Update attacks
                this.attacks = this.attacks.filter(attack => {
                    const remove = attack.update();

                    // Check hit on enemies
                    this.level.enemies.forEach(enemy => {
                        if (!attack.hits.has(enemy) && !enemy.dead && attack.intersects(enemy)) {
                            enemy.takeDamage(attack.damage);
                            attack.hits.add(enemy);
                            this.spawnParticles(enemy.centerX, enemy.centerY, 'hit');
                        }
                    });

                    return !remove;
                });

                // Update projectiles
                this.projectiles = this.projectiles.filter(proj => {
                    const remove = proj.update(this.level);

                    // Check hit on player
                    if (proj.owner === 'enemy' && !this.player.invincible) {
                        if (this.player.intersects(proj)) {
                            this.player.takeDamage(1);
                            return true;
                        }
                    }

                    return !remove;
                });

                // Update particles
                this.particles = this.particles.filter(p => !p.update());

                // Collect items
                this.level.items.forEach(item => {
                    if (item.collected) return;

                    const dist = Math.hypot(
                        this.player.centerX - item.x - 8,
                        this.player.centerY - item.y - 8
                    );

                    if (dist < 24) {
                        item.collected = true;
                        if (item.type === 'coin') {
                            this.player.coins++;
                            this.addScore(50);
                            this.spawnParticles(item.x, item.y, 'coin', 5);
                        }
                    }
                });

                // Check stage clear
                if (this.level.enemies.length === 0 &&
                    this.player.x > this.level.width * TILE_SIZE - 100) {
                    this.nextLevel();
                }
            }
            else if (this.state === 'gameover' || this.state === 'victory') {
                if (Input.jumpPressed) {
                    this.state = 'title';
                }
            }

            Input.clear();
        },

        render() {
            // Clear
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            if (this.state === 'title') {
                this.renderTitle();
            }
            else if (this.state === 'playing') {
                this.renderGame();
            }
            else if (this.state === 'gameover') {
                this.renderGame();
                this.renderGameOver();
            }
            else if (this.state === 'victory') {
                this.renderGame();
                this.renderVictory();
            }
        },

        renderTitle() {
            // Background pattern
            for (let x = 0; x < GAME_WIDTH; x += 64) {
                for (let y = 0; y < GAME_HEIGHT; y += 64) {
                    ctx.globalAlpha = 0.1;
                    const tile = ((x/64) + (y/64)) % 2 === 0
                        ? Sprites.cache.tileWhite
                        : Sprites.cache.tileBlack;
                    if (tile) ctx.drawImage(tile, x, y, 64, 64);
                }
            }
            ctx.globalAlpha = 1;

            // Title
            ctx.fillStyle = '#DAA520';
            ctx.font = 'bold 64px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('♟ CAISO MARIO ♟', GAME_WIDTH/2, 180);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '24px Georgia, serif';
            ctx.fillText('Chess Platformer Adventure', GAME_WIDTH/2, 230);

            // Instructions
            ctx.font = '18px sans-serif';
            ctx.fillStyle = '#888';
            ctx.fillText('Arrow Keys / WASD to Move', GAME_WIDTH/2, 320);
            ctx.fillText('Space / W to Jump', GAME_WIDTH/2, 350);
            ctx.fillText('Z / J to Attack', GAME_WIDTH/2, 380);

            // Start prompt
            const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(218, 165, 32, ${pulse})`;
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('Press SPACE or Z to Start', GAME_WIDTH/2, 480);

            ctx.textAlign = 'left';
        },

        renderGame() {
            // Render background
            this.renderBackground();

            // Render level
            this.level.render(ctx, this.camera);

            // Render enemies
            this.level.enemies.forEach(e => e.render(ctx, this.camera));

            // Render projectiles
            this.projectiles.forEach(p => p.render(ctx, this.camera));

            // Render player
            this.player.render(ctx, this.camera);

            // Render attacks
            this.attacks.forEach(a => a.render(ctx, this.camera));

            // Render particles
            this.particles.forEach(p => p.render(ctx, this.camera));

            // Render HUD
            this.renderHUD();
        },

        renderBackground() {
            // Parallax bookshelf background
            const parallax = this.camera.x * 0.3;

            ctx.fillStyle = '#2D1810';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Distant bookshelves
            ctx.fillStyle = '#3D2820';
            for (let x = -parallax % 200; x < GAME_WIDTH + 200; x += 200) {
                ctx.fillRect(x, 0, 40, GAME_HEIGHT);
                ctx.fillRect(x + 60, 50, 80, GAME_HEIGHT - 50);
            }

            // God rays
            ctx.globalAlpha = 0.1;
            ctx.fillStyle = '#DAA520';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(200 + i * 300 - parallax * 0.5, 0);
                ctx.lineTo(100 + i * 300 - parallax * 0.5, GAME_HEIGHT);
                ctx.lineTo(180 + i * 300 - parallax * 0.5, GAME_HEIGHT);
                ctx.lineTo(280 + i * 300 - parallax * 0.5, 0);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        },

        renderHUD() {
            // HP
            for (let i = 0; i < this.player.maxHp; i++) {
                const heart = i < this.player.hp
                    ? Sprites.cache.uiHeart
                    : Sprites.cache.uiHeartEmpty;
                if (heart) ctx.drawImage(heart, 20 + i * 28, 20);
            }

            // Score
            ctx.fillStyle = '#DAA520';
            ctx.font = 'bold 20px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(`SCORE: ${this.score.toString().padStart(6, '0')}`, GAME_WIDTH - 20, 38);

            // Coins
            const coin = Sprites.cache.uiCoin;
            if (coin) ctx.drawImage(coin, GAME_WIDTH - 100, 50);
            ctx.fillText(`× ${this.player.coins}`, GAME_WIDTH - 20, 65);

            // Stage
            ctx.textAlign = 'center';
            ctx.fillText(`STAGE ${this.stageNum}`, GAME_WIDTH/2, 38);

            ctx.textAlign = 'left';
        },

        renderGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = '#FF4444';
            ctx.font = 'bold 48px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', GAME_WIDTH/2, GAME_HEIGHT/2 - 30);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '24px sans-serif';
            ctx.fillText(`Final Score: ${this.score}`, GAME_WIDTH/2, GAME_HEIGHT/2 + 20);

            ctx.fillStyle = '#888';
            ctx.font = '18px sans-serif';
            ctx.fillText('Press SPACE to Return to Title', GAME_WIDTH/2, GAME_HEIGHT/2 + 80);

            ctx.textAlign = 'left';
        },

        renderVictory() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = '#DAA520';
            ctx.font = 'bold 48px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('♚ VICTORY! ♚', GAME_WIDTH/2, GAME_HEIGHT/2 - 50);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '28px Georgia, serif';
            ctx.fillText('You saved your friend!', GAME_WIDTH/2, GAME_HEIGHT/2 + 10);

            ctx.font = '24px sans-serif';
            ctx.fillText(`Final Score: ${this.score}`, GAME_WIDTH/2, GAME_HEIGHT/2 + 50);

            ctx.fillStyle = '#888';
            ctx.font = '18px sans-serif';
            ctx.fillText('Press SPACE to Return to Title', GAME_WIDTH/2, GAME_HEIGHT/2 + 110);

            ctx.textAlign = 'left';
        }
    };

    // ============================================
    // GAME LOOP
    // ============================================
    let lastTime = 0;
    const targetFPS = 60;
    const frameTime = 1000 / targetFPS;

    function gameLoop(timestamp) {
        const delta = timestamp - lastTime;

        if (delta >= frameTime) {
            lastTime = timestamp - (delta % frameTime);

            game.update();
            game.render();
        }

        requestAnimationFrame(gameLoop);
    }

    // Initialize and start
    game.init();
    requestAnimationFrame(gameLoop);
    </script>
</body>
