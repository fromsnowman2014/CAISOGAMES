                    // Lower side platforms for dodging
                    else if (y === 17 && x >= 10 && x <= 14) {
                        row.push(2);
                    }
                    else if (y === 17 && x >= 30 && x <= 34) {
                        row.push(2);
                    }
                    // Mid-level platforms (for attacking boss head)
                    else if (y === 11 && x >= 7 && x <= 11) {
                        row.push(2);
                    }
                    else if (y === 11 && x >= 33 && x <= 37) {
                        row.push(2);
                    }
                    else {
                        row.push(0);
                    }
                }
                level5Tiles.push(row);
            }

            this.levels.push({
                width: w5,
                height: h5,
                tiles: level5Tiles,
                playerStart: { x: 100, y: 620 },
                enemies: [
                    { type: 'boss', x: 550, y: 350 }
                ],
                items: [
                    // Health pickups on platforms (boss drops these when damaged)
                    { type: 'heart', x: 180, y: 410 },
                    { type: 'heart', x: 1250, y: 410 },
                    // Coins for brave players
                    { type: 'coin', x: 720, y: 210 }
                ],
                isBossLevel: true
            });
        },

        startGame() {
            this.score = 0;
            this.stageNum = 1;
            this.loadLevel(0);
            this.state = 'playing';
        },

        loadLevel(index) {
            if (index >= this.levels.length) {
                this.victory();
                return;
            }

            this.level = new Level(this.levels[index]);
            this.player = new Player(this.level.playerStart.x, this.level.playerStart.y);
            this.camera.x = 0;
            this.camera.y = 0;
            this.projectiles = [];
            this.attacks = [];
            this.particles = [];
        },

        nextLevel() {
            this.stageNum++;
            this.loadLevel(this.stageNum - 1);
        },

        createAttack(owner) {
            this.attacks.push(new Attack(owner, 0, 5, 40, 30, 12, 1));
        },

        createProjectile(x, y, vx, vy, owner) {
            this.projectiles.push(new Projectile(x, y, vx, vy, owner));
        },

        spawnParticles(x, y, type, count = 8) {
            for (let i = 0; i < count; i++) {
                this.particles.push(new Particle(x, y, type));
            }
        },

        addScore(amount) {
            const multiplier = this.player ? this.player.getComboMultiplier() : 1;
            this.score += Math.floor(amount * multiplier);
        },

        gameOver() {
            this.state = 'gameover';
        },

        victory() {
            this.state = 'victory';
        },

        update() {
            // Process screen effects
            if (this.screenShake.duration > 0) {
                this.screenShake.duration--;
                if (this.screenShake.duration === 0) {
                    this.screenShake.intensity = 0;
                }
            }

            if (this.flashOverlay.duration > 0) {
                this.flashOverlay.duration--;
                this.flashOverlay.alpha = Math.max(0, this.flashOverlay.alpha - 0.1);
            } else {
                this.flashOverlay.alpha = 0;
            }

            // Hitstop freezes game logic
            if (this.hitstop.frames > 0) {
                this.hitstop.frames--;
                // Only update particles during hitstop for visual feedback
                this.particles = this.particles.filter(p => !p.update());
                return;
            }

            if (this.state === 'title') {
                if (Input.jumpPressed || Input.attack) {
                    this.startGame();
                }
            }
            else if (this.state === 'playing') {
                // Update player
                this.player.update(this.level);

                // Update camera
                this.camera.follow(this.player, this.level);

                // Update enemies
                this.level.enemies = this.level.enemies.filter(enemy => {
                    const remove = enemy.update(this.player, this.level);

                    // Check collision with player
                    if (!enemy.dead && !this.player.invincible && enemy.intersects(this.player)) {
                        // Stomp check
                        if (this.player.velocityY > 0 &&
                            this.player.bottom < enemy.centerY) {
                            const wasAlive = enemy.hp > 0;
                            enemy.takeDamage(1);
                            this.player.velocityY = PHYSICS.JUMP_FORCE * 0.6;
                            this.spawnParticles(enemy.centerX, enemy.centerY, 'hit');
                            if (wasAlive) {
                                this.player.addCombo();
                            }
                        } else {
                            this.player.takeDamage(1);
                            this.player.combo = 0; // Reset combo on hit
                        }
                    }

                    return !remove;
                });

                // Update attacks
                this.attacks = this.attacks.filter(attack => {
                    const remove = attack.update();

                    // Check hit on enemies
                    this.level.enemies.forEach(enemy => {
                        if (!attack.hits.has(enemy) && !enemy.dead && attack.intersects(enemy)) {
                            const wasAlive = enemy.hp > 0;
                            enemy.takeDamage(attack.damage);
                            attack.hits.add(enemy);
                            this.spawnParticles(enemy.centerX, enemy.centerY, 'hit');
                            if (wasAlive) {
                                this.player.addCombo();
                            }
                        }
                    });

                    return !remove;
                });

                // Update projectiles
                this.projectiles = this.projectiles.filter(proj => {
                    const remove = proj.update(this.level);

                    // Player projectile hits enemy
                    if (proj.owner === 'player') {
                        this.level.enemies.forEach(enemy => {
                            if (!enemy.dead && enemy.intersects(proj)) {
                                const damage = this.player.weaponLevel >= 2 ? 2 : 1;
                                const wasAlive = enemy.hp > 0;
                                enemy.takeDamage(damage);
                                this.spawnParticles(enemy.centerX, enemy.centerY, 'hit');
                                proj.lifetime = 0; // Destroy projectile
                                if (wasAlive) {
                                    this.player.addCombo();
                                }
                            }
                        });
                    }

                    // Check hit on player
                    if (proj.owner === 'enemy' && !this.player.invincible) {
                        if (this.player.intersects(proj)) {
                            this.player.takeDamage(1);
                            this.player.combo = 0;
                            return true;
                        }
                    }

                    return !remove;
                });

                // Update particles
                this.particles = this.particles.filter(p => !p.update());

                // Collect items
                this.level.items.forEach(item => {
                    if (item.collected) return;

                    const dist = Math.hypot(
                        this.player.centerX - item.x - 8,
                        this.player.centerY - item.y - 8
                    );

                    if (dist < 24) {
                        item.collected = true;
                        if (item.type === 'coin') {
                            this.player.coins++;
                            this.addScore(50);
                            this.spawnParticles(item.x, item.y, 'coin', 5);
                        } else if (item.type === 'upgrade') {
                            this.player.upgradeWeapon();
                            this.addScore(500);
                        } else if (item.type === 'heart') {
                            this.player.hp = Math.min(this.player.hp + 1, this.player.maxHp);
                            this.spawnParticles(item.x, item.y, 'heal', 8);
                        }
                    }
                });

                // Check stage clear
                const allEnemiesDead = this.level.enemies.every(e => e.dead);
                const atEnd = this.player.x > this.level.width * TILE_SIZE - 100;

                if (this.level.isBossLevel) {
                    // Boss level: just need to defeat boss
                    if (allEnemiesDead && this.level.enemies.length > 0) {
                        this.nextLevel();
                    }
                } else {
                    // Normal level: defeat all enemies and reach end
                    if (this.level.enemies.length === 0 && atEnd) {
                        this.nextLevel();
                    }
                }
            }
            else if (this.state === 'gameover' || this.state === 'victory') {
                if (Input.jumpPressed) {
                    this.state = 'title';
                }
            }

            Input.clear();
        },

        render() {
            // Clear
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            if (this.state === 'title') {
                this.renderTitle();
            }
            else if (this.state === 'playing') {
                this.renderGame();
            }
            else if (this.state === 'gameover') {
                this.renderGame();
                this.renderGameOver();
            }
            else if (this.state === 'victory') {
                this.renderGame();
                this.renderVictory();
            }
        },

        renderTitle() {
            // Background pattern
            for (let x = 0; x < GAME_WIDTH; x += 64) {
                for (let y = 0; y < GAME_HEIGHT; y += 64) {
                    ctx.globalAlpha = 0.1;
                    const tile = ((x/64) + (y/64)) % 2 === 0
                        ? Sprites.cache.tileWhite
                        : Sprites.cache.tileBlack;
                    if (tile) ctx.drawImage(tile, x, y, 64, 64);
                }
            }
            ctx.globalAlpha = 1;

            // Title
            ctx.fillStyle = '#DAA520';
            ctx.font = 'bold 64px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('♟ CAISO MARIO ♟', GAME_WIDTH/2, 180);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '24px Georgia, serif';
            ctx.fillText('Chess Platformer Adventure', GAME_WIDTH/2, 230);

            // Instructions - Two columns
            ctx.font = '16px sans-serif';
            ctx.fillStyle = '#888';

            // Left column
            ctx.textAlign = 'right';
            ctx.fillText('Move:', GAME_WIDTH/2 - 20, 300);
            ctx.fillText('Jump:', GAME_WIDTH/2 - 20, 325);
            ctx.fillText('Attack:', GAME_WIDTH/2 - 20, 350);
            ctx.fillText('Throw Book:', GAME_WIDTH/2 - 20, 375);
            ctx.fillText('Dash:', GAME_WIDTH/2 - 20, 400);

            // Right column
            ctx.textAlign = 'left';
            ctx.fillStyle = '#AAA';
            ctx.fillText('Arrow Keys / WASD', GAME_WIDTH/2 + 20, 300);
            ctx.fillText('Space / W', GAME_WIDTH/2 + 20, 325);
            ctx.fillText('Z / J', GAME_WIDTH/2 + 20, 350);
            ctx.fillText('X / K', GAME_WIDTH/2 + 20, 375);
            ctx.fillText('Shift + Direction', GAME_WIDTH/2 + 20, 400);

            // Features
            ctx.textAlign = 'center';
            ctx.fillStyle = '#666';
            ctx.font = '14px sans-serif';
            ctx.fillText('Collect upgrades to unlock new abilities!', GAME_WIDTH/2, 440);
            ctx.fillText('5 Stages • 4 Weapon Upgrades • Epic Boss Fight', GAME_WIDTH/2, 460);

            // Start prompt
            const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(218, 165, 32, ${pulse})`;
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('Press SPACE or Z to Start', GAME_WIDTH/2, 510);

            ctx.textAlign = 'left';
        },

        renderGame() {
            // Apply screen shake
            ctx.save();
            if (this.screenShake.duration > 0) {
                const shakeX = (Math.random() - 0.5) * this.screenShake.intensity * 2;
                const shakeY = (Math.random() - 0.5) * this.screenShake.intensity * 2;
                ctx.translate(shakeX, shakeY);
            }

            // Render background
            this.renderBackground();

            // Render level
            this.level.render(ctx, this.camera);

            // Render enemies
            this.level.enemies.forEach(e => e.render(ctx, this.camera));

            // Render projectiles
            this.projectiles.forEach(p => p.render(ctx, this.camera));

            // Render player
            this.player.render(ctx, this.camera);

            // Render attacks
            this.attacks.forEach(a => a.render(ctx, this.camera));

            // Render particles
            this.particles.forEach(p => p.render(ctx, this.camera));

            // Restore from screen shake
            ctx.restore();

            // Render HUD (not affected by screen shake)
            this.renderHUD();

            // Flash overlay effect
            if (this.flashOverlay.alpha > 0) {
                ctx.fillStyle = this.flashOverlay.color;
                ctx.globalAlpha = this.flashOverlay.alpha;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                ctx.globalAlpha = 1;
            }
        },

        // Dust particles for background atmosphere
        dustParticles: [],
        dustInitialized: false,

        initDustParticles() {
            this.dustParticles = [];
            for (let i = 0; i < 60; i++) {
                this.dustParticles.push({
                    x: Math.random() * GAME_WIDTH * 3,
                    y: Math.random() * GAME_HEIGHT,
                    size: Math.random() * 2.5 + 0.5,
                    speed: Math.random() * 0.3 + 0.1,
                    drift: Math.random() * 0.5 - 0.25,
                    alpha: Math.random() * 0.4 + 0.1,
                    layer: Math.floor(Math.random() * 3) // 0=far, 1=mid, 2=near
                });
            }
            this.dustInitialized = true;
        },

        renderBackground() {
            // Initialize dust particles once
            if (!this.dustInitialized) this.initDustParticles();

            const time = Date.now();
            const parallaxFar = this.camera.x * 0.1;
            const parallaxMid = this.camera.x * 0.3;
            const parallaxNear = this.camera.x * 0.5;

            // === LAYER 0: Deep background gradient (infinite library) ===
            const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            gradient.addColorStop(0, '#1A0F08');    // Very dark at top
            gradient.addColorStop(0.3, '#2D1810'); // Dark mahogany
            gradient.addColorStop(0.7, '#3D2820'); // Slightly lighter
            gradient.addColorStop(1, '#1A0F08');   // Dark at bottom
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // === LAYER 1: Far bookshelves (silhouettes) ===
            ctx.fillStyle = '#251510';
            for (let x = -parallaxFar % 300; x < GAME_WIDTH + 300; x += 300) {
                // Giant bookshelf columns
                ctx.fillRect(x, 0, 60, GAME_HEIGHT);
                ctx.fillRect(x + 100, 0, 80, GAME_HEIGHT);
                ctx.fillRect(x + 220, 20, 50, GAME_HEIGHT - 20);

                // Shelf horizontal lines (faint)
                ctx.fillStyle = '#2D1810';
                for (let y = 80; y < GAME_HEIGHT; y += 100) {
                    ctx.fillRect(x, y, 300, 3);
                }
                ctx.fillStyle = '#251510';
            }

            // Far dust particles
            this.dustParticles.filter(p => p.layer === 0).forEach(p => {
                const px = (p.x - parallaxFar) % (GAME_WIDTH + 100);
                ctx.fillStyle = `rgba(218, 165, 32, ${p.alpha * 0.3})`;
                ctx.beginPath();
                ctx.arc(px < 0 ? px + GAME_WIDTH + 100 : px, p.y, p.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
                p.y -= p.speed * 0.5;
                p.x += p.drift;
                if (p.y < -10) p.y = GAME_HEIGHT + 10;
            });

            // === LAYER 2: Mid bookshelves (more detail) ===
            for (let x = -parallaxMid % 250; x < GAME_WIDTH + 250; x += 250) {
                // Bookshelf frame
                ctx.fillStyle = '#3D2518';
                ctx.fillRect(x, 0, 50, GAME_HEIGHT);
                ctx.fillRect(x + 80, 30, 70, GAME_HEIGHT - 30);
                ctx.fillRect(x + 180, 0, 45, GAME_HEIGHT);

                // Books on shelves (colorful spines)
                const bookColors = ['#8B0000', '#1A4A1A', '#1A1A4A', '#4A3A1A', '#3A1A3A'];
                for (let shelfY = 60; shelfY < GAME_HEIGHT - 50; shelfY += 80) {
                    // Shelf board
                    ctx.fillStyle = '#4A3020';
                    ctx.fillRect(x + 50, shelfY, 130, 6);
                    ctx.fillStyle = '#5A4030';
                    ctx.fillRect(x + 50, shelfY, 130, 2);

                    // Books
                    let bookX = x + 52;
                    while (bookX < x + 175) {
                        const bookW = 8 + Math.floor(Math.random() * 10);
                        const bookH = 40 + Math.floor(Math.random() * 30);
                        const color = bookColors[Math.floor(Math.random() * bookColors.length)];

                        ctx.fillStyle = color;
                        ctx.fillRect(bookX, shelfY - bookH, bookW, bookH);
                        // Book spine highlight
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                        ctx.fillRect(bookX, shelfY - bookH, 2, bookH);
                        // Book spine shadow
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                        ctx.fillRect(bookX + bookW - 2, shelfY - bookH, 2, bookH);

                        bookX += bookW + 2;
                    }
                }

                // Decorative elements
                ctx.fillStyle = '#5A4030';
                ctx.fillRect(x + 45, 0, 60, 8); // Top molding
            }

            // Mid dust particles
            this.dustParticles.filter(p => p.layer === 1).forEach(p => {
                const px = (p.x - parallaxMid) % (GAME_WIDTH + 100);
                ctx.fillStyle = `rgba(255, 250, 240, ${p.alpha * 0.5})`;
                ctx.beginPath();
                ctx.arc(px < 0 ? px + GAME_WIDTH + 100 : px, p.y, p.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
                p.y -= p.speed * 0.7;
                p.x += p.drift;
                if (p.y < -10) p.y = GAME_HEIGHT + 10;
            });

            // === GOD RAYS (animated light beams from high windows) ===
            const rayPulse = Math.sin(time / 2000) * 0.03 + 0.08;
            for (let i = 0; i < 4; i++) {
                const rayX = 150 + i * 280 - parallaxMid * 0.7;
                const wobble = Math.sin(time / 3000 + i) * 10;

                // Main ray
                const rayGradient = ctx.createLinearGradient(rayX, 0, rayX + 50, GAME_HEIGHT);
                rayGradient.addColorStop(0, `rgba(218, 165, 32, ${rayPulse + 0.05})`);
                rayGradient.addColorStop(0.5, `rgba(218, 165, 32, ${rayPulse})`);
                rayGradient.addColorStop(1, 'rgba(218, 165, 32, 0)');

                ctx.fillStyle = rayGradient;
                ctx.beginPath();
                ctx.moveTo(rayX + wobble, 0);
                ctx.lineTo(rayX - 60 + wobble, GAME_HEIGHT);
                ctx.lineTo(rayX + 60 + wobble, GAME_HEIGHT);
                ctx.lineTo(rayX + 100 + wobble, 0);
                ctx.fill();

                // Secondary glow
                ctx.fillStyle = `rgba(255, 250, 200, ${rayPulse * 0.3})`;
                ctx.beginPath();
                ctx.moveTo(rayX + 20 + wobble, 0);
                ctx.lineTo(rayX - 30 + wobble, GAME_HEIGHT);
                ctx.lineTo(rayX + 30 + wobble, GAME_HEIGHT);
                ctx.lineTo(rayX + 70 + wobble, 0);
                ctx.fill();
            }

            // === LAYER 3: Near bookshelf pillars (foreground elements) ===
            ctx.fillStyle = '#4A3020';
            for (let x = -parallaxNear % 400; x < GAME_WIDTH + 400; x += 400) {
                // Large ornate pillar
                const pillarX = x + 20;

                // Pillar shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(pillarX + 35, 0, 15, GAME_HEIGHT);

                // Main pillar body
                ctx.fillStyle = '#5A4030';
                ctx.fillRect(pillarX, 0, 35, GAME_HEIGHT);

                // Pillar highlight
                ctx.fillStyle = '#6A5040';
                ctx.fillRect(pillarX, 0, 8, GAME_HEIGHT);

                // Pillar details (carved sections)
                ctx.fillStyle = '#4A3020';
                for (let y = 40; y < GAME_HEIGHT; y += 120) {
                    ctx.fillRect(pillarX + 5, y, 25, 60);
                    // Carved indentation highlight
                    ctx.fillStyle = '#3A2010';
                    ctx.fillRect(pillarX + 8, y + 3, 19, 54);
                    ctx.fillStyle = '#4A3020';
                }

                // Capital (top decoration)
                ctx.fillStyle = '#6A5040';
                ctx.fillRect(pillarX - 5, 0, 45, 15);
                ctx.fillStyle = '#5A4030';
                ctx.fillRect(pillarX - 3, 15, 41, 8);
            }

            // Near dust particles (largest, brightest)
            this.dustParticles.filter(p => p.layer === 2).forEach(p => {
                const px = (p.x - parallaxNear) % (GAME_WIDTH + 100);
                const sparkle = Math.sin(time / 500 + p.x) * 0.2 + 0.8;
                ctx.fillStyle = `rgba(255, 250, 240, ${p.alpha * sparkle})`;
                ctx.beginPath();
                ctx.arc(px < 0 ? px + GAME_WIDTH + 100 : px, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.y -= p.speed;
                p.x += p.drift;
                if (p.y < -10) p.y = GAME_HEIGHT + 10;
            });

            // === ATMOSPHERIC VIGNETTE ===
            const vignetteGradient = ctx.createRadialGradient(
                GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_HEIGHT * 0.3,
                GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_HEIGHT * 0.9
            );
            vignetteGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignetteGradient.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
            ctx.fillStyle = vignetteGradient;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // === TOP AMBIENT GLOW (from windows above) ===
            const topGlow = ctx.createLinearGradient(0, 0, 0, 100);
            topGlow.addColorStop(0, 'rgba(218, 165, 32, 0.15)');
            topGlow.addColorStop(1, 'rgba(218, 165, 32, 0)');
            ctx.fillStyle = topGlow;
            ctx.fillRect(0, 0, GAME_WIDTH, 100);
        },

        renderHUD() {
            // HP
            for (let i = 0; i < this.player.maxHp; i++) {
                const heart = i < this.player.hp
                    ? Sprites.cache.uiHeart
                    : Sprites.cache.uiHeartEmpty;
                if (heart) ctx.drawImage(heart, 20 + i * 28, 20);
            }

            // Score
            ctx.fillStyle = '#DAA520';
            ctx.font = 'bold 20px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(`SCORE: ${this.score.toString().padStart(6, '0')}`, GAME_WIDTH - 20, 38);

            // Coins
            const coin = Sprites.cache.uiCoin;
            if (coin) ctx.drawImage(coin, GAME_WIDTH - 100, 50);
            ctx.fillText(`× ${this.player.coins}`, GAME_WIDTH - 20, 65);

            // Stage
            ctx.textAlign = 'center';
            ctx.fillText(`STAGE ${this.stageNum}`, GAME_WIDTH/2, 38);

            // Weapon display
            ctx.textAlign = 'left';
            ctx.font = '14px monospace';
            ctx.fillStyle = '#DAA520';
            ctx.fillText(`♟ ${this.player.getWeaponName()}`, 20, 70);

            // Combo counter (with pulse effect)
            if (this.player.combo > 0) {
                const pulse = 1 + Math.sin(Date.now() / 100) * 0.1;
                const comboColors = ['#FFFFFF', '#FFFF00', '#FF8800', '#FF0000', '#FF00FF'];
                const colorIndex = Math.min(Math.floor(this.player.combo / 3), comboColors.length - 1);

                ctx.save();
                ctx.translate(GAME_WIDTH / 2, 70);
                ctx.scale(pulse, pulse);
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = comboColors[colorIndex];
                ctx.fillText(`${this.player.combo} COMBO!`, 0, 0);

                // Multiplier
                ctx.font = '14px sans-serif';
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(`×${this.player.getComboMultiplier().toFixed(1)}`, 0, 18);
                ctx.restore();
            }

            // Dash cooldown indicator
            if (this.player.dashCooldown > 0) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(20, 85, 60 * (1 - this.player.dashCooldown / 60), 4);
            } else {
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(20, 85, 60, 4);
                ctx.font = '10px monospace';
                ctx.fillStyle = '#00FF00';
                ctx.fillText('DASH', 20, 98);
            }

            ctx.textAlign = 'left';
        },

        renderGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = '#FF4444';
            ctx.font = 'bold 48px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', GAME_WIDTH/2, GAME_HEIGHT/2 - 30);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '24px sans-serif';
            ctx.fillText(`Final Score: ${this.score}`, GAME_WIDTH/2, GAME_HEIGHT/2 + 20);

            ctx.fillStyle = '#888';
            ctx.font = '18px sans-serif';
            ctx.fillText('Press SPACE to Return to Title', GAME_WIDTH/2, GAME_HEIGHT/2 + 80);

            ctx.textAlign = 'left';
        },

        renderVictory() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Animated stars background
            ctx.fillStyle = '#FFD700';
            for (let i = 0; i < 20; i++) {
                const x = (Date.now() / 50 + i * 100) % GAME_WIDTH;
                const y = Math.sin(i + Date.now() / 500) * 50 + GAME_HEIGHT / 2;
                const size = Math.sin(Date.now() / 200 + i) * 2 + 3;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = '#DAA520';
            ctx.font = 'bold 56px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('♚ VICTORY! ♚', GAME_WIDTH/2, 140);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '28px Georgia, serif';
            ctx.fillText('Caiso has been defeated!', GAME_WIDTH/2, 200);
            ctx.fillText('You saved your friend!', GAME_WIDTH/2, 240);

            // Stats box
            ctx.fillStyle = 'rgba(218, 165, 32, 0.2)';
            ctx.fillRect(GAME_WIDTH/2 - 150, 270, 300, 150);
            ctx.strokeStyle = '#DAA520';
            ctx.strokeRect(GAME_WIDTH/2 - 150, 270, 300, 150);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '22px monospace';
            ctx.fillText(`Final Score: ${this.score.toLocaleString()}`, GAME_WIDTH/2, 310);

            ctx.font = '18px monospace';
            ctx.fillText(`Coins Collected: ${this.player.coins}`, GAME_WIDTH/2, 345);
            ctx.fillText(`Max Combo: ${this.player.maxCombo}`, GAME_WIDTH/2, 375);
            ctx.fillText(`Final Weapon: ${this.player.getWeaponName()}`, GAME_WIDTH/2, 405);

            // Return prompt
            const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
            ctx.font = '20px sans-serif';
            ctx.fillText('Press SPACE to Return to Title', GAME_WIDTH/2, 480);

            ctx.textAlign = 'left';
        }
    };

    // ============================================
    // GAME LOOP
    // ============================================
    let lastTime = 0;
    const targetFPS = 60;
    const frameTime = 1000 / targetFPS;

    function gameLoop(timestamp) {
        const delta = timestamp - lastTime;

        if (delta >= frameTime) {
            lastTime = timestamp - (delta % frameTime);

            game.update();
            game.render();
        }

        requestAnimationFrame(gameLoop);
    }

    // Initialize and start
    game.init();
    requestAnimationFrame(gameLoop);
    </script>
</body>
