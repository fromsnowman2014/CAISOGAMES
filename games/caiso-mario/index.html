<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Caiso Mario - Chess Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(218, 165, 32, 0.3);
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #backBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #DAA520;
            border: 2px solid #DAA520;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            z-index: 100;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        #backBtn:hover {
            background: #DAA520;
            color: #000;
        }

        #backBtn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        #touchControls {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            padding: 0 20px;
        }

        .touch-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: rgba(218, 165, 32, 0.5);
            border-color: #DAA520;
        }

        .dpad {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
        }

        .dpad .touch-btn {
            width: 50px;
            height: 50px;
        }

        .action-btns {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            gap: 15px;
        }

        @media (max-width: 900px) or (pointer: coarse) {
            #touchControls {
                display: block;
            }
        }

        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #DAA520;
            z-index: 1000;
        }

        .loading-title {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #DAA520;
        }

        .loading-bar {
            width: 200px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
        }

        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #DAA520, #FFD700);
            width: 0%;
            transition: width 0.3s;
        }

        .loading-text {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <a href="../../" id="backBtn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Hub
        </a>
        <div id="touchControls">
            <div class="dpad">
                <div></div>
                <div class="touch-btn" data-key="up">↑</div>
                <div></div>
                <div class="touch-btn" data-key="left">←</div>
                <div></div>
                <div class="touch-btn" data-key="right">→</div>
                <div></div>
                <div class="touch-btn" data-key="down">↓</div>
                <div></div>
            </div>
            <div class="action-btns">
                <div class="touch-btn" data-key="attack" style="background: rgba(255,100,100,0.3);">⚔</div>
                <div class="touch-btn" data-key="jump" style="background: rgba(100,255,100,0.3);">⬆</div>
            </div>
        </div>
        <div id="loadingScreen">
            <div class="loading-title">♟ CAISO MARIO ♟</div>
            <div class="loading-bar">
                <div class="loading-fill" id="loadingFill"></div>
            </div>
            <div class="loading-text" id="loadingText">Loading...</div>
        </div>
    </div>

    <script>
    // ============================================
    // CAISO MARIO - Chess Platformer Game
    // ============================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game dimensions
    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;
    const TILE_SIZE = 32;

    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    // Responsive scaling
    function resizeGame() {
        const container = document.getElementById('gameContainer');
        const maxWidth = window.innerWidth - 20;
        const maxHeight = window.innerHeight - 20;
        const scale = Math.min(maxWidth / GAME_WIDTH, maxHeight / GAME_HEIGHT);

        container.style.width = (GAME_WIDTH * scale) + 'px';
        container.style.height = (GAME_HEIGHT * scale) + 'px';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
    }
    window.addEventListener('resize', resizeGame);
    resizeGame();

    // ============================================
    // PHYSICS CONSTANTS (Mario-style)
    // ============================================
    const PHYSICS = {
        GRAVITY_HOLDING: 0.45,
        GRAVITY_FALLING: 0.85,
        MAX_FALL_SPEED: 14,
        JUMP_FORCE: -13.5,
        JUMP_CUT: 0.4,
        ACCELERATION: 0.6,
        DECELERATION: 0.4,
        MAX_SPEED: 5.5,
        SPRINT_SPEED: 7.5,
        AIR_CONTROL: 0.65,
        FRICTION: 0.82,
        COYOTE_TIME: 8,
        JUMP_BUFFER: 10,
        CORNER_CORRECT: 6
    };

    // ============================================
    // INPUT HANDLER
    // ============================================
    const Input = {
        keys: {},
        justPressed: {},

        init() {
            window.addEventListener('keydown', (e) => {
                if (!this.keys[e.code]) {
                    this.justPressed[e.code] = true;
                }
                this.keys[e.code] = true;
                if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                    e.preventDefault();
                }
            });

            window.addEventListener('keyup', (e) => {
                this.keys[e.code] = false;
            });

            // Touch controls
            document.querySelectorAll('.touch-btn').forEach(btn => {
                const key = btn.dataset.key;
                const keyMap = {
                    'up': 'ArrowUp',
                    'down': 'ArrowDown',
                    'left': 'ArrowLeft',
                    'right': 'ArrowRight',
                    'jump': 'Space',
                    'attack': 'KeyZ'
                };

                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const code = keyMap[key];
                    if (!this.keys[code]) this.justPressed[code] = true;
                    this.keys[code] = true;
                });

                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.keys[keyMap[key]] = false;
                });
            });
        },

        isDown(key) {
            return this.keys[key] || false;
        },

        wasPressed(key) {
            return this.justPressed[key] || false;
        },

        clear() {
            this.justPressed = {};
        },

        get left() { return this.isDown('ArrowLeft') || this.isDown('KeyA'); },
        get right() { return this.isDown('ArrowRight') || this.isDown('KeyD'); },
        get jump() { return this.isDown('Space') || this.isDown('KeyW') || this.isDown('ArrowUp'); },
        get jumpPressed() { return this.wasPressed('Space') || this.wasPressed('KeyW') || this.wasPressed('ArrowUp'); },
        get attack() { return this.wasPressed('KeyZ') || this.wasPressed('KeyJ'); },
        get throw() { return this.wasPressed('KeyX') || this.wasPressed('KeyK'); },
        get dash() { return this.wasPressed('ShiftLeft') || this.wasPressed('ShiftRight'); },
        get sprint() { return this.isDown('ShiftLeft') || this.isDown('ShiftRight'); },
        get down() { return this.isDown('ArrowDown') || this.isDown('KeyS'); }
    };

    // ============================================
    // SPRITE GENERATOR (Procedural)
    // ============================================
    const Sprites = {
        cache: {},

        // Generate player sprite
        createPlayer() {
            const frames = [];
            const colors = {
                skin: '#FFD5B8',
                hair: '#2D1810',
                shirt: '#FFFFFF',
                vest: '#90EE90',
                pants: '#8B4513',
                shoes: '#2D1810',
                glasses: '#333333'
            };

            // Idle frame
            for (let f = 0; f < 4; f++) {
                const c = document.createElement('canvas');
                c.width = 32; c.height = 48;
                const x = c.getContext('2d');

                const bounce = Math.sin(f * Math.PI / 2) * 1;

                // Legs
                x.fillStyle = colors.pants;
                x.fillRect(10, 32 - bounce, 5, 10);
                x.fillRect(17, 32 - bounce, 5, 10);

                // Shoes
                x.fillStyle = colors.shoes;
                x.fillRect(9, 41 - bounce, 6, 5);
                x.fillRect(17, 41 - bounce, 6, 5);

                // Body
                x.fillStyle = colors.shirt;
                x.fillRect(8, 18 - bounce, 16, 16);

                // Vest
                x.fillStyle = colors.vest;
                x.fillRect(8, 18 - bounce, 5, 14);
                x.fillRect(19, 18 - bounce, 5, 14);

                // Arms
                x.fillStyle = colors.skin;
                x.fillRect(4, 20 - bounce, 4, 10);
                x.fillRect(24, 20 - bounce, 4, 10);

                // Head
                x.fillStyle = colors.skin;
                x.fillRect(9, 4 - bounce, 14, 14);

                // Hair
                x.fillStyle = colors.hair;
                x.fillRect(9, 2 - bounce, 14, 6);
                x.fillRect(8, 5 - bounce, 3, 4);
                x.fillRect(21, 5 - bounce, 3, 4);

                // Glasses
                x.fillStyle = colors.glasses;
                x.fillRect(10, 9 - bounce, 5, 4);
                x.fillRect(17, 9 - bounce, 5, 4);
                x.fillRect(15, 10 - bounce, 2, 2);

                // Eyes behind glasses
                x.fillStyle = '#FFFFFF';
                x.fillRect(11, 10 - bounce, 3, 2);
                x.fillRect(18, 10 - bounce, 3, 2);
                x.fillStyle = '#000000';
                x.fillRect(12, 10 - bounce, 2, 2);
                x.fillRect(19, 10 - bounce, 2, 2);

                frames.push(c);
            }

            this.cache.playerIdle = frames;

            // Running frames
            const runFrames = [];
            for (let f = 0; f < 8; f++) {
                const c = document.createElement('canvas');
                c.width = 32; c.height = 48;
                const x = c.getContext('2d');

                const legPhase = Math.sin(f * Math.PI / 2);
                const armPhase = Math.cos(f * Math.PI / 2);
                const bodyBob = Math.abs(Math.sin(f * Math.PI / 4)) * 2;

                // Left leg
                x.fillStyle = colors.pants;
                x.fillRect(10 + legPhase * 3, 32 - bodyBob, 5, 10);
                // Right leg
                x.fillRect(17 - legPhase * 3, 32 - bodyBob, 5, 10);

                // Shoes
                x.fillStyle = colors.shoes;
                x.fillRect(9 + legPhase * 4, 41 - bodyBob, 6, 5);
                x.fillRect(17 - legPhase * 4, 41 - bodyBob, 6, 5);

                // Body
                x.fillStyle = colors.shirt;
                x.fillRect(8, 18 - bodyBob, 16, 16);

                // Vest
                x.fillStyle = colors.vest;
                x.fillRect(8, 18 - bodyBob, 5, 14);
                x.fillRect(19, 18 - bodyBob, 5, 14);

                // Arms
                x.fillStyle = colors.skin;
                x.fillRect(4 + armPhase * 3, 20 - bodyBob, 4, 10);
                x.fillRect(24 - armPhase * 3, 20 - bodyBob, 4, 10);

                // Head
                x.fillStyle = colors.skin;
                x.fillRect(9, 4 - bodyBob, 14, 14);

                // Hair
                x.fillStyle = colors.hair;
                x.fillRect(9, 2 - bodyBob, 14, 6);
                x.fillRect(8, 5 - bodyBob, 3, 4);
                x.fillRect(21, 5 - bodyBob, 3, 4);

                // Glasses
                x.fillStyle = colors.glasses;
                x.fillRect(10, 9 - bodyBob, 5, 4);
                x.fillRect(17, 9 - bodyBob, 5, 4);
                x.fillRect(15, 10 - bodyBob, 2, 2);

                // Eyes
                x.fillStyle = '#FFFFFF';
                x.fillRect(11, 10 - bodyBob, 3, 2);
                x.fillRect(18, 10 - bodyBob, 3, 2);
                x.fillStyle = '#000000';
                x.fillRect(12, 10 - bodyBob, 2, 2);
                x.fillRect(19, 10 - bodyBob, 2, 2);

                runFrames.push(c);
            }
            this.cache.playerRun = runFrames;

            // Jump frame
            const jumpC = document.createElement('canvas');
            jumpC.width = 32; jumpC.height = 48;
            const jx = jumpC.getContext('2d');

            // Legs spread
            jx.fillStyle = colors.pants;
            jx.fillRect(8, 34, 5, 8);
            jx.fillRect(19, 34, 5, 8);
            jx.fillStyle = colors.shoes;
            jx.fillRect(7, 41, 6, 5);
            jx.fillRect(19, 41, 6, 5);

            // Body raised
            jx.fillStyle = colors.shirt;
            jx.fillRect(8, 16, 16, 16);
            jx.fillStyle = colors.vest;
            jx.fillRect(8, 16, 5, 14);
            jx.fillRect(19, 16, 5, 14);

            // Arms up
            jx.fillStyle = colors.skin;
            jx.fillRect(3, 14, 4, 10);
            jx.fillRect(25, 14, 4, 10);

            // Head
            jx.fillStyle = colors.skin;
            jx.fillRect(9, 2, 14, 14);
            jx.fillStyle = colors.hair;
            jx.fillRect(9, 0, 14, 6);
            jx.fillRect(8, 3, 3, 4);
            jx.fillRect(21, 3, 3, 4);

            // Glasses & eyes
            jx.fillStyle = colors.glasses;
            jx.fillRect(10, 7, 5, 4);
            jx.fillRect(17, 7, 5, 4);
            jx.fillRect(15, 8, 2, 2);
            jx.fillStyle = '#FFFFFF';
            jx.fillRect(11, 8, 3, 2);
            jx.fillRect(18, 8, 3, 2);
            jx.fillStyle = '#000000';
            jx.fillRect(12, 8, 2, 2);
            jx.fillRect(19, 8, 2, 2);

            this.cache.playerJump = [jumpC];

            // Fall frame (similar but arms down)
            const fallC = document.createElement('canvas');
            fallC.width = 32; fallC.height = 48;
            const fx = fallC.getContext('2d');

            fx.drawImage(jumpC, 0, 0);
            fx.fillStyle = colors.skin;
            fx.clearRect(3, 14, 4, 10);
            fx.clearRect(25, 14, 4, 10);
            fx.fillRect(2, 18, 4, 12);
            fx.fillRect(26, 18, 4, 12);

            this.cache.playerFall = [fallC];
        },

        // Generate enemy sprites
        createEnemies() {
            // Stone Pawn
            const pawnFrames = [];
            for (let f = 0; f < 4; f++) {
                const c = document.createElement('canvas');
                c.width = 24; c.height = 32;
                const x = c.getContext('2d');

                const wobble = Math.sin(f * Math.PI / 2) * 1;

                // Base
                x.fillStyle = '#4A4A4A';
                x.fillRect(4, 24 + wobble, 16, 8);

                // Body
                x.fillStyle = '#5A5A5A';
                x.fillRect(6, 10 + wobble, 12, 16);

                // Head
                x.fillStyle = '#6A6A6A';
                x.beginPath();
                x.arc(12, 8 + wobble, 6, 0, Math.PI * 2);
                x.fill();

                // Glowing crack (eye)
                x.fillStyle = '#FF4444';
                x.fillRect(9, 6 + wobble, 2, 4);
                x.fillRect(13, 6 + wobble, 2, 4);

                // Rune markings
                x.fillStyle = '#8B0000';
                x.fillRect(8, 16 + wobble, 8, 2);
                x.fillRect(11, 14 + wobble, 2, 6);

                pawnFrames.push(c);
            }
            this.cache.enemyPawn = pawnFrames;

            // Jumping Knight
            const knightFrames = [];
            for (let f = 0; f < 4; f++) {
                const c = document.createElement('canvas');
                c.width = 32; c.height = 40;
                const x = c.getContext('2d');

                // Body
                x.fillStyle = '#2A2A2A';
                x.fillRect(8, 20, 16, 18);

                // Horse head
                x.fillStyle = '#3A3A3A';
                x.fillRect(6, 4, 20, 18);
                x.fillRect(2, 8, 6, 10);

                // Ears
                x.fillRect(8, 0, 4, 6);
                x.fillRect(20, 0, 4, 6);

                // Glowing eyes
                x.fillStyle = '#FF6600';
                x.fillRect(4, 12, 3, 3);

                // Armor details
                x.fillStyle = '#1A1A1A';
                x.fillRect(10, 22, 12, 2);
                x.fillRect(14, 24, 4, 12);

                knightFrames.push(c);
            }
            this.cache.enemyKnight = knightFrames;

            // Sniper Bishop
            const bishopFrames = [];
            for (let f = 0; f < 4; f++) {
                const c = document.createElement('canvas');
                c.width = 28; c.height = 44;
                const x = c.getContext('2d');

                // Robe
                x.fillStyle = '#4B0082';
                x.fillRect(6, 16, 16, 26);
                x.fillRect(4, 20, 20, 20);

                // Hood/head
                x.fillStyle = '#3A0066';
                x.fillRect(8, 8, 12, 12);

                // Pointed top
                x.beginPath();
                x.moveTo(14, 0);
                x.lineTo(8, 10);
                x.lineTo(20, 10);
                x.closePath();
                x.fill();

                // Glowing slit
                x.fillStyle = '#9400D3';
                x.fillRect(12, 14, 4, 2);

                // Staff
                x.fillStyle = '#DAA520';
                x.fillRect(24, 8, 3, 32);
                x.fillStyle = '#FFD700';
                x.fillRect(23, 4, 5, 6);

                bishopFrames.push(c);
            }
            this.cache.enemyBishop = bishopFrames;

            // Charging Rook
            const rookFrames = [];
            for (let f = 0; f < 4; f++) {
                const c = document.createElement('canvas');
                c.width = 36; c.height = 36;
                const x = c.getContext('2d');

                // Base
                x.fillStyle = '#1A1A1A';
                x.fillRect(4, 28, 28, 8);

                // Tower body
                x.fillStyle = '#2A2A2A';
                x.fillRect(6, 8, 24, 22);

                // Battlements
                x.fillRect(4, 2, 6, 8);
                x.fillRect(15, 2, 6, 8);
                x.fillRect(26, 2, 6, 8);

                // Gold trim
                x.fillStyle = '#DAA520';
                x.fillRect(6, 6, 24, 2);
                x.fillRect(6, 26, 24, 2);

                // Glowing window
                x.fillStyle = '#FF0000';
                x.fillRect(14, 14, 8, 8);
                x.fillStyle = '#FF6666';
                x.fillRect(16, 16, 4, 4);

                rookFrames.push(c);
            }
            this.cache.enemyRook = rookFrames;
        },

        // Generate weapon sprites
        createWeapons() {
            // Pawn weapon
            const pawnW = document.createElement('canvas');
            pawnW.width = 16; pawnW.height = 24;
            const pw = pawnW.getContext('2d');

            pw.fillStyle = '#8B4513';
            pw.fillRect(6, 8, 4, 14);
            pw.fillStyle = '#A0522D';
            pw.beginPath();
            pw.arc(8, 6, 5, 0, Math.PI * 2);
            pw.fill();
            pw.fillStyle = '#DAA520';
            pw.beginPath();
            pw.arc(8, 6, 3, 0, Math.PI * 2);
            pw.fill();

            this.cache.weaponPawn = pawnW;
        },

        // Generate tiles
        createTiles() {
            // Ground tile (bookshelf wood)
            const ground = document.createElement('canvas');
            ground.width = 32; ground.height = 32;
            const gx = ground.getContext('2d');

            gx.fillStyle = '#5D4E37';
            gx.fillRect(0, 0, 32, 32);
            gx.fillStyle = '#4A3F2F';
            gx.fillRect(0, 0, 32, 4);
            gx.fillRect(0, 28, 32, 4);
            gx.fillStyle = '#6B5B45';
            for (let i = 0; i < 4; i++) {
                gx.fillRect(i * 8 + 2, 6, 4, 20);
            }

            this.cache.tileGround = ground;

            // Platform (book)
            const platform = document.createElement('canvas');
            platform.width = 32; platform.height = 16;
            const px = platform.getContext('2d');

            px.fillStyle = '#8B0000';
            px.fillRect(0, 0, 32, 16);
            px.fillStyle = '#A52A2A';
            px.fillRect(2, 2, 28, 2);
            px.fillStyle = '#FFFAF0';
            px.fillRect(4, 6, 24, 8);
            px.fillStyle = '#DAA520';
            px.fillRect(0, 0, 3, 16);

            this.cache.tilePlatform = platform;

            // Chess tiles
            const whiteChess = document.createElement('canvas');
            whiteChess.width = 32; whiteChess.height = 32;
            const wcx = whiteChess.getContext('2d');
            wcx.fillStyle = '#F5F5F5';
            wcx.fillRect(0, 0, 32, 32);
            wcx.fillStyle = '#E8E8E8';
            wcx.fillRect(0, 0, 32, 2);
            wcx.fillRect(0, 0, 2, 32);

            this.cache.tileWhite = whiteChess;

            const blackChess = document.createElement('canvas');
            blackChess.width = 32; blackChess.height = 32;
            const bcx = blackChess.getContext('2d');
            bcx.fillStyle = '#2A2A2A';
            bcx.fillRect(0, 0, 32, 32);
            bcx.fillStyle = '#1A1A1A';
            bcx.fillRect(0, 0, 32, 2);
            bcx.fillRect(0, 0, 2, 32);

            this.cache.tileBlack = blackChess;
        },

        // Generate UI elements
        createUI() {
            // Heart icon
            const heart = document.createElement('canvas');
            heart.width = 20; heart.height = 20;
            const hx = heart.getContext('2d');

            hx.fillStyle = '#FF4444';
            hx.beginPath();
            hx.moveTo(10, 18);
            hx.bezierCurveTo(2, 12, 2, 4, 10, 8);
            hx.bezierCurveTo(18, 4, 18, 12, 10, 18);
            hx.fill();
            hx.fillStyle = '#FF8888';
            hx.beginPath();
            hx.arc(6, 7, 2, 0, Math.PI * 2);
            hx.fill();

            this.cache.uiHeart = heart;

            // Empty heart
            const emptyHeart = document.createElement('canvas');
            emptyHeart.width = 20; emptyHeart.height = 20;
            const ehx = emptyHeart.getContext('2d');

            ehx.strokeStyle = '#666666';
            ehx.lineWidth = 2;
            ehx.beginPath();
            ehx.moveTo(10, 18);
            ehx.bezierCurveTo(2, 12, 2, 4, 10, 8);
            ehx.bezierCurveTo(18, 4, 18, 12, 10, 18);
            ehx.stroke();

            this.cache.uiHeartEmpty = emptyHeart;

            // Coin
            const coin = document.createElement('canvas');
            coin.width = 16; coin.height = 16;
            const cx = coin.getContext('2d');

            cx.fillStyle = '#FFD700';
            cx.beginPath();
            cx.arc(8, 8, 7, 0, Math.PI * 2);
            cx.fill();
            cx.fillStyle = '#DAA520';
            cx.beginPath();
            cx.arc(8, 8, 5, 0, Math.PI * 2);
            cx.fill();
            cx.fillStyle = '#FFD700';
            cx.font = 'bold 10px sans-serif';
            cx.textAlign = 'center';
            cx.fillText('$', 8, 12);

            this.cache.uiCoin = coin;
        },

        init() {
            this.createPlayer();
            this.createEnemies();
            this.createWeapons();
            this.createTiles();
            this.createUI();
        }
    };

    // ============================================
    // GAME ENTITIES
    // ============================================
    class Entity {
        constructor(x, y, width, height) {
            this.x = x;
            this.y = y;
            this.width = width;
            this.height = height;
            this.velocityX = 0;
            this.velocityY = 0;
            this.facing = 1; // 1 = right, -1 = left
        }

        get left() { return this.x; }
        get right() { return this.x + this.width; }
        get top() { return this.y; }
        get bottom() { return this.y + this.height; }
        get centerX() { return this.x + this.width / 2; }
        get centerY() { return this.y + this.height / 2; }

        intersects(other) {
            return this.left < other.right &&
                   this.right > other.left &&
                   this.top < other.bottom &&
                   this.bottom > other.top;
        }
    }

    class Player extends Entity {
        constructor(x, y) {
            super(x, y, 24, 44);
            this.hp = 3;
            this.maxHp = 3;
            this.grounded = false;
            this.coyoteTime = 0;
            this.jumpBuffer = 0;
            this.attacking = false;
            this.attackTimer = 0;
            this.invincible = false;
            this.invincibleTimer = 0;
            this.animFrame = 0;
            this.animTimer = 0;
            this.state = 'idle';
            this.coins = 0;
            this.score = 0;

            // New features
            this.throwing = false;
            this.throwCooldown = 0;
            this.dashing = false;
            this.dashTimer = 0;
            this.dashCooldown = 0;
            this.dashDirection = 1;

            // Combo system
            this.combo = 0;
            this.comboTimer = 0;
            this.maxCombo = 0;

            // Weapon upgrade (0=pawn, 1=knight, 2=bishop, 3=rook)
            this.weaponLevel = 0;
            this.canDoubleJump = false;
            this.hasDoubleJumped = false;
        }

        update(level) {
            // Handle input
            const accel = this.grounded ? PHYSICS.ACCELERATION : PHYSICS.ACCELERATION * PHYSICS.AIR_CONTROL;

            if (Input.left) {
                this.velocityX -= accel;
                this.facing = -1;
            } else if (Input.right) {
                this.velocityX += accel;
                this.facing = 1;
            } else {
                this.velocityX *= PHYSICS.FRICTION;
                if (Math.abs(this.velocityX) < 0.1) this.velocityX = 0;
            }

            // Max speed
            const maxSpeed = Input.sprint ? PHYSICS.SPRINT_SPEED : PHYSICS.MAX_SPEED;
            this.velocityX = Math.max(-maxSpeed, Math.min(maxSpeed, this.velocityX));

            // Jump buffer
            if (Input.jumpPressed) {
                this.jumpBuffer = PHYSICS.JUMP_BUFFER;
            }

            // Coyote time & jump
            if (this.grounded) {
                this.coyoteTime = PHYSICS.COYOTE_TIME;
                this.hasDoubleJumped = false; // Reset double jump
            } else {
                this.coyoteTime--;
            }

            // Normal jump
            if (this.jumpBuffer > 0 && this.coyoteTime > 0) {
                this.velocityY = PHYSICS.JUMP_FORCE;
                this.grounded = false;
                this.coyoteTime = 0;
                this.jumpBuffer = 0;
            }
            // Double jump (Knight weapon ability)
            else if (this.jumpBuffer > 0 && this.canDoubleJump && !this.hasDoubleJumped && !this.grounded) {
                this.velocityY = PHYSICS.JUMP_FORCE * 0.85;
                this.hasDoubleJumped = true;
                this.jumpBuffer = 0;
                game.spawnParticles(this.centerX, this.bottom, 'doubleJump', 6);
            }
            this.jumpBuffer--;

            // Variable gravity
            if (this.velocityY < 0 && Input.jump) {
                this.velocityY += PHYSICS.GRAVITY_HOLDING;
            } else {
                this.velocityY += PHYSICS.GRAVITY_FALLING;
            }

            // Jump cut
            if (!Input.jump && this.velocityY < 0) {
                this.velocityY *= PHYSICS.JUMP_CUT;
            }

            // Terminal velocity
            this.velocityY = Math.min(this.velocityY, PHYSICS.MAX_FALL_SPEED);

            // Apply velocity
            this.x += this.velocityX;
            this.y += this.velocityY;

            // Collision with level
            this.grounded = false;
            level.collideWithTiles(this);

            // Attack
            if (Input.attack && !this.attacking) {
                this.attacking = true;
                this.attackTimer = 15;
                // Create attack hitbox
                game.createAttack(this);
            }

            if (this.attacking) {
                this.attackTimer--;
                if (this.attackTimer <= 0) {
                    this.attacking = false;
                }
            }

            // Book throw (X/K key)
            this.throwCooldown = Math.max(0, this.throwCooldown - 1);
            if (Input.throw && this.throwCooldown <= 0 && !this.throwing) {
                this.throwing = true;
                this.throwCooldown = 45; // 0.75 seconds
                // Create book projectile
                const bookVX = this.facing * 8;
                const bookVY = -3; // Slight arc
                game.createProjectile(this.centerX, this.centerY, bookVX, bookVY, 'player');
                game.spawnParticles(this.centerX, this.centerY, 'throw', 4);
                setTimeout(() => this.throwing = false, 200);
            }

            // Dash ability (Shift when direction pressed)
            this.dashCooldown = Math.max(0, this.dashCooldown - 1);
            if (this.dashing) {
                this.dashTimer--;
                this.velocityX = this.dashDirection * 15;
                this.velocityY = 0;
                if (this.dashTimer <= 0) {
                    this.dashing = false;
                    this.velocityX = this.dashDirection * PHYSICS.MAX_SPEED;
                }
            } else if (Input.dash && this.dashCooldown <= 0 && (Input.left || Input.right)) {
                this.dashing = true;
                this.dashTimer = 8;
                this.dashCooldown = 60; // 1 second cooldown
                this.dashDirection = Input.right ? 1 : -1;
                this.invincible = true;
                this.invincibleTimer = Math.max(this.invincibleTimer, 10);
                game.spawnParticles(this.centerX, this.centerY, 'dash', 8);
            }

            // Combo timer decay
            if (this.comboTimer > 0) {
                this.comboTimer--;
                if (this.comboTimer <= 0) {
                    this.combo = 0;
                }
            }

            // Invincibility frames
            if (this.invincible) {
                this.invincibleTimer--;
                if (this.invincibleTimer <= 0) {
                    this.invincible = false;
                }
            }

            // Animation state
            if (this.dashing) {
                this.state = 'dash';
            } else if (this.attacking) {
                this.state = 'attack';
            } else if (this.throwing) {
                this.state = 'throw';
            } else if (!this.grounded) {
                this.state = this.velocityY < 0 ? 'jump' : 'fall';
            } else if (Math.abs(this.velocityX) > 0.5) {
                this.state = 'run';
            } else {
                this.state = 'idle';
            }

            // Animation timer
            this.animTimer++;
            const animSpeed = this.state === 'run' ? 6 : 10;
            if (this.animTimer >= animSpeed) {
                this.animTimer = 0;
                this.animFrame++;
            }

            // Level bounds
            if (this.x < 0) this.x = 0;
            if (this.y > level.height * TILE_SIZE + 100) {
                this.takeDamage(1);
                this.respawn(level);
            }
        }

        takeDamage(amount) {
            if (this.invincible) return;

            this.hp -= amount;
            this.invincible = true;
            this.invincibleTimer = 90; // 1.5 seconds
            this.velocityY = PHYSICS.JUMP_FORCE * 0.5;

            if (this.hp <= 0) {
                game.gameOver();
            }
        }

        respawn(level) {
            const spawn = level.playerStart || { x: 64, y: 200 };
            this.x = spawn.x;
            this.y = spawn.y;
            this.velocityX = 0;
            this.velocityY = 0;
        }

        addCombo() {
            this.combo++;
            this.comboTimer = 120; // 2 seconds to continue combo
            if (this.combo > this.maxCombo) {
                this.maxCombo = this.combo;
            }
        }

        getComboMultiplier() {
            if (this.combo < 3) return 1;
            if (this.combo < 5) return 1.5;
            if (this.combo < 10) return 2;
            if (this.combo < 15) return 3;
            return 4;
        }

        upgradeWeapon() {
            if (this.weaponLevel < 3) {
                this.weaponLevel++;
                game.spawnParticles(this.centerX, this.centerY, 'upgrade', 16);

                // Apply weapon abilities
                switch (this.weaponLevel) {
                    case 1: // Knight - Double jump
                        this.canDoubleJump = true;
                        break;
                    case 2: // Bishop - Stronger throws
                        // Throws deal more damage (handled in projectile creation)
                        break;
                    case 3: // Rook - Extra HP
                        this.maxHp = 5;
                        this.hp = Math.min(this.hp + 2, this.maxHp);
                        break;
                }
            }
        }

        getWeaponName() {
            const names = ['Wooden Pawn', 'Stone Knight', 'Crystal Bishop', 'Marble Rook'];
            return names[this.weaponLevel];
        }

        render(ctx, camera) {
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            // Invincibility flash
            if (this.invincible && Math.floor(this.invincibleTimer / 4) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            // Get sprite based on state
            let sprites;
            switch (this.state) {
                case 'run': sprites = Sprites.cache.playerRun; break;
                case 'jump': sprites = Sprites.cache.playerJump; break;
                case 'fall': sprites = Sprites.cache.playerFall; break;
                default: sprites = Sprites.cache.playerIdle;
            }

            const frame = sprites[this.animFrame % sprites.length];

            ctx.save();
            if (this.facing === -1) {
                ctx.translate(screenX + this.width, screenY);
                ctx.scale(-1, 1);
                ctx.drawImage(frame, 0, 0);
            } else {
                ctx.drawImage(frame, screenX, screenY);
            }
            ctx.restore();

            ctx.globalAlpha = 1;

            // Draw weapon when attacking
            if (this.attacking) {
                const weapon = Sprites.cache.weaponPawn;
                const wx = this.facing === 1 ? screenX + this.width : screenX - 16;
                const wy = screenY + 10;
                ctx.save();
                if (this.facing === -1) {
                    ctx.translate(wx + 16, wy);
                    ctx.scale(-1, 1);
                    ctx.drawImage(weapon, 0, 0);
                } else {
                    ctx.drawImage(weapon, wx, wy);
                }
                ctx.restore();
            }
        }
    }

    // ============================================
    // ENEMIES
    // ============================================
    class Enemy extends Entity {
        constructor(x, y, type) {
            const sizes = {
                pawn: [24, 32],
                knight: [32, 40],
                bishop: [28, 44],
                rook: [36, 36]
            };
            const [w, h] = sizes[type] || [24, 32];
            super(x, y, w, h);

            this.type = type;
            this.hp = type === 'rook' ? 3 : (type === 'knight' ? 2 : 1);
            this.maxHp = this.hp;
            this.animFrame = 0;
            this.animTimer = 0;
            this.state = 'patrol';
            this.cooldown = 0;
            this.stunned = false;
            this.stunTimer = 0;
            this.dead = false;
            this.deathTimer = 0;

            // Type-specific
            this.sightRange = type === 'bishop' ? 300 : 200;
            this.attackRange = type === 'rook' ? 500 : 150;
            this.moveSpeed = type === 'rook' ? 8 : (type === 'knight' ? 0 : 1.5);

            // Knight-specific
            this.charging = false;
            this.chargeTimer = 0;

            // Bishop-specific
            this.aiming = false;
            this.aimTimer = 0;

            // Rook-specific
            this.rushing = false;
        }

        update(player, level) {
            if (this.dead) {
                this.deathTimer++;
                return this.deathTimer > 30;
            }

            if (this.stunned) {
                this.stunTimer--;
                if (this.stunTimer <= 0) {
                    this.stunned = false;
                }
                return false;
            }

            this.cooldown = Math.max(0, this.cooldown - 1);

            const dx = player.centerX - this.centerX;
            const dy = player.centerY - this.centerY;
            const dist = Math.hypot(dx, dy);

            // Type-specific AI
            switch (this.type) {
                case 'pawn':
                    this.updatePawn(player, level, dist, dx);
                    break;
                case 'knight':
                    this.updateKnight(player, level, dist, dx, dy);
                    break;
                case 'bishop':
                    this.updateBishop(player, level, dist, dx, dy);
                    break;
                case 'rook':
                    this.updateRook(player, level, dist, dx, dy);
                    break;
            }

            // Apply gravity for grounded enemies
            if (this.type !== 'knight' || !this.charging) {
                this.velocityY += PHYSICS.GRAVITY_FALLING * 0.5;
                this.velocityY = Math.min(this.velocityY, PHYSICS.MAX_FALL_SPEED);
            }

            this.x += this.velocityX;
            this.y += this.velocityY;

            level.collideWithTiles(this);

            // Animation
            this.animTimer++;
            if (this.animTimer >= 10) {
                this.animTimer = 0;
                this.animFrame++;
            }

            return false;
        }

        updatePawn(player, level, dist, dx) {
            // Patrol or chase
            if (dist < this.sightRange) {
                this.facing = dx > 0 ? 1 : -1;
                this.velocityX = this.facing * this.moveSpeed * 1.5;
                this.state = 'chase';
            } else {
                this.velocityX = this.facing * this.moveSpeed;
                this.state = 'patrol';
            }

            // Turn at edges or walls
            if (this.hitWall || this.atEdge) {
                this.facing *= -1;
            }
        }

        updateKnight(player, level, dist, dx, dy) {
            if (this.charging) {
                this.chargeTimer--;
                if (this.chargeTimer <= 0) {
                    // L-shaped jump
                    const jumpX = Math.sign(dx) * 4;
                    const jumpY = -12;
                    this.velocityX = jumpX;
                    this.velocityY = jumpY;
                    this.charging = false;
                    this.cooldown = 180;
                }
            } else if (dist < this.attackRange && this.cooldown <= 0) {
                // Start charging
                this.charging = true;
                this.chargeTimer = 30;
                this.velocityX = 0;
                this.state = 'charge';
            } else {
                // Idle
                this.velocityX = 0;
                this.state = 'idle';
            }
        }

        updateBishop(player, level, dist, dx, dy) {
            // Only attack if player is on diagonal
            const onDiagonal = Math.abs(Math.abs(dx) - Math.abs(dy)) < 40;

            if (this.aiming) {
                this.aimTimer++;
                if (this.aimTimer >= 60) {
                    // Shoot
                    game.createProjectile(
                        this.centerX, this.centerY,
                        Math.sign(dx) * 6, Math.sign(dy) * 6,
                        'enemy'
                    );
                    this.aiming = false;
                    this.aimTimer = 0;
                    this.cooldown = 120;
                }
            } else if (onDiagonal && dist < this.sightRange && this.cooldown <= 0) {
                this.aiming = true;
                this.state = 'aim';
            } else {
                // Retreat if player too close
                if (dist < 80) {
                    this.velocityX = -Math.sign(dx) * 2;
                } else {
                    this.velocityX = 0;
                }
                this.state = 'idle';
            }
        }

        updateRook(player, level, dist, dx, dy) {
            // Only attack if on same X or Y axis
            const sameX = Math.abs(dx) < 40;
            const sameY = Math.abs(dy) < 40;

            if (this.rushing) {
                // Keep rushing until wall
                if (this.hitWall) {
                    this.rushing = false;
                    this.stunned = true;
                    this.stunTimer = 60;
                    this.velocityX = 0;
                }
            } else if ((sameX || sameY) && this.cooldown <= 0) {
                // Start rush
                this.rushing = true;
                if (sameY) {
                    this.velocityX = Math.sign(dx) * 10;
                } else {
                    this.velocityY = Math.sign(dy) * 10;
                }
                this.state = 'rush';
            } else {
                this.velocityX = 0;
                this.state = 'idle';
            }
        }

        takeDamage(amount) {
            this.hp -= amount;
            if (this.hp <= 0) {
                this.dead = true;
                game.addScore(this.type === 'rook' ? 300 :
                             this.type === 'knight' ? 200 :
                             this.type === 'bishop' ? 250 : 100);
            } else {
                this.stunned = true;
                this.stunTimer = 30;
            }
        }

        render(ctx, camera) {
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            if (this.dead) {
                ctx.globalAlpha = 1 - this.deathTimer / 30;
            }

            if (this.stunned) {
                ctx.globalAlpha = 0.6;
            }

            const spriteKey = `enemy${this.type.charAt(0).toUpperCase() + this.type.slice(1)}`;
            const sprites = Sprites.cache[spriteKey];

            if (sprites) {
                const frame = sprites[this.animFrame % sprites.length];

                ctx.save();
                if (this.facing === -1) {
                    ctx.translate(screenX + this.width, screenY);
                    ctx.scale(-1, 1);
                    ctx.drawImage(frame, 0, 0);
                } else {
                    ctx.drawImage(frame, screenX, screenY);
                }
                ctx.restore();
            }

            ctx.globalAlpha = 1;

            // Warning indicator for Rook
            if (this.type === 'rook' && this.rushing) {
                ctx.fillStyle = '#FF0000';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('CHECK!', screenX, screenY - 10);
            }

            // Aim line for Bishop
            if (this.type === 'bishop' && this.aiming) {
                ctx.strokeStyle = `rgba(148, 0, 211, ${0.5 + Math.sin(this.aimTimer * 0.2) * 0.5})`;
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(screenX + this.width/2, screenY + this.height/2);
                ctx.lineTo(screenX + this.width/2 + this.facing * 200,
                          screenY + this.height/2 + this.facing * 200);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }
    }

    // ============================================
    // BOSS: CAISO
    // ============================================
    class Boss extends Entity {
        constructor(x, y) {
            super(x, y, 128, 128);
            this.hp = 15;
            this.maxHp = 15;
            this.phase = 1; // 1, 2, 3
            this.state = 'idle';
            this.stateTimer = 0;
            this.attackCooldown = 0;
            this.dead = false;
            this.deathTimer = 0;
            this.invincible = false;
            this.invincibleTimer = 0;
            this.animFrame = 0;
            this.animTimer = 0;

            // Attack patterns
            this.currentAttack = null;
            this.attackQueue = [];
        }

        update(player, level) {
            if (this.dead) {
                this.deathTimer++;
                return this.deathTimer > 180; // 3 seconds death animation
            }

            // Update phase based on HP
            if (this.hp <= 5) this.phase = 3;
            else if (this.hp <= 10) this.phase = 2;

            // Invincibility
            if (this.invincible) {
                this.invincibleTimer--;
                if (this.invincibleTimer <= 0) {
                    this.invincible = false;
                }
            }

            this.attackCooldown = Math.max(0, this.attackCooldown - 1);
            this.stateTimer++;

            // Face player
            this.facing = player.centerX < this.centerX ? -1 : 1;

            // State machine
            switch (this.state) {
                case 'idle':
                    if (this.stateTimer > 60 && this.attackCooldown <= 0) {
                        this.chooseAttack();
                    }
                    break;

                case 'roar':
                    if (this.stateTimer > 40) {
                        this.state = 'attack';
                        this.stateTimer = 0;
                    }
                    break;

                case 'attack':
                    this.executeAttack(player);
                    break;

                case 'cooldown':
                    if (this.stateTimer > 60) {
                        this.state = 'idle';
                        this.stateTimer = 0;
                        this.attackCooldown = 30;
                    }
                    break;
            }

            // Animation
            this.animTimer++;
            if (this.animTimer >= 8) {
                this.animTimer = 0;
                this.animFrame++;
            }

            return false;
        }

        chooseAttack() {
            const attacks = ['summon', 'charge', 'projectile'];
            if (this.phase >= 2) attacks.push('slam');
            if (this.phase >= 3) attacks.push('barrage');

            this.currentAttack = attacks[Math.floor(Math.random() * attacks.length)];
            this.state = 'roar';
            this.stateTimer = 0;
        }

        executeAttack(player) {
            switch (this.currentAttack) {
                case 'summon':
                    if (this.stateTimer === 1) {
                        // Spawn minion pawns
                        const count = this.phase;
                        for (let i = 0; i < count; i++) {
                            const spawnX = this.x + (i - count/2) * 100;
                            game.level.enemies.push(new Enemy(spawnX, this.y + 50, 'pawn'));
                        }
                        game.spawnParticles(this.centerX, this.centerY, 'upgrade', 12);
                    }
                    if (this.stateTimer > 30) {
                        this.state = 'cooldown';
                        this.stateTimer = 0;
                    }
                    break;

                case 'charge':
                    if (this.stateTimer === 1) {
                        this.velocityX = this.facing * 8;
                    }
                    this.velocityY += 0.5;
                    this.velocityY = Math.min(this.velocityY, 10);
                    this.x += this.velocityX;
                    this.y += this.velocityY;

                    if (this.stateTimer > 60 || this.x < 50 || this.x > game.level.width * TILE_SIZE - 150) {
                        this.velocityX = 0;
                        this.state = 'cooldown';
                        this.stateTimer = 0;
                        game.spawnParticles(this.centerX, this.bottom, 'hit', 10);
                    }
                    break;

                case 'projectile':
                    if (this.stateTimer % 20 === 1 && this.stateTimer < 80) {
                        const angle = Math.atan2(player.centerY - this.centerY, player.centerX - this.centerX);
                        const speed = 5 + this.phase;
                        game.createProjectile(
                            this.centerX, this.centerY,
                            Math.cos(angle) * speed,
                            Math.sin(angle) * speed,
                            'enemy'
                        );
                    }
                    if (this.stateTimer > 100) {
                        this.state = 'cooldown';
                        this.stateTimer = 0;
                    }
                    break;

                case 'slam':
                    if (this.stateTimer < 30) {
                        this.velocityY = -2;
                    } else if (this.stateTimer === 30) {
                        this.velocityY = 15;
                    }
                    this.y += this.velocityY;

                    if (this.stateTimer > 30 && this.y >= game.level.height * TILE_SIZE - this.height - 64) {
                        this.y = game.level.height * TILE_SIZE - this.height - 64;
                        this.velocityY = 0;
                        // Shockwave
                        for (let i = -3; i <= 3; i++) {
                            game.createProjectile(
                                this.centerX + i * 50, this.bottom,
                                i * 2, -5,
                                'enemy'
                            );
                        }
                        game.spawnParticles(this.centerX, this.bottom, 'hit', 20);
                        this.state = 'cooldown';
                        this.stateTimer = 0;
                    }
                    break;

                case 'barrage':
                    if (this.stateTimer % 8 === 1 && this.stateTimer < 120) {
                        const angle = (this.stateTimer / 8) * 0.5 + Math.PI;
                        game.createProjectile(
                            this.centerX, this.centerY,
                            Math.cos(angle) * 6,
                            Math.sin(angle) * 6,
                            'enemy'
                        );
                        game.createProjectile(
                            this.centerX, this.centerY,
                            Math.cos(-angle) * 6,
                            Math.sin(-angle) * 6,
                            'enemy'
                        );
                    }
                    if (this.stateTimer > 130) {
                        this.state = 'cooldown';
                        this.stateTimer = 0;
                    }
                    break;
            }
        }

        takeDamage(amount) {
            if (this.invincible || this.dead) return;

            this.hp -= amount;
            this.invincible = true;
            this.invincibleTimer = 30;

            game.addScore(50);

            if (this.hp <= 0) {
                this.dead = true;
                this.deathTimer = 0;
                game.addScore(5000);
            }
        }

        intersects(other) {
            // Smaller hitbox for fairness
            const padding = 20;
            return this.left + padding < other.right &&
                   this.right - padding > other.left &&
                   this.top + padding < other.bottom &&
                   this.bottom - padding > other.top;
        }

        render(ctx, camera) {
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            // Invincibility flash
            if (this.invincible && Math.floor(this.invincibleTimer / 3) % 2 === 0) {
                ctx.globalAlpha = 0.6;
            }

            // Death animation
            if (this.dead) {
                ctx.globalAlpha = 1 - this.deathTimer / 180;
                const shake = Math.sin(this.deathTimer * 0.5) * 5;
                ctx.translate(shake, 0);
            }

            // Draw Caiso body
            ctx.save();
            if (this.facing === -1) {
                ctx.translate(screenX + this.width, screenY);
                ctx.scale(-1, 1);
            } else {
                ctx.translate(screenX, screenY);
            }

            // Shadow body
            const pulse = Math.sin(this.animFrame * 0.3) * 5;
            ctx.fillStyle = '#1a0a1a';
            ctx.beginPath();
            ctx.ellipse(64, 80 + pulse, 60, 70, 0, 0, Math.PI * 2);
            ctx.fill();

            // Inner glow
            ctx.fillStyle = '#4a1a4a';
            ctx.beginPath();
            ctx.ellipse(64, 80 + pulse, 45, 55, 0, 0, Math.PI * 2);
            ctx.fill();

            // Mouth
            const mouthOpen = this.state === 'roar' ? 50 : 35;
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.ellipse(64, 85 + pulse, 40, mouthOpen, 0, 0, Math.PI * 2);
            ctx.fill();

            // Teeth
            ctx.fillStyle = '#FFFFFF';
            for (let i = 0; i < 8; i++) {
                const tx = 30 + i * 9;
                ctx.beginPath();
                ctx.moveTo(tx, 60 + pulse);
                ctx.lineTo(tx + 4, 75 + pulse);
                ctx.lineTo(tx + 8, 60 + pulse);
                ctx.fill();
            }

            // Bottom teeth
            for (let i = 0; i < 6; i++) {
                const tx = 38 + i * 9;
                ctx.beginPath();
                ctx.moveTo(tx, 110 + pulse);
                ctx.lineTo(tx + 4, 95 + pulse);
                ctx.lineTo(tx + 8, 110 + pulse);
                ctx.fill();
            }

            // Red glow in mouth
            ctx.fillStyle = '#FF0000';
            ctx.globalAlpha = 0.3 + Math.sin(this.animFrame * 0.5) * 0.2;
            ctx.beginPath();
            ctx.ellipse(64, 85 + pulse, 25, 20, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            // Clock eyes
            const eyeY = 30 + pulse;
            // Left eye
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(40, eyeY, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(40, eyeY, 15, 0, Math.PI * 2);
            ctx.fill();
            // Clock hands
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2;
            const time1 = this.animFrame * 0.1;
            ctx.beginPath();
            ctx.moveTo(40, eyeY);
            ctx.lineTo(40 + Math.cos(time1) * 10, eyeY + Math.sin(time1) * 10);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(40, eyeY);
            ctx.lineTo(40 + Math.cos(time1 * 0.1) * 7, eyeY + Math.sin(time1 * 0.1) * 7);
            ctx.stroke();

            // Right eye
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(88, eyeY, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(88, eyeY, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#FFD700';
            ctx.beginPath();
            ctx.moveTo(88, eyeY);
            ctx.lineTo(88 + Math.cos(-time1) * 10, eyeY + Math.sin(-time1) * 10);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(88, eyeY);
            ctx.lineTo(88 + Math.cos(-time1 * 0.1) * 7, eyeY + Math.sin(-time1 * 0.1) * 7);
            ctx.stroke();

            // Tentacles
            ctx.fillStyle = '#2a0a2a';
            for (let i = 0; i < 4; i++) {
                const tx = 20 + i * 30;
                const wave = Math.sin(this.animFrame * 0.2 + i) * 10;
                ctx.beginPath();
                ctx.moveTo(tx, 120);
                ctx.quadraticCurveTo(tx + wave, 140, tx - 5, 160);
                ctx.quadraticCurveTo(tx + wave * 0.5, 145, tx + 10, 120);
                ctx.fill();
            }

            ctx.restore();
            ctx.globalAlpha = 1;

            // HP Bar
            if (!this.dead) {
                const barWidth = 200;
                const barX = screenX + this.width/2 - barWidth/2;
                const barY = screenY - 30;

                ctx.fillStyle = '#333333';
                ctx.fillRect(barX, barY, barWidth, 12);

                const hpPercent = this.hp / this.maxHp;
                const hpColor = hpPercent > 0.5 ? '#00FF00' :
                               hpPercent > 0.25 ? '#FFFF00' : '#FF0000';
                ctx.fillStyle = hpColor;
                ctx.fillRect(barX + 2, barY + 2, (barWidth - 4) * hpPercent, 8);

                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('CAISO', barX + barWidth/2, barY - 5);
                ctx.textAlign = 'left';
            }
        }
    }

    // ============================================
    // LEVEL SYSTEM
    // ============================================
    class Level {
        constructor(data) {
            this.width = data.width;
            this.height = data.height;
            this.tiles = data.tiles;
            this.enemies = [];
            this.items = [];
            this.playerStart = data.playerStart || { x: 64, y: 200 };

            // Spawn enemies
            if (data.enemies) {
                data.enemies.forEach(e => {
                    if (e.type === 'boss') {
                        this.enemies.push(new Boss(e.x, e.y));
                    } else {
                        this.enemies.push(new Enemy(e.x, e.y, e.type));
                    }
                });
            }
            this.isBossLevel = data.isBossLevel || false;

            // Spawn items
            if (data.items) {
                this.items = data.items.map(i => ({
                    x: i.x, y: i.y, type: i.type, collected: false
                }));
            }
        }

        getTile(x, y) {
            const tx = Math.floor(x / TILE_SIZE);
            const ty = Math.floor(y / TILE_SIZE);
            if (tx < 0 || tx >= this.width || ty < 0 || ty >= this.height) {
                return 0;
            }
            return this.tiles[ty][tx];
        }

        isSolid(tileType) {
            return tileType >= 1 && tileType <= 7;
        }

        collideWithTiles(entity) {
            entity.hitWall = false;
            entity.atEdge = false;

            // Horizontal collision
            const futureX = entity.x + entity.velocityX;

            // Check corners
            const checkY1 = entity.y + 4;
            const checkY2 = entity.bottom - 4;

            if (entity.velocityX > 0) {
                if (this.isSolid(this.getTile(futureX + entity.width, checkY1)) ||
                    this.isSolid(this.getTile(futureX + entity.width, checkY2))) {
                    entity.x = Math.floor((futureX + entity.width) / TILE_SIZE) * TILE_SIZE - entity.width;
                    entity.velocityX = 0;
                    entity.hitWall = true;
                }
            } else if (entity.velocityX < 0) {
                if (this.isSolid(this.getTile(futureX, checkY1)) ||
                    this.isSolid(this.getTile(futureX, checkY2))) {
                    entity.x = Math.floor(futureX / TILE_SIZE) * TILE_SIZE + TILE_SIZE;
                    entity.velocityX = 0;
                    entity.hitWall = true;
                }
            }

            // Vertical collision
            const futureY = entity.y + entity.velocityY;
            const checkX1 = entity.x + 4;
            const checkX2 = entity.right - 4;

            if (entity.velocityY > 0) {
                if (this.isSolid(this.getTile(checkX1, futureY + entity.height)) ||
                    this.isSolid(this.getTile(checkX2, futureY + entity.height))) {
                    entity.y = Math.floor((futureY + entity.height) / TILE_SIZE) * TILE_SIZE - entity.height;
                    entity.velocityY = 0;
                    entity.grounded = true;
                }
            } else if (entity.velocityY < 0) {
                if (this.isSolid(this.getTile(checkX1, futureY)) ||
                    this.isSolid(this.getTile(checkX2, futureY))) {
                    entity.y = Math.floor(futureY / TILE_SIZE) * TILE_SIZE + TILE_SIZE;
                    entity.velocityY = 0;
                }
            }

            // Edge detection for enemies
            if (entity.grounded) {
                const aheadX = entity.facing > 0 ? entity.right + 4 : entity.left - 4;
                if (!this.isSolid(this.getTile(aheadX, entity.bottom + 4))) {
                    entity.atEdge = true;
                }
            }
        }

        render(ctx, camera) {
            const startX = Math.floor(camera.x / TILE_SIZE);
            const startY = Math.floor(camera.y / TILE_SIZE);
            const endX = Math.ceil((camera.x + GAME_WIDTH) / TILE_SIZE);
            const endY = Math.ceil((camera.y + GAME_HEIGHT) / TILE_SIZE);

            for (let y = startY; y <= endY; y++) {
                for (let x = startX; x <= endX; x++) {
                    const tile = this.getTile(x * TILE_SIZE, y * TILE_SIZE);
                    if (tile === 0) continue;

                    const screenX = x * TILE_SIZE - camera.x;
                    const screenY = y * TILE_SIZE - camera.y;

                    let sprite;
                    switch (tile) {
                        case 1: sprite = Sprites.cache.tileGround; break;
                        case 2: sprite = Sprites.cache.tilePlatform; break;
                        case 5: sprite = Sprites.cache.tileWhite; break;
                        case 6: sprite = Sprites.cache.tileBlack; break;
                        default: sprite = Sprites.cache.tileGround;
                    }

                    if (sprite) {
                        ctx.drawImage(sprite, screenX, screenY);
                    }
                }
            }

            // Render items
            this.items.forEach(item => {
                if (item.collected) return;
                const screenX = item.x - camera.x;
                const screenY = item.y - camera.y;
                const bob = Math.sin(Date.now() / 200) * 3;

                if (item.type === 'coin') {
                    const coin = Sprites.cache.uiCoin;
                    ctx.drawImage(coin, screenX, screenY + bob);
                }
                else if (item.type === 'upgrade') {
                    // Glowing chess piece
                    ctx.save();
                    ctx.translate(screenX + 12, screenY + bob + 12);
                    const glow = Math.sin(Date.now() / 150) * 0.3 + 0.7;
                    ctx.globalAlpha = glow;
                    ctx.fillStyle = '#FF00FF';
                    ctx.beginPath();
                    ctx.arc(0, 0, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#FFD700';
                    // Pawn shape
                    ctx.beginPath();
                    ctx.arc(0, -5, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(-4, 0, 8, 10);
                    ctx.fillRect(-8, 10, 16, 4);
                    ctx.restore();
                }
                else if (item.type === 'heart') {
                    const heart = Sprites.cache.uiHeart;
                    if (heart) {
                        ctx.save();
                        const scale = 1 + Math.sin(Date.now() / 200) * 0.1;
                        ctx.translate(screenX + 10, screenY + bob + 10);
                        ctx.scale(scale, scale);
                        ctx.drawImage(heart, -10, -10);
                        ctx.restore();
                    }
                }
            });
        }
    }

    // ============================================
    // CAMERA
    // ============================================
    class Camera {
        constructor() {
            this.x = 0;
            this.y = 0;
            this.smoothing = 0.08;
        }

        follow(target, level) {
            const targetX = target.centerX - GAME_WIDTH / 2;
            const targetY = target.centerY - GAME_HEIGHT / 2;

            this.x += (targetX - this.x) * this.smoothing;
            this.y += (targetY - this.y) * this.smoothing;

            // Bounds
            this.x = Math.max(0, Math.min(this.x, level.width * TILE_SIZE - GAME_WIDTH));
            this.y = Math.max(0, Math.min(this.y, level.height * TILE_SIZE - GAME_HEIGHT));
        }
    }

    // ============================================
    // PROJECTILES & ATTACKS
    // ============================================
    class Projectile {
        constructor(x, y, vx, vy, owner) {
            this.x = x;
            this.y = y;
            this.velocityX = vx;
            this.velocityY = vy;
            this.owner = owner;
            this.width = 12;
            this.height = 12;
            this.lifetime = 180;
        }

        update(level) {
            this.x += this.velocityX;
            this.y += this.velocityY;
            this.lifetime--;

            // Check collision with tiles
            if (level.isSolid(level.getTile(this.x, this.y)) ||
                level.isSolid(level.getTile(this.x + this.width, this.y + this.height))) {
                return true; // Remove
            }

            return this.lifetime <= 0;
        }

        render(ctx, camera) {
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            ctx.fillStyle = this.owner === 'enemy' ? '#9400D3' : '#DAA520';
            ctx.beginPath();
            ctx.arc(screenX + 6, screenY + 6, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = this.owner === 'enemy' ? '#FF00FF' : '#FFD700';
            ctx.beginPath();
            ctx.arc(screenX + 6, screenY + 6, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class Attack {
        constructor(owner, offsetX, offsetY, width, height, duration, damage) {
            this.owner = owner;
            this.offsetX = offsetX;
            this.offsetY = offsetY;
            this.width = width;
            this.height = height;
            this.duration = duration;
            this.damage = damage;
            this.hits = new Set();
        }

        get x() {
            return this.owner.facing === 1
                ? this.owner.x + this.owner.width + this.offsetX
                : this.owner.x - this.width - this.offsetX;
        }

        get y() { return this.owner.y + this.offsetY; }
        get left() { return this.x; }
        get right() { return this.x + this.width; }
        get top() { return this.y; }
        get bottom() { return this.y + this.height; }

        intersects(other) {
            return this.left < other.right &&
                   this.right > other.left &&
                   this.top < other.bottom &&
                   this.bottom > other.top;
        }

        update() {
            this.duration--;
            return this.duration <= 0;
        }

        render(ctx, camera) {
            // Debug hitbox
            if (false) {
                ctx.strokeStyle = '#FF0000';
                ctx.strokeRect(this.x - camera.x, this.y - camera.y, this.width, this.height);
            }
        }
    }

    // ============================================
    // PARTICLE SYSTEM
    // ============================================
    class Particle {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type;
            this.velocityX = (Math.random() - 0.5) * 4;
            this.velocityY = -Math.random() * 4 - 2;
            this.lifetime = 30 + Math.random() * 30;
            this.maxLifetime = this.lifetime;
            this.size = 4 + Math.random() * 4;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotationSpeed = (Math.random() - 0.5) * 0.3;
        }

        update() {
            this.x += this.velocityX;
            this.y += this.velocityY;
            this.velocityY += 0.15;
            this.rotation += this.rotationSpeed;
            this.lifetime--;
            return this.lifetime <= 0;
        }

        render(ctx, camera) {
            const alpha = this.lifetime / this.maxLifetime;
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(this.rotation);
            ctx.globalAlpha = alpha;

            switch (this.type) {
                case 'hit':
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                    break;
                case 'death':
                    ctx.fillStyle = '#FF4444';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'coin':
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'doubleJump':
                    ctx.fillStyle = '#00FFFF';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'dash':
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(-this.size, -this.size/4, this.size * 2, this.size/2);
                    break;
                case 'upgrade':
                    ctx.fillStyle = '#FF00FF';
                    // Star shape
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
                        const r = i % 2 === 0 ? this.size : this.size * 0.5;
                        ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    }
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'heal':
                    ctx.fillStyle = '#FF6666';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'throw':
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(-this.size/2, -this.size/3, this.size, this.size * 0.6);
                    break;
            }

            ctx.restore();
        }
    }

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loadingFill').style.width = '100%';
                document.getElementById('loadingText').textContent = 'Ready!';

                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                    this.state = 'title';

        createLevels() {
            // Level 1: Tutorial

                const row = [];
                for (let x = 0; x < width; x++) {
                    // Floor
                    if (y === height - 2 || y === height - 1) {
                        row.push((x + y) % 2 === 0 ? 5 : 6); // Checkerboard
                    }
                    // Platforms
                    else if (y === 12 && x >= 8 && x <= 12) {
                        row.push(2);

                    else if (y === 10 && x >= 16 && x <= 20) {
                        row.push(2);

                    else if (y === 8 && x >= 24 && x <= 28) {
                        row.push(2);
                    }
                    else if (y === 12 && x >= 32 && x <= 38) {

                    }

                        row.push(2);
                    }
                    else if (y === 8 && x >= 50 && x <= 56) {
                        row.push(2);
                    }
