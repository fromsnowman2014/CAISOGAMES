    // ============================================
    // GAME ENTITIES
    // ============================================
    class Entity {
        constructor(x, y, width, height) {
            this.x = x;
            this.y = y;
            this.width = width;
            this.height = height;
            this.velocityX = 0;
            this.velocityY = 0;
            this.facing = 1; // 1 = right, -1 = left
        }

        get left() { return this.x; }
        get right() { return this.x + this.width; }
        get top() { return this.y; }
        get bottom() { return this.y + this.height; }
        get centerX() { return this.x + this.width / 2; }
        get centerY() { return this.y + this.height / 2; }

        intersects(other) {
            return this.left < other.right &&
                   this.right > other.left &&
                   this.top < other.bottom &&
                   this.bottom > other.top;
        }
    }

    class Player extends Entity {
        constructor(x, y) {
            super(x, y, 24, 44);
            this.hp = 3;
            this.maxHp = 3;
            this.grounded = false;
            this.coyoteTime = 0;
            this.jumpBuffer = 0;
            this.attacking = false;
            this.attackTimer = 0;
            this.invincible = false;
            this.invincibleTimer = 0;
            this.animFrame = 0;
            this.animTimer = 0;
            this.state = 'idle';
            this.coins = 0;
            this.score = 0;

            // New features
            this.throwing = false;
            this.throwCooldown = 0;
            this.dashing = false;
            this.dashTimer = 0;
            this.dashCooldown = 0;
            this.dashDirection = 1;

            // Combo system
            this.combo = 0;
            this.comboTimer = 0;
            this.maxCombo = 0;

            // Weapon upgrade (0=pawn, 1=knight, 2=bishop, 3=rook)
            this.weaponLevel = 0;
            this.canDoubleJump = false;
            this.hasDoubleJumped = false;

            // Visual effects tracking
            this.wasGrounded = false;
            this.runDustTimer = 0;
        }

        update(level) {
            // Track previous grounded state for landing effects
            const wasGrounded = this.grounded;

            // Handle input
            const accel = this.grounded ? PHYSICS.ACCELERATION : PHYSICS.ACCELERATION * PHYSICS.AIR_CONTROL;

            if (Input.left) {
                this.velocityX -= accel;
                this.facing = -1;
            } else if (Input.right) {
                this.velocityX += accel;
                this.facing = 1;
            } else {
                this.velocityX *= PHYSICS.FRICTION;
                if (Math.abs(this.velocityX) < 0.1) this.velocityX = 0;
            }

            // Max speed
            const maxSpeed = Input.sprint ? PHYSICS.SPRINT_SPEED : PHYSICS.MAX_SPEED;
            this.velocityX = Math.max(-maxSpeed, Math.min(maxSpeed, this.velocityX));

            // Jump buffer
            if (Input.jumpPressed) {
                this.jumpBuffer = PHYSICS.JUMP_BUFFER;
            }

            // Coyote time & jump
            if (this.grounded) {
                this.coyoteTime = PHYSICS.COYOTE_TIME;
                this.hasDoubleJumped = false; // Reset double jump
            } else {
                this.coyoteTime--;
            }

            // Normal jump
            if (this.jumpBuffer > 0 && this.coyoteTime > 0) {
                this.velocityY = PHYSICS.JUMP_FORCE;
                this.grounded = false;
                this.coyoteTime = 0;
                this.jumpBuffer = 0;
            }
            // Double jump (Knight weapon ability)
            else if (this.jumpBuffer > 0 && this.canDoubleJump && !this.hasDoubleJumped && !this.grounded) {
                this.velocityY = PHYSICS.JUMP_FORCE * 0.85;
                this.hasDoubleJumped = true;
                this.jumpBuffer = 0;
                game.spawnParticles(this.centerX, this.bottom, 'doubleJump', 6);
            }
            this.jumpBuffer--;

            // Variable gravity
            if (this.velocityY < 0 && Input.jump) {
                this.velocityY += PHYSICS.GRAVITY_HOLDING;
            } else {
                this.velocityY += PHYSICS.GRAVITY_FALLING;
            }

            // Jump cut
            if (!Input.jump && this.velocityY < 0) {
                this.velocityY *= PHYSICS.JUMP_CUT;
            }

            // Terminal velocity
            this.velocityY = Math.min(this.velocityY, PHYSICS.MAX_FALL_SPEED);

            // Apply velocity
            this.x += this.velocityX;
            this.y += this.velocityY;

            // Collision with level
            this.grounded = false;
            level.collideWithTiles(this);

            // Attack
            if (Input.attack && !this.attacking) {
                this.attacking = true;
                this.attackTimer = 15;
                // Create attack hitbox
                game.createAttack(this);
            }

            if (this.attacking) {
                this.attackTimer--;
                if (this.attackTimer <= 0) {
                    this.attacking = false;
                }
            }

            // Book throw (X/K key)
            this.throwCooldown = Math.max(0, this.throwCooldown - 1);
            if (Input.throw && this.throwCooldown <= 0 && !this.throwing) {
                this.throwing = true;
                this.throwCooldown = 45; // 0.75 seconds
                // Create book projectile
                const bookVX = this.facing * 8;
                const bookVY = -3; // Slight arc
                game.createProjectile(this.centerX, this.centerY, bookVX, bookVY, 'player');
                game.spawnParticles(this.centerX, this.centerY, 'throw', 4);
                setTimeout(() => this.throwing = false, 200);
            }

            // Dash ability (Shift when direction pressed)
            this.dashCooldown = Math.max(0, this.dashCooldown - 1);
            if (this.dashing) {
                this.dashTimer--;
                this.velocityX = this.dashDirection * 15;
                this.velocityY = 0;
                if (this.dashTimer <= 0) {
                    this.dashing = false;
                    this.velocityX = this.dashDirection * PHYSICS.MAX_SPEED;
                }
            } else if (Input.dash && this.dashCooldown <= 0 && (Input.left || Input.right)) {
                this.dashing = true;
                this.dashTimer = 8;
                this.dashCooldown = 60; // 1 second cooldown
                this.dashDirection = Input.right ? 1 : -1;
                this.invincible = true;
                this.invincibleTimer = Math.max(this.invincibleTimer, 10);
                game.spawnParticles(this.centerX, this.centerY, 'dash', 8);
            }

            // Combo timer decay
            if (this.comboTimer > 0) {
                this.comboTimer--;
                if (this.comboTimer <= 0) {
                    this.combo = 0;
                }
            }

            // Invincibility frames
            if (this.invincible) {
                this.invincibleTimer--;
                if (this.invincibleTimer <= 0) {
                    this.invincible = false;
                }
            }

            // Landing dust particles
            if (this.grounded && !wasGrounded && Math.abs(this.velocityY) < 1) {
                // Just landed - spawn dust
                const dustCount = 4;
                for (let i = 0; i < dustCount; i++) {
                    const side = i < dustCount / 2 ? -1 : 1;
                    game.particles.push(new Particle(
                        this.centerX + side * 8,
                        this.bottom,
                        'dust', {
                            vx: side * (1 + Math.random() * 2),
                            vy: -Math.random() * 1.5 - 0.5,
                            size: 6 + Math.random() * 6,
                            lifetime: 25 + Math.random() * 15,
                            gravity: 0.05
                        }
                    ));
                }
            }

            // Running dust particles
            if (this.grounded && Math.abs(this.velocityX) > 3) {
                this.runDustTimer++;
                if (this.runDustTimer >= 8) {
                    this.runDustTimer = 0;
                    game.particles.push(new Particle(
                        this.centerX - this.facing * 8,
                        this.bottom,
                        'dust', {
                            vx: -this.facing * (0.5 + Math.random()),
                            vy: -Math.random() * 0.8 - 0.2,
                            size: 4 + Math.random() * 4,
                            lifetime: 20 + Math.random() * 10,
                            gravity: 0.03
                        }
                    ));
                }
            } else {
                this.runDustTimer = 0;
            }

            // Animation state
            if (this.dashing) {
                this.state = 'dash';
            } else if (this.attacking) {
                this.state = 'attack';
            } else if (this.throwing) {
                this.state = 'throw';
            } else if (!this.grounded) {
                this.state = this.velocityY < 0 ? 'jump' : 'fall';
            } else if (Math.abs(this.velocityX) > 0.5) {
                this.state = 'run';
            } else {
                this.state = 'idle';
            }

            // Animation timer
            this.animTimer++;
            const animSpeed = this.state === 'run' ? 6 : 10;
            if (this.animTimer >= animSpeed) {
                this.animTimer = 0;
                this.animFrame++;
            }

            // Level bounds
            if (this.x < 0) this.x = 0;
            if (this.y > level.height * TILE_SIZE + 100) {
                this.takeDamage(1);
                this.respawn(level);
            }
        }

        takeDamage(amount) {
            if (this.invincible) return;

            this.hp -= amount;
            this.invincible = true;
            this.invincibleTimer = 90; // 1.5 seconds
            this.velocityY = PHYSICS.JUMP_FORCE * 0.5;

            // Screen effects on player damage
            game.shake(8, 15);
            game.flash('#FF0000', 10);
            game.triggerHitstop(5);

            // Spawn damage particles
            for (let i = 0; i < 6; i++) {
                game.particles.push(new Particle(this.centerX, this.centerY, 'enemyHit', {
                    vx: (Math.random() - 0.5) * 6,
                    vy: -Math.random() * 5 - 2,
                    size: 6 + Math.random() * 4
                }));
            }

            if (this.hp <= 0) {
                game.gameOver();
            }
        }

        respawn(level) {
            const spawn = level.playerStart || { x: 64, y: 200 };
            this.x = spawn.x;
            this.y = spawn.y;
            this.velocityX = 0;
            this.velocityY = 0;
        }

        addCombo() {
            this.combo++;
            this.comboTimer = 120; // 2 seconds to continue combo
            if (this.combo > this.maxCombo) {
                this.maxCombo = this.combo;
            }
        }

        getComboMultiplier() {
            if (this.combo < 3) return 1;
            if (this.combo < 5) return 1.5;
            if (this.combo < 10) return 2;
            if (this.combo < 15) return 3;
            return 4;
        }

        upgradeWeapon() {
            if (this.weaponLevel < 3) {
                this.weaponLevel++;
                game.spawnParticles(this.centerX, this.centerY, 'upgrade', 16);

                // Apply weapon abilities
                switch (this.weaponLevel) {
                    case 1: // Knight - Double jump
                        this.canDoubleJump = true;
                        break;
                    case 2: // Bishop - Stronger throws
                        // Throws deal more damage (handled in projectile creation)
                        break;
                    case 3: // Rook - Extra HP
                        this.maxHp = 5;
                        this.hp = Math.min(this.hp + 2, this.maxHp);
                        break;
                }
            }
        }

        getWeaponName() {
            const names = ['Wooden Pawn', 'Stone Knight', 'Crystal Bishop', 'Marble Rook'];
            return names[this.weaponLevel];
        }

        render(ctx, camera) {
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            // Invincibility flash
            if (this.invincible && Math.floor(this.invincibleTimer / 4) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            // Get sprite based on state
            let sprites;
            switch (this.state) {
                case 'run': sprites = Sprites.cache.playerRun; break;
                case 'jump': sprites = Sprites.cache.playerJump; break;
                case 'fall': sprites = Sprites.cache.playerFall; break;
                default: sprites = Sprites.cache.playerIdle;
            }

            const frame = sprites[this.animFrame % sprites.length];

            ctx.save();
            if (this.facing === -1) {
                ctx.translate(screenX + this.width, screenY);
                ctx.scale(-1, 1);
                ctx.drawImage(frame, 0, 0);
            } else {
                ctx.drawImage(frame, screenX, screenY);
            }
            ctx.restore();

            ctx.globalAlpha = 1;

            // Draw weapon when attacking
            if (this.attacking) {
                const weapon = Sprites.cache.weaponPawn;
                const wx = this.facing === 1 ? screenX + this.width : screenX - 16;
                const wy = screenY + 10;
                ctx.save();
                if (this.facing === -1) {
                    ctx.translate(wx + 16, wy);
                    ctx.scale(-1, 1);
                    ctx.drawImage(weapon, 0, 0);
                } else {
                    ctx.drawImage(weapon, wx, wy);
                }
                ctx.restore();
            }
        }
    }

    // ============================================
    // ENEMIES
    // ============================================
    class Enemy extends Entity {
        constructor(x, y, type) {
            const sizes = {
                pawn: [24, 32],
                knight: [32, 40],
                bishop: [28, 44],
                rook: [36, 36]
            };
            const [w, h] = sizes[type] || [24, 32];
            super(x, y, w, h);

            this.type = type;
            this.hp = type === 'rook' ? 3 : (type === 'knight' ? 2 : 1);
            this.maxHp = this.hp;
            this.animFrame = 0;
            this.animTimer = 0;
            this.state = 'patrol';
            this.cooldown = 0;
            this.stunned = false;
            this.stunTimer = 0;
            this.dead = false;
            this.deathTimer = 0;

            // Type-specific
            this.sightRange = type === 'bishop' ? 300 : 200;
            this.attackRange = type === 'rook' ? 500 : 150;
            this.moveSpeed = type === 'rook' ? 8 : (type === 'knight' ? 0 : 1.5);

            // Knight-specific
            this.charging = false;
            this.chargeTimer = 0;

            // Bishop-specific
            this.aiming = false;
            this.aimTimer = 0;

            // Rook-specific
            this.rushing = false;
        }

        update(player, level) {
            if (this.dead) {
                this.deathTimer++;
                return this.deathTimer > 30;
            }

            if (this.stunned) {
                this.stunTimer--;
                if (this.stunTimer <= 0) {
                    this.stunned = false;
                }
                return false;
            }

            this.cooldown = Math.max(0, this.cooldown - 1);

            const dx = player.centerX - this.centerX;
            const dy = player.centerY - this.centerY;
            const dist = Math.hypot(dx, dy);

            // Type-specific AI
            switch (this.type) {
                case 'pawn':
                    this.updatePawn(player, level, dist, dx);
                    break;
                case 'knight':
                    this.updateKnight(player, level, dist, dx, dy);
                    break;
                case 'bishop':
                    this.updateBishop(player, level, dist, dx, dy);
                    break;
                case 'rook':
                    this.updateRook(player, level, dist, dx, dy);
                    break;
            }

            // Apply gravity for grounded enemies
            if (this.type !== 'knight' || !this.charging) {
                this.velocityY += PHYSICS.GRAVITY_FALLING * 0.5;
                this.velocityY = Math.min(this.velocityY, PHYSICS.MAX_FALL_SPEED);
            }

            this.x += this.velocityX;
            this.y += this.velocityY;

            level.collideWithTiles(this);

            // Animation
            this.animTimer++;
            if (this.animTimer >= 10) {
                this.animTimer = 0;
                this.animFrame++;
            }

            return false;
        }

        updatePawn(player, level, dist, dx) {
            // Patrol or chase
            if (dist < this.sightRange) {
                this.facing = dx > 0 ? 1 : -1;
                this.velocityX = this.facing * this.moveSpeed * 1.5;
                this.state = 'chase';
            } else {
                this.velocityX = this.facing * this.moveSpeed;
                this.state = 'patrol';
            }

            // Turn at edges or walls
            if (this.hitWall || this.atEdge) {
                this.facing *= -1;
            }
        }

        updateKnight(player, level, dist, dx, dy) {
            if (this.charging) {
                this.chargeTimer--;
                if (this.chargeTimer <= 0) {
                    // L-shaped jump
                    const jumpX = Math.sign(dx) * 4;
                    const jumpY = -12;
                    this.velocityX = jumpX;
                    this.velocityY = jumpY;
                    this.charging = false;
                    this.cooldown = 180;
                }
            } else if (dist < this.attackRange && this.cooldown <= 0) {
                // Start charging
                this.charging = true;
                this.chargeTimer = 30;
                this.velocityX = 0;
                this.state = 'charge';
            } else {
                // Idle
                this.velocityX = 0;
                this.state = 'idle';
            }
        }

        updateBishop(player, level, dist, dx, dy) {
            // Only attack if player is on diagonal
            const onDiagonal = Math.abs(Math.abs(dx) - Math.abs(dy)) < 40;

            if (this.aiming) {
                this.aimTimer++;
                if (this.aimTimer >= 60) {
                    // Shoot
                    game.createProjectile(
                        this.centerX, this.centerY,
                        Math.sign(dx) * 6, Math.sign(dy) * 6,
                        'enemy'
                    );
                    this.aiming = false;
                    this.aimTimer = 0;
                    this.cooldown = 120;
                }
            } else if (onDiagonal && dist < this.sightRange && this.cooldown <= 0) {
                this.aiming = true;
                this.state = 'aim';
            } else {
                // Retreat if player too close
                if (dist < 80) {
                    this.velocityX = -Math.sign(dx) * 2;
                } else {
                    this.velocityX = 0;
                }
                this.state = 'idle';
            }
        }

        updateRook(player, level, dist, dx, dy) {
            // Only attack if on same X or Y axis
            const sameX = Math.abs(dx) < 40;
            const sameY = Math.abs(dy) < 40;

            if (this.rushing) {
                // Keep rushing until wall
                if (this.hitWall) {
                    this.rushing = false;
                    this.stunned = true;
                    this.stunTimer = 60;
                    this.velocityX = 0;
                }
            } else if ((sameX || sameY) && this.cooldown <= 0) {
                // Start rush
                this.rushing = true;
                if (sameY) {
                    this.velocityX = Math.sign(dx) * 10;
                } else {
                    this.velocityY = Math.sign(dy) * 10;
                }
                this.state = 'rush';
            } else {
                this.velocityX = 0;
                this.state = 'idle';
            }
        }

        takeDamage(amount) {
            this.hp -= amount;
            if (this.hp <= 0) {
                this.dead = true;
                const points = this.type === 'rook' ? 300 :
                              this.type === 'knight' ? 200 :
                              this.type === 'bishop' ? 250 : 100;
                game.addScore(points, this.centerX, this.centerY);

                // Death effects
                game.shake(6, 10);
                game.triggerHitstop(4);

                // Death particles
                for (let i = 0; i < 12; i++) {
                    game.particles.push(new Particle(this.centerX, this.centerY, 'death', {
                        vx: (Math.random() - 0.5) * 8,
                        vy: -Math.random() * 6 - 2,
                        size: 8 + Math.random() * 8,
                        lifetime: 40 + Math.random() * 20
                    }));
                }

                // Combo burst if applicable
                if (game.player.combo >= 3) {
                    game.particles.push(...createComboBurst(this.centerX, this.centerY, game.player.combo));
                }
            } else {
                this.stunned = true;
                this.stunTimer = 30;

                // Hit effects (not killed)
                game.shake(3, 6);
                game.triggerHitstop(2);

                // Smaller hit particles
                for (let i = 0; i < 5; i++) {
                    game.particles.push(new Particle(this.centerX, this.centerY, 'hit', {
                        vx: (Math.random() - 0.5) * 5,
                        vy: -Math.random() * 4 - 1,
                        size: 4 + Math.random() * 4
                    }));
                }
            }
        }

        render(ctx, camera) {
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            if (this.dead) {
                ctx.globalAlpha = 1 - this.deathTimer / 30;
            }

            if (this.stunned) {
                ctx.globalAlpha = 0.6;
            }

            const spriteKey = `enemy${this.type.charAt(0).toUpperCase() + this.type.slice(1)}`;
            const sprites = Sprites.cache[spriteKey];

            if (sprites) {
                const frame = sprites[this.animFrame % sprites.length];

                ctx.save();
                if (this.facing === -1) {
                    ctx.translate(screenX + this.width, screenY);
                    ctx.scale(-1, 1);
                    ctx.drawImage(frame, 0, 0);
                } else {
                    ctx.drawImage(frame, screenX, screenY);
                }
                ctx.restore();
            }

            ctx.globalAlpha = 1;

            // Warning indicator for Rook
            if (this.type === 'rook' && this.rushing) {
                ctx.fillStyle = '#FF0000';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('CHECK!', screenX, screenY - 10);
            }

            // Aim line for Bishop
            if (this.type === 'bishop' && this.aiming) {
                ctx.strokeStyle = `rgba(148, 0, 211, ${0.5 + Math.sin(this.aimTimer * 0.2) * 0.5})`;
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(screenX + this.width/2, screenY + this.height/2);
                ctx.lineTo(screenX + this.width/2 + this.facing * 200,
                          screenY + this.height/2 + this.facing * 200);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }
    }

    // ============================================
    // BOSS: CAISO
    // ============================================
    class Boss extends Entity {
        constructor(x, y) {
            super(x, y, 128, 128);
            this.hp = 15;
            this.maxHp = 15;
            this.phase = 1; // 1, 2, 3
            this.state = 'idle';
            this.stateTimer = 0;
            this.attackCooldown = 0;
            this.dead = false;
            this.deathTimer = 0;
            this.invincible = false;
            this.invincibleTimer = 0;
            this.animFrame = 0;
            this.animTimer = 0;

            // Attack patterns
            this.currentAttack = null;
            this.attackQueue = [];
        }

        update(player, level) {
            if (this.dead) {
                this.deathTimer++;
                return this.deathTimer > 180; // 3 seconds death animation
            }

            // Update phase based on HP
            if (this.hp <= 5) this.phase = 3;
            else if (this.hp <= 10) this.phase = 2;

            // Invincibility
            if (this.invincible) {
                this.invincibleTimer--;
                if (this.invincibleTimer <= 0) {
                    this.invincible = false;
                }
            }

            this.attackCooldown = Math.max(0, this.attackCooldown - 1);
            this.stateTimer++;

            // Face player
            this.facing = player.centerX < this.centerX ? -1 : 1;

            // State machine
            switch (this.state) {
                case 'idle':
                    if (this.stateTimer > 60 && this.attackCooldown <= 0) {
                        this.chooseAttack();
                    }
                    break;

                case 'roar':
                    if (this.stateTimer > 40) {
                        this.state = 'attack';
                        this.stateTimer = 0;
                    }
                    break;

                case 'attack':
                    this.executeAttack(player);
                    break;

                case 'cooldown':
                    if (this.stateTimer > 60) {
                        this.state = 'idle';
                        this.stateTimer = 0;
                        this.attackCooldown = 30;
                    }
                    break;
            }

            // Animation
            this.animTimer++;
            if (this.animTimer >= 8) {
                this.animTimer = 0;
                this.animFrame++;
            }

            return false;
        }

        chooseAttack() {
            const attacks = ['summon', 'charge', 'projectile'];
            if (this.phase >= 2) attacks.push('slam');
            if (this.phase >= 3) attacks.push('barrage');

            this.currentAttack = attacks[Math.floor(Math.random() * attacks.length)];
            this.state = 'roar';
            this.stateTimer = 0;
        }

        executeAttack(player) {
            switch (this.currentAttack) {
                case 'summon':
                    if (this.stateTimer === 1) {
                        // Spawn minion pawns
                        const count = this.phase;
                        for (let i = 0; i < count; i++) {
                            const spawnX = this.x + (i - count/2) * 100;
                            game.level.enemies.push(new Enemy(spawnX, this.y + 50, 'pawn'));
                        }
                        game.spawnParticles(this.centerX, this.centerY, 'upgrade', 12);
                    }
                    if (this.stateTimer > 30) {
                        this.state = 'cooldown';
                        this.stateTimer = 0;
                    }
                    break;

                case 'charge':
                    if (this.stateTimer === 1) {
                        this.velocityX = this.facing * 8;
                    }
                    this.velocityY += 0.5;
                    this.velocityY = Math.min(this.velocityY, 10);
                    this.x += this.velocityX;
                    this.y += this.velocityY;

                    if (this.stateTimer > 60 || this.x < 50 || this.x > game.level.width * TILE_SIZE - 150) {
                        this.velocityX = 0;
                        this.state = 'cooldown';
                        this.stateTimer = 0;
                        game.spawnParticles(this.centerX, this.bottom, 'hit', 10);
                    }
                    break;

                case 'projectile':
                    if (this.stateTimer % 20 === 1 && this.stateTimer < 80) {
                        const angle = Math.atan2(player.centerY - this.centerY, player.centerX - this.centerX);
                        const speed = 5 + this.phase;
                        game.createProjectile(
                            this.centerX, this.centerY,
                            Math.cos(angle) * speed,
                            Math.sin(angle) * speed,
                            'enemy'
                        );
                    }
                    if (this.stateTimer > 100) {
                        this.state = 'cooldown';
                        this.stateTimer = 0;
                    }
                    break;

                case 'slam':
                    if (this.stateTimer < 30) {
                        this.velocityY = -2;
                    } else if (this.stateTimer === 30) {
                        this.velocityY = 15;
                    }
                    this.y += this.velocityY;

                    if (this.stateTimer > 30 && this.y >= game.level.height * TILE_SIZE - this.height - 64) {
                        this.y = game.level.height * TILE_SIZE - this.height - 64;
                        this.velocityY = 0;
                        // Shockwave
                        for (let i = -3; i <= 3; i++) {
                            game.createProjectile(
                                this.centerX + i * 50, this.bottom,
                                i * 2, -5,
                                'enemy'
                            );
                        }
                        game.spawnParticles(this.centerX, this.bottom, 'hit', 20);
                        this.state = 'cooldown';
                        this.stateTimer = 0;
                    }
                    break;

                case 'barrage':
                    if (this.stateTimer % 8 === 1 && this.stateTimer < 120) {
                        const angle = (this.stateTimer / 8) * 0.5 + Math.PI;
                        game.createProjectile(
                            this.centerX, this.centerY,
                            Math.cos(angle) * 6,
                            Math.sin(angle) * 6,
                            'enemy'
                        );
                        game.createProjectile(
                            this.centerX, this.centerY,
                            Math.cos(-angle) * 6,
                            Math.sin(-angle) * 6,
                            'enemy'
                        );
                    }
                    if (this.stateTimer > 130) {
                        this.state = 'cooldown';
                        this.stateTimer = 0;
                    }
                    break;
            }
        }

        takeDamage(amount) {
            if (this.invincible || this.dead) return;

            this.hp -= amount;
            this.invincible = true;
            this.invincibleTimer = 30;

            game.addScore(50, this.centerX, this.centerY);

            // Boss hit effects - more intense
            game.shake(10, 12);
            game.triggerHitstop(6);
            game.flash('#9400D3', 8); // Purple flash for boss

            // Magic particles
            for (let i = 0; i < 15; i++) {
                game.particles.push(new Particle(
                    this.centerX + (Math.random() - 0.5) * this.width,
                    this.centerY + (Math.random() - 0.5) * this.height,
                    'magic', {
                        vx: (Math.random() - 0.5) * 8,
                        vy: -Math.random() * 6 - 2,
                        size: 8 + Math.random() * 8,
                        color: Math.random() > 0.5 ? '#9400D3' : '#4169E1'
                    }
                ));
            }

            if (this.hp <= 0) {
                this.dead = true;
                this.deathTimer = 0;
                game.addScore(5000, this.centerX, this.centerY - 50);

                // Epic death effects
                game.shake(20, 60);
                game.flash('#FFFFFF', 20);

                // Massive particle explosion
                for (let i = 0; i < 50; i++) {
                    const angle = (Math.PI * 2 * i) / 50;
                    game.particles.push(new Particle(this.centerX, this.centerY, 'magic', {
                        vx: Math.cos(angle) * (5 + Math.random() * 5),
                        vy: Math.sin(angle) * (5 + Math.random() * 5),
                        size: 10 + Math.random() * 10,
                        lifetime: 80 + Math.random() * 40,
                        color: ['#9400D3', '#4169E1', '#FFD700', '#FF4444'][Math.floor(Math.random() * 4)]
                    }));
                }
            }
        }

        intersects(other) {
            // Smaller hitbox for fairness
            const padding = 20;
            return this.left + padding < other.right &&
                   this.right - padding > other.left &&
                   this.top + padding < other.bottom &&
                   this.bottom - padding > other.top;
        }

        render(ctx, camera) {
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            // Invincibility flash
            if (this.invincible && Math.floor(this.invincibleTimer / 3) % 2 === 0) {
                ctx.globalAlpha = 0.6;
            }

            // Death animation
            if (this.dead) {
                ctx.globalAlpha = 1 - this.deathTimer / 180;
                const shake = Math.sin(this.deathTimer * 0.5) * 5;
                ctx.translate(shake, 0);
            }

            // Draw Caiso body
            ctx.save();
            if (this.facing === -1) {
                ctx.translate(screenX + this.width, screenY);
                ctx.scale(-1, 1);
            } else {
                ctx.translate(screenX, screenY);
            }

            // Shadow body
            const pulse = Math.sin(this.animFrame * 0.3) * 5;
            ctx.fillStyle = '#1a0a1a';
            ctx.beginPath();
            ctx.ellipse(64, 80 + pulse, 60, 70, 0, 0, Math.PI * 2);
            ctx.fill();

            // Inner glow
            ctx.fillStyle = '#4a1a4a';
            ctx.beginPath();
            ctx.ellipse(64, 80 + pulse, 45, 55, 0, 0, Math.PI * 2);
            ctx.fill();

            // Mouth
            const mouthOpen = this.state === 'roar' ? 50 : 35;
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.ellipse(64, 85 + pulse, 40, mouthOpen, 0, 0, Math.PI * 2);
            ctx.fill();

            // Teeth
            ctx.fillStyle = '#FFFFFF';
            for (let i = 0; i < 8; i++) {
                const tx = 30 + i * 9;
                ctx.beginPath();
                ctx.moveTo(tx, 60 + pulse);
                ctx.lineTo(tx + 4, 75 + pulse);
                ctx.lineTo(tx + 8, 60 + pulse);
                ctx.fill();
            }

            // Bottom teeth
            for (let i = 0; i < 6; i++) {
                const tx = 38 + i * 9;
                ctx.beginPath();
                ctx.moveTo(tx, 110 + pulse);
                ctx.lineTo(tx + 4, 95 + pulse);
                ctx.lineTo(tx + 8, 110 + pulse);
                ctx.fill();
            }

            // Red glow in mouth
            ctx.fillStyle = '#FF0000';
            ctx.globalAlpha = 0.3 + Math.sin(this.animFrame * 0.5) * 0.2;
            ctx.beginPath();
            ctx.ellipse(64, 85 + pulse, 25, 20, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            // Clock eyes
            const eyeY = 30 + pulse;
            // Left eye
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(40, eyeY, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(40, eyeY, 15, 0, Math.PI * 2);
            ctx.fill();
            // Clock hands
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2;
            const time1 = this.animFrame * 0.1;
            ctx.beginPath();
            ctx.moveTo(40, eyeY);
            ctx.lineTo(40 + Math.cos(time1) * 10, eyeY + Math.sin(time1) * 10);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(40, eyeY);
            ctx.lineTo(40 + Math.cos(time1 * 0.1) * 7, eyeY + Math.sin(time1 * 0.1) * 7);
            ctx.stroke();

            // Right eye
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(88, eyeY, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(88, eyeY, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#FFD700';
            ctx.beginPath();
            ctx.moveTo(88, eyeY);
            ctx.lineTo(88 + Math.cos(-time1) * 10, eyeY + Math.sin(-time1) * 10);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(88, eyeY);
            ctx.lineTo(88 + Math.cos(-time1 * 0.1) * 7, eyeY + Math.sin(-time1 * 0.1) * 7);
            ctx.stroke();

            // Tentacles
            ctx.fillStyle = '#2a0a2a';
            for (let i = 0; i < 4; i++) {
                const tx = 20 + i * 30;
                const wave = Math.sin(this.animFrame * 0.2 + i) * 10;
                ctx.beginPath();
                ctx.moveTo(tx, 120);
                ctx.quadraticCurveTo(tx + wave, 140, tx - 5, 160);
                ctx.quadraticCurveTo(tx + wave * 0.5, 145, tx + 10, 120);
                ctx.fill();
            }

            ctx.restore();
            ctx.globalAlpha = 1;

            // HP Bar
            if (!this.dead) {
                const barWidth = 200;
                const barX = screenX + this.width/2 - barWidth/2;
                const barY = screenY - 30;

                ctx.fillStyle = '#333333';
                ctx.fillRect(barX, barY, barWidth, 12);

                const hpPercent = this.hp / this.maxHp;
                const hpColor = hpPercent > 0.5 ? '#00FF00' :
                               hpPercent > 0.25 ? '#FFFF00' : '#FF0000';
                ctx.fillStyle = hpColor;
                ctx.fillRect(barX + 2, barY + 2, (barWidth - 4) * hpPercent, 8);

                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('CAISO', barX + barWidth/2, barY - 5);
                ctx.textAlign = 'left';
            }
        }
    }

    // ============================================
    // LEVEL SYSTEM
    // ============================================
    class Level {
        constructor(data) {
            this.width = data.width;
            this.height = data.height;
            this.tiles = data.tiles;
            this.enemies = [];
            this.items = [];
            this.playerStart = data.playerStart || { x: 64, y: 200 };

            // Spawn enemies
            if (data.enemies) {
                data.enemies.forEach(e => {
                    if (e.type === 'boss') {
                        this.enemies.push(new Boss(e.x, e.y));
                    } else {
                        this.enemies.push(new Enemy(e.x, e.y, e.type));
                    }
                });
            }
            this.isBossLevel = data.isBossLevel || false;

            // Spawn items
            if (data.items) {
                this.items = data.items.map(i => ({
                    x: i.x, y: i.y, type: i.type, collected: false
                }));
            }
        }

        getTile(x, y) {
            const tx = Math.floor(x / TILE_SIZE);
            const ty = Math.floor(y / TILE_SIZE);
            if (tx < 0 || tx >= this.width || ty < 0 || ty >= this.height) {
                return 0;
            }
            return this.tiles[ty][tx];
        }

        isSolid(tileType) {
            return tileType >= 1 && tileType <= 7;
        }

        collideWithTiles(entity) {
            entity.hitWall = false;
            entity.atEdge = false;

            // Horizontal collision
            const futureX = entity.x + entity.velocityX;

            // Check corners
            const checkY1 = entity.y + 4;
            const checkY2 = entity.bottom - 4;

            if (entity.velocityX > 0) {
                if (this.isSolid(this.getTile(futureX + entity.width, checkY1)) ||
                    this.isSolid(this.getTile(futureX + entity.width, checkY2))) {
                    entity.x = Math.floor((futureX + entity.width) / TILE_SIZE) * TILE_SIZE - entity.width;
                    entity.velocityX = 0;
                    entity.hitWall = true;
                }
            } else if (entity.velocityX < 0) {
                if (this.isSolid(this.getTile(futureX, checkY1)) ||
                    this.isSolid(this.getTile(futureX, checkY2))) {
                    entity.x = Math.floor(futureX / TILE_SIZE) * TILE_SIZE + TILE_SIZE;
                    entity.velocityX = 0;
                    entity.hitWall = true;
                }
            }

            // Vertical collision
            const futureY = entity.y + entity.velocityY;
            const checkX1 = entity.x + 4;
            const checkX2 = entity.right - 4;

            if (entity.velocityY > 0) {
                if (this.isSolid(this.getTile(checkX1, futureY + entity.height)) ||
                    this.isSolid(this.getTile(checkX2, futureY + entity.height))) {
                    entity.y = Math.floor((futureY + entity.height) / TILE_SIZE) * TILE_SIZE - entity.height;
                    entity.velocityY = 0;
                    entity.grounded = true;
                }
            } else if (entity.velocityY < 0) {
                if (this.isSolid(this.getTile(checkX1, futureY)) ||
                    this.isSolid(this.getTile(checkX2, futureY))) {
                    entity.y = Math.floor(futureY / TILE_SIZE) * TILE_SIZE + TILE_SIZE;
                    entity.velocityY = 0;
                }
            }

            // Edge detection for enemies
            if (entity.grounded) {
                const aheadX = entity.facing > 0 ? entity.right + 4 : entity.left - 4;
                if (!this.isSolid(this.getTile(aheadX, entity.bottom + 4))) {
                    entity.atEdge = true;
                }
            }
        }

        render(ctx, camera) {
            const startX = Math.floor(camera.x / TILE_SIZE);
            const startY = Math.floor(camera.y / TILE_SIZE);
            const endX = Math.ceil((camera.x + GAME_WIDTH) / TILE_SIZE);
            const endY = Math.ceil((camera.y + GAME_HEIGHT) / TILE_SIZE);

            for (let y = startY; y <= endY; y++) {
                for (let x = startX; x <= endX; x++) {
                    const tile = this.getTile(x * TILE_SIZE, y * TILE_SIZE);
                    if (tile === 0) continue;

                    const screenX = x * TILE_SIZE - camera.x;
                    const screenY = y * TILE_SIZE - camera.y;

                    let sprite;
                    switch (tile) {
                        case 1: sprite = Sprites.cache.tileGround; break;
                        case 2: sprite = Sprites.cache.tilePlatform; break;
                        case 5: sprite = Sprites.cache.tileWhite; break;
                        case 6: sprite = Sprites.cache.tileBlack; break;
                        default: sprite = Sprites.cache.tileGround;
                    }

                    if (sprite) {
                        ctx.drawImage(sprite, screenX, screenY);
                    }
                }
            }

            // Render items
            this.items.forEach(item => {
                if (item.collected) return;
                const screenX = item.x - camera.x;
                const screenY = item.y - camera.y;
                const bob = Math.sin(Date.now() / 200) * 3;

                if (item.type === 'coin') {
                    const coin = Sprites.cache.uiCoin;
                    ctx.drawImage(coin, screenX, screenY + bob);
                }
                else if (item.type === 'upgrade') {
                    // Glowing chess piece
                    ctx.save();
                    ctx.translate(screenX + 12, screenY + bob + 12);
                    const glow = Math.sin(Date.now() / 150) * 0.3 + 0.7;
                    ctx.globalAlpha = glow;
                    ctx.fillStyle = '#FF00FF';
                    ctx.beginPath();
                    ctx.arc(0, 0, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#FFD700';
                    // Pawn shape
                    ctx.beginPath();
                    ctx.arc(0, -5, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(-4, 0, 8, 10);
                    ctx.fillRect(-8, 10, 16, 4);
                    ctx.restore();
                }
                else if (item.type === 'heart') {
                    const heart = Sprites.cache.uiHeart;
                    if (heart) {
                        ctx.save();
                        const scale = 1 + Math.sin(Date.now() / 200) * 0.1;
                        ctx.translate(screenX + 10, screenY + bob + 10);
                        ctx.scale(scale, scale);
                        ctx.drawImage(heart, -10, -10);
                        ctx.restore();
                    }
                }
            });
        }
    }

    // ============================================
    // CAMERA
    // ============================================
    class Camera {
        constructor() {
            this.x = 0;
            this.y = 0;
            this.smoothing = 0.08;
        }

        follow(target, level) {
            const targetX = target.centerX - GAME_WIDTH / 2;
            const targetY = target.centerY - GAME_HEIGHT / 2;

            this.x += (targetX - this.x) * this.smoothing;
            this.y += (targetY - this.y) * this.smoothing;

            // Bounds
            this.x = Math.max(0, Math.min(this.x, level.width * TILE_SIZE - GAME_WIDTH));
            this.y = Math.max(0, Math.min(this.y, level.height * TILE_SIZE - GAME_HEIGHT));
        }
    }

    // ============================================
    // PROJECTILES & ATTACKS
    // ============================================
    class Projectile {
        constructor(x, y, vx, vy, owner) {
            this.x = x;
            this.y = y;
            this.velocityX = vx;
            this.velocityY = vy;
            this.owner = owner;
            this.width = 12;
            this.height = 12;
            this.lifetime = 180;
        }

        update(level) {
            this.x += this.velocityX;
            this.y += this.velocityY;
            this.lifetime--;

            // Check collision with tiles
            if (level.isSolid(level.getTile(this.x, this.y)) ||
                level.isSolid(level.getTile(this.x + this.width, this.y + this.height))) {
                return true; // Remove
            }

            return this.lifetime <= 0;
        }

        render(ctx, camera) {
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            ctx.fillStyle = this.owner === 'enemy' ? '#9400D3' : '#DAA520';
            ctx.beginPath();
            ctx.arc(screenX + 6, screenY + 6, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = this.owner === 'enemy' ? '#FF00FF' : '#FFD700';
            ctx.beginPath();
            ctx.arc(screenX + 6, screenY + 6, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class Attack {
        constructor(owner, offsetX, offsetY, width, height, duration, damage) {
            this.owner = owner;
            this.offsetX = offsetX;
            this.offsetY = offsetY;
            this.width = width;
            this.height = height;
            this.duration = duration;
            this.damage = damage;
            this.hits = new Set();
        }

        get x() {
            return this.owner.facing === 1
                ? this.owner.x + this.owner.width + this.offsetX
                : this.owner.x - this.width - this.offsetX;
        }

        get y() { return this.owner.y + this.offsetY; }
        get left() { return this.x; }
        get right() { return this.x + this.width; }
        get top() { return this.y; }
        get bottom() { return this.y + this.height; }

        intersects(other) {
            return this.left < other.right &&
                   this.right > other.left &&
                   this.top < other.bottom &&
                   this.bottom > other.top;
        }

        update() {
            this.duration--;
            return this.duration <= 0;
        }

        render(ctx, camera) {
            // Debug hitbox
            if (false) {
                ctx.strokeStyle = '#FF0000';
                ctx.strokeRect(this.x - camera.x, this.y - camera.y, this.width, this.height);
            }
        }
    }

    // ============================================
    // PARTICLE SYSTEM
    // ============================================
    class Particle {
        constructor(x, y, type, options = {}) {
            this.x = x;
            this.y = y;
            this.type = type;
            this.velocityX = options.vx ?? (Math.random() - 0.5) * 4;
            this.velocityY = options.vy ?? (-Math.random() * 4 - 2);
            this.lifetime = options.lifetime ?? (30 + Math.random() * 30);
            this.maxLifetime = this.lifetime;
            this.size = options.size ?? (4 + Math.random() * 4);
            this.rotation = Math.random() * Math.PI * 2;
            this.rotationSpeed = (Math.random() - 0.5) * 0.3;
            this.color = options.color || null;
            this.gravity = options.gravity ?? 0.15;
            this.friction = options.friction ?? 1;
            this.scale = 1;
            this.text = options.text || '';
        }

        update() {
            this.x += this.velocityX;
            this.y += this.velocityY;
            this.velocityY += this.gravity;
            this.velocityX *= this.friction;
            this.rotation += this.rotationSpeed;
            this.lifetime--;

            // Scale animation for score popups
            if (this.type === 'scorePopup') {
                const progress = 1 - (this.lifetime / this.maxLifetime);
                if (progress < 0.2) {
                    this.scale = 0.5 + progress * 2.5; // Pop in
                } else {
                    this.scale = 1;
                }
            }

            return this.lifetime <= 0;
        }

        render(ctx, camera) {
            const alpha = this.lifetime / this.maxLifetime;
            const screenX = this.x - camera.x;
            const screenY = this.y - camera.y;

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(this.rotation);
            ctx.globalAlpha = alpha;

            switch (this.type) {
                case 'hit':
                    // Enhanced hit spark with glow
                    ctx.shadowColor = '#FFD700';
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(-this.size/3, -this.size/3, this.size * 0.66, this.size * 0.66);
                    break;

                case 'death':
                    // Smoke puff with gradient
                    const deathGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                    deathGrad.addColorStop(0, 'rgba(80, 40, 40, 0.8)');
                    deathGrad.addColorStop(0.5, 'rgba(60, 30, 30, 0.5)');
                    deathGrad.addColorStop(1, 'rgba(40, 20, 20, 0)');
                    ctx.fillStyle = deathGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    // Inner spark
                    ctx.fillStyle = '#FF6644';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'coin':
                    // Golden sparkle with glow
                    ctx.shadowColor = '#FFD700';
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = '#FFD700';
                    // Diamond shape
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size);
                    ctx.lineTo(this.size * 0.6, 0);
                    ctx.lineTo(0, this.size);
                    ctx.lineTo(-this.size * 0.6, 0);
                    ctx.closePath();
                    ctx.fill();
                    break;

                case 'doubleJump':
                    // Cyan ring effect
                    ctx.strokeStyle = '#00FFFF';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#00FFFF';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * (1 + (1 - alpha)), 0, Math.PI * 2);
                    ctx.stroke();
                    break;

                case 'dash':
                    // Speed line with gradient
                    const dashGrad = ctx.createLinearGradient(-this.size * 2, 0, this.size, 0);
                    dashGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
                    dashGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.8)');
                    dashGrad.addColorStop(1, 'rgba(200, 230, 255, 0.3)');
                    ctx.fillStyle = dashGrad;
                    ctx.fillRect(-this.size * 2, -this.size/4, this.size * 3, this.size/2);
                    break;

                case 'upgrade':
                    // Magical star with glow
                    ctx.shadowColor = '#FF00FF';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#FF00FF';
                    ctx.beginPath();
                    for (let i = 0; i < 10; i++) {
                        const angle = (i * Math.PI / 5) - Math.PI / 2;
                        const r = i % 2 === 0 ? this.size : this.size * 0.4;
                        if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                        else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    }
                    ctx.closePath();
                    ctx.fill();
                    // Center glow
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'heal':
                    // Heart particle with pulse
                    ctx.fillStyle = '#FF6666';
                    ctx.shadowColor = '#FF0000';
                    ctx.shadowBlur = 8;
                    // Simple heart shape
                    ctx.beginPath();
                    ctx.moveTo(0, this.size * 0.3);
                    ctx.bezierCurveTo(-this.size, -this.size * 0.3, -this.size, this.size * 0.5, 0, this.size);
                    ctx.bezierCurveTo(this.size, this.size * 0.5, this.size, -this.size * 0.3, 0, this.size * 0.3);
                    ctx.fill();
                    break;

                case 'throw':
                    // Book page flutter
                    ctx.fillStyle = '#F5F5DC';
                    ctx.strokeStyle = '#8B4513';
                    ctx.lineWidth = 1;
                    ctx.fillRect(-this.size/2, -this.size/3, this.size, this.size * 0.66);
                    ctx.strokeRect(-this.size/2, -this.size/3, this.size, this.size * 0.66);
                    // Page lines
                    ctx.strokeStyle = '#CCC';
                    ctx.lineWidth = 0.5;
                    for (let i = 1; i < 3; i++) {
                        ctx.beginPath();
                        ctx.moveTo(-this.size/2 + 2, -this.size/3 + i * this.size * 0.2);
                        ctx.lineTo(this.size/2 - 2, -this.size/3 + i * this.size * 0.2);
                        ctx.stroke();
                    }
                    break;

                case 'dust':
                    // Landing/running dust
                    const dustGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                    dustGrad.addColorStop(0, `rgba(180, 160, 140, ${alpha * 0.6})`);
                    dustGrad.addColorStop(1, 'rgba(180, 160, 140, 0)');
                    ctx.fillStyle = dustGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'enemyHit':
                    // Red impact spark
                    ctx.shadowColor = '#FF4444';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#FF4444';
                    // Cross shape
                    ctx.fillRect(-this.size * 0.15, -this.size, this.size * 0.3, this.size * 2);
                    ctx.fillRect(-this.size, -this.size * 0.15, this.size * 2, this.size * 0.3);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.2, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'scorePopup':
                    // Floating score text
                    ctx.rotate(-this.rotation); // Cancel rotation for text
                    ctx.scale(this.scale, this.scale);
                    ctx.font = 'bold 16px monospace';
                    ctx.textAlign = 'center';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 3;
                    ctx.strokeText(this.text, 0, 0);
                    ctx.fillStyle = this.color || '#FFD700';
                    ctx.fillText(this.text, 0, 0);
                    break;

                case 'comboStar':
                    // Combo celebration star
                    ctx.shadowColor = this.color || '#FFFF00';
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = this.color || '#FFFF00';
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
                        const r = i % 2 === 0 ? this.size : this.size * 0.5;
                        if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                        else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    }
                    ctx.closePath();
                    ctx.fill();
                    break;

                case 'magic':
                    // Magical rune particle
                    ctx.fillStyle = this.color || '#4169E1';
                    ctx.shadowColor = this.color || '#4169E1';
                    ctx.shadowBlur = 10;
                    // Rune-like shape
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size);
                    ctx.lineTo(this.size * 0.7, this.size * 0.5);
                    ctx.lineTo(-this.size * 0.7, this.size * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    break;
            }

            ctx.restore();
        }
    }

    // Score popup helper
    function createScorePopup(x, y, score, color = '#FFD700') {
        const popup = new Particle(x, y, 'scorePopup', {
            vx: (Math.random() - 0.5) * 2,
            vy: -3,
            lifetime: 60,
            gravity: 0.02,
            text: '+' + score,
            color: color
        });
        popup.rotationSpeed = 0;
        return popup;
    }

    // Combo burst effect
    function createComboBurst(x, y, combo) {
        const particles = [];
        const colors = ['#FFFF00', '#FF8800', '#FF0000', '#FF00FF'];
        const colorIndex = Math.min(Math.floor(combo / 3), colors.length - 1);

        for (let i = 0; i < Math.min(combo, 8); i++) {
            const angle = (Math.PI * 2 * i) / Math.min(combo, 8);
            particles.push(new Particle(x, y, 'comboStar', {
                vx: Math.cos(angle) * 4,
                vy: Math.sin(angle) * 4 - 2,
                size: 6 + Math.random() * 4,
                lifetime: 40,
                color: colors[colorIndex]
            }));
        }
        return particles;
    }
