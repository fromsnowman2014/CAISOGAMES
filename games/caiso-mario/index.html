                        row.push(2);
                    }
                    else if (y === 16 && x >= 75 && x <= 85) {
                        row.push(2);
                    }
                    else if (x === 0 || x === w3 - 1) {
                        row.push(1);
                    }
                    else {
                        row.push(0);
                    }
                }
                level3Tiles.push(row);
            }

            this.levels.push({
                width: w3,
                height: h3,
                tiles: level3Tiles,
                playerStart: { x: 64, y: 600 },
                enemies: [
                    { type: 'knight', x: 200, y: 630 },
                    { type: 'bishop', x: 450, y: 600 },
                    { type: 'knight', x: 600, y: 630 },
                    { type: 'rook', x: 900, y: 630 },
                    { type: 'knight', x: 1100, y: 630 },
                    { type: 'bishop', x: 1300, y: 600 },
                    { type: 'rook', x: 1600, y: 630 },
                    { type: 'knight', x: 1900, y: 280 },
                    { type: 'bishop', x: 2200, y: 480 },
                    { type: 'rook', x: 2500, y: 630 }
                ],
                items: [
                    { type: 'coin', x: 350, y: 400 },
                    { type: 'heart', x: 700, y: 280 },
                    { type: 'coin', x: 1000, y: 400 },
                    { type: 'upgrade', x: 1400, y: 280 }, // Bishop upgrade
                    { type: 'coin', x: 1800, y: 480 },
                    { type: 'coin', x: 2400, y: 480 }
                ]
            });

            // Level 4: World 3 - King's Palace
            const level4Tiles = [];
            const h4 = 25;
            const w4 = 100;

            for (let y = 0; y < h4; y++) {
                const row = [];
                for (let x = 0; x < w4; x++) {
                    if (y >= h4 - 2) {
                        // Alternating floor
                        if ((x >= 20 && x <= 24) || (x >= 45 && x <= 50) ||
                            (x >= 70 && x <= 75)) {
                            row.push(0);
                        } else {
                            row.push((x + y) % 2 === 0 ? 5 : 6);
                        }
                    }
                    // Tower structures
                    else if ((x === 30 || x === 60) && y >= 5) {
                        row.push(1);
                    }
                    // Platforms
                    else if (y === 16 && ((x >= 10 && x <= 18) || (x >= 35 && x <= 45))) {
                        row.push(2);
                    }
                    else if (y === 12 && ((x >= 25 && x <= 29) || (x >= 50 && x <= 58))) {
                        row.push(2);
                    }
                    else if (y === 8 && x >= 65 && x <= 75) {
                        row.push(2);
                    }
                    else if (y === 18 && x >= 80 && x <= 95) {
                        row.push(2);
                    }
                    else if (x === 0 || x === w4 - 1) {
                        row.push(1);
                    }
                    else {
                        row.push(0);
                    }
                }
                level4Tiles.push(row);
            }

            this.levels.push({
                width: w4,
                height: h4,
                tiles: level4Tiles,
                playerStart: { x: 64, y: 700 },
                enemies: [
                    { type: 'rook', x: 200, y: 730 },
                    { type: 'knight', x: 400, y: 730 },
                    { type: 'bishop', x: 600, y: 700 },
                    { type: 'rook', x: 850, y: 730 },
                    { type: 'knight', x: 1100, y: 350 },
                    { type: 'bishop', x: 1400, y: 700 },
                    { type: 'rook', x: 1700, y: 730 },
                    { type: 'knight', x: 2000, y: 220 },
                    { type: 'bishop', x: 2300, y: 700 },
                    { type: 'rook', x: 2600, y: 540 }
                ],
                items: [
                    { type: 'coin', x: 450, y: 480 },
                    { type: 'coin', x: 800, y: 350 },
                    { type: 'heart', x: 1200, y: 350 },
                    { type: 'upgrade', x: 1600, y: 350 }, // Rook upgrade
                    { type: 'coin', x: 2100, y: 220 },
                    { type: 'coin', x: 2800, y: 540 }
                ]
            });

            // Level 5: Boss Arena - Caiso's Domain
            const level5Tiles = [];
            const h5 = 20;
            const w5 = 40;

            for (let y = 0; y < h5; y++) {
                const row = [];
                for (let x = 0; x < w5; x++) {
                    if (y >= h5 - 2) {
                        row.push((x + y) % 2 === 0 ? 5 : 6);
                    }
                    else if (x === 0 || x === w5 - 1) {
                        row.push(1);
                    }
                    // Platforms for boss fight
                    else if (y === 12 && ((x >= 5 && x <= 10) || (x >= 29 && x <= 34))) {
                        row.push(2);
                    }
                    else if (y === 8 && x >= 15 && x <= 24) {
                        row.push(2);
                    }
                    else {
                        row.push(0);
                    }
                }
                level5Tiles.push(row);
            }

            this.levels.push({
                width: w5,
                height: h5,
                tiles: level5Tiles,
                playerStart: { x: 64, y: 540 },
                enemies: [
                    { type: 'boss', x: 600, y: 400 }
                ],
                items: [
                    { type: 'heart', x: 200, y: 340 },
                    { type: 'heart', x: 1000, y: 340 }
                ],
                isBossLevel: true
            });
        },

        startGame() {
            this.score = 0;
            this.stageNum = 1;
            this.loadLevel(0);
            this.state = 'playing';
        },

        loadLevel(index) {
            if (index >= this.levels.length) {
                this.victory();
                return;
            }

            this.level = new Level(this.levels[index]);
            this.player = new Player(this.level.playerStart.x, this.level.playerStart.y);
            this.camera.x = 0;
            this.camera.y = 0;
            this.projectiles = [];
            this.attacks = [];
            this.particles = [];
        },

        nextLevel() {
            this.stageNum++;
            this.loadLevel(this.stageNum - 1);
        },

        createAttack(owner) {
            this.attacks.push(new Attack(owner, 0, 5, 40, 30, 12, 1));
        },

        createProjectile(x, y, vx, vy, owner) {
            this.projectiles.push(new Projectile(x, y, vx, vy, owner));
        },

        spawnParticles(x, y, type, count = 8) {
            for (let i = 0; i < count; i++) {
                this.particles.push(new Particle(x, y, type));
            }
        },

        addScore(amount) {
            const multiplier = this.player ? this.player.getComboMultiplier() : 1;
            this.score += Math.floor(amount * multiplier);
        },

        gameOver() {
            this.state = 'gameover';
        },

        victory() {
            this.state = 'victory';
        },

        update() {
            if (this.state === 'title') {
                if (Input.jumpPressed || Input.attack) {
                    this.startGame();
                }
            }
            else if (this.state === 'playing') {
                // Update player
                this.player.update(this.level);

                // Update camera
                this.camera.follow(this.player, this.level);

                // Update enemies
                this.level.enemies = this.level.enemies.filter(enemy => {
                    const remove = enemy.update(this.player, this.level);

                    // Check collision with player
                    if (!enemy.dead && !this.player.invincible && enemy.intersects(this.player)) {
                        // Stomp check
                        if (this.player.velocityY > 0 &&
                            this.player.bottom < enemy.centerY) {
                            const wasAlive = enemy.hp > 0;
                            enemy.takeDamage(1);
                            this.player.velocityY = PHYSICS.JUMP_FORCE * 0.6;
                            this.spawnParticles(enemy.centerX, enemy.centerY, 'hit');
                            if (wasAlive) {
                                this.player.addCombo();
                            }
                        } else {
                            this.player.takeDamage(1);
                            this.player.combo = 0; // Reset combo on hit
                        }
                    }

                    return !remove;
                });

                // Update attacks
                this.attacks = this.attacks.filter(attack => {
                    const remove = attack.update();

                    // Check hit on enemies
                    this.level.enemies.forEach(enemy => {
                        if (!attack.hits.has(enemy) && !enemy.dead && attack.intersects(enemy)) {
                            const wasAlive = enemy.hp > 0;
                            enemy.takeDamage(attack.damage);
                            attack.hits.add(enemy);
                            this.spawnParticles(enemy.centerX, enemy.centerY, 'hit');
                            if (wasAlive) {
                                this.player.addCombo();
                            }
                        }
                    });

                    return !remove;
                });

                // Update projectiles
                this.projectiles = this.projectiles.filter(proj => {
                    const remove = proj.update(this.level);

                    // Player projectile hits enemy
                    if (proj.owner === 'player') {
                        this.level.enemies.forEach(enemy => {
                            if (!enemy.dead && enemy.intersects(proj)) {
                                const damage = this.player.weaponLevel >= 2 ? 2 : 1;
                                const wasAlive = enemy.hp > 0;
                                enemy.takeDamage(damage);
                                this.spawnParticles(enemy.centerX, enemy.centerY, 'hit');
                                proj.lifetime = 0; // Destroy projectile
                                if (wasAlive) {
                                    this.player.addCombo();
                                }
                            }
                        });
                    }

                    // Check hit on player
                    if (proj.owner === 'enemy' && !this.player.invincible) {
                        if (this.player.intersects(proj)) {
                            this.player.takeDamage(1);
                            this.player.combo = 0;
                            return true;
                        }
                    }

                    return !remove;
                });

                // Update particles
                this.particles = this.particles.filter(p => !p.update());

                // Collect items
                this.level.items.forEach(item => {
                    if (item.collected) return;

                    const dist = Math.hypot(
                        this.player.centerX - item.x - 8,
                        this.player.centerY - item.y - 8
                    );

                    if (dist < 24) {
                        item.collected = true;
                        if (item.type === 'coin') {
                            this.player.coins++;
                            this.addScore(50);
                            this.spawnParticles(item.x, item.y, 'coin', 5);
                        } else if (item.type === 'upgrade') {
                            this.player.upgradeWeapon();
                            this.addScore(500);
                        } else if (item.type === 'heart') {
                            this.player.hp = Math.min(this.player.hp + 1, this.player.maxHp);
                            this.spawnParticles(item.x, item.y, 'heal', 8);
                        }
                    }
                });

                // Check stage clear
                const allEnemiesDead = this.level.enemies.every(e => e.dead);
                const atEnd = this.player.x > this.level.width * TILE_SIZE - 100;

                if (this.level.isBossLevel) {
                    // Boss level: just need to defeat boss
                    if (allEnemiesDead && this.level.enemies.length > 0) {
                        this.nextLevel();
                    }
                } else {
                    // Normal level: defeat all enemies and reach end
                    if (this.level.enemies.length === 0 && atEnd) {
                        this.nextLevel();
                    }
                }
            }
            else if (this.state === 'gameover' || this.state === 'victory') {
                if (Input.jumpPressed) {
                    this.state = 'title';
                }
            }

            Input.clear();
        },

        render() {
            // Clear
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            if (this.state === 'title') {
                this.renderTitle();
            }
            else if (this.state === 'playing') {
                this.renderGame();
            }
            else if (this.state === 'gameover') {
                this.renderGame();
                this.renderGameOver();
            }
            else if (this.state === 'victory') {
                this.renderGame();
                this.renderVictory();
            }
        },

        renderTitle() {
            // Background pattern
            for (let x = 0; x < GAME_WIDTH; x += 64) {
                for (let y = 0; y < GAME_HEIGHT; y += 64) {
                    ctx.globalAlpha = 0.1;
                    const tile = ((x/64) + (y/64)) % 2 === 0
                        ? Sprites.cache.tileWhite
                        : Sprites.cache.tileBlack;
                    if (tile) ctx.drawImage(tile, x, y, 64, 64);
                }
            }
            ctx.globalAlpha = 1;

            // Title
            ctx.fillStyle = '#DAA520';
            ctx.font = 'bold 64px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('♟ CAISO MARIO ♟', GAME_WIDTH/2, 180);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '24px Georgia, serif';
            ctx.fillText('Chess Platformer Adventure', GAME_WIDTH/2, 230);

            // Instructions - Two columns
            ctx.font = '16px sans-serif';
            ctx.fillStyle = '#888';

            // Left column
            ctx.textAlign = 'right';
            ctx.fillText('Move:', GAME_WIDTH/2 - 20, 300);
            ctx.fillText('Jump:', GAME_WIDTH/2 - 20, 325);
            ctx.fillText('Attack:', GAME_WIDTH/2 - 20, 350);
            ctx.fillText('Throw Book:', GAME_WIDTH/2 - 20, 375);
            ctx.fillText('Dash:', GAME_WIDTH/2 - 20, 400);

            // Right column
            ctx.textAlign = 'left';
            ctx.fillStyle = '#AAA';
            ctx.fillText('Arrow Keys / WASD', GAME_WIDTH/2 + 20, 300);
            ctx.fillText('Space / W', GAME_WIDTH/2 + 20, 325);
            ctx.fillText('Z / J', GAME_WIDTH/2 + 20, 350);
            ctx.fillText('X / K', GAME_WIDTH/2 + 20, 375);
            ctx.fillText('Shift + Direction', GAME_WIDTH/2 + 20, 400);

            // Features
            ctx.textAlign = 'center';
            ctx.fillStyle = '#666';
            ctx.font = '14px sans-serif';
            ctx.fillText('Collect upgrades to unlock new abilities!', GAME_WIDTH/2, 440);
            ctx.fillText('5 Stages • 4 Weapon Upgrades • Epic Boss Fight', GAME_WIDTH/2, 460);

            // Start prompt
            const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(218, 165, 32, ${pulse})`;
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('Press SPACE or Z to Start', GAME_WIDTH/2, 510);

            ctx.textAlign = 'left';
        },

        renderGame() {
            // Render background
            this.renderBackground();

            // Render level
            this.level.render(ctx, this.camera);

            // Render enemies
            this.level.enemies.forEach(e => e.render(ctx, this.camera));

            // Render projectiles
            this.projectiles.forEach(p => p.render(ctx, this.camera));

            // Render player
            this.player.render(ctx, this.camera);

            // Render attacks
            this.attacks.forEach(a => a.render(ctx, this.camera));

            // Render particles
            this.particles.forEach(p => p.render(ctx, this.camera));

            // Render HUD
            this.renderHUD();
        },

        renderBackground() {
            // Parallax bookshelf background
            const parallax = this.camera.x * 0.3;

            ctx.fillStyle = '#2D1810';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Distant bookshelves
            ctx.fillStyle = '#3D2820';
            for (let x = -parallax % 200; x < GAME_WIDTH + 200; x += 200) {
                ctx.fillRect(x, 0, 40, GAME_HEIGHT);
                ctx.fillRect(x + 60, 50, 80, GAME_HEIGHT - 50);
            }

            // God rays
            ctx.globalAlpha = 0.1;
            ctx.fillStyle = '#DAA520';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(200 + i * 300 - parallax * 0.5, 0);
                ctx.lineTo(100 + i * 300 - parallax * 0.5, GAME_HEIGHT);
                ctx.lineTo(180 + i * 300 - parallax * 0.5, GAME_HEIGHT);
                ctx.lineTo(280 + i * 300 - parallax * 0.5, 0);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        },

        renderHUD() {
            // HP
            for (let i = 0; i < this.player.maxHp; i++) {
                const heart = i < this.player.hp
                    ? Sprites.cache.uiHeart
                    : Sprites.cache.uiHeartEmpty;
                if (heart) ctx.drawImage(heart, 20 + i * 28, 20);
            }

            // Score
            ctx.fillStyle = '#DAA520';
            ctx.font = 'bold 20px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(`SCORE: ${this.score.toString().padStart(6, '0')}`, GAME_WIDTH - 20, 38);

            // Coins
            const coin = Sprites.cache.uiCoin;
            if (coin) ctx.drawImage(coin, GAME_WIDTH - 100, 50);
            ctx.fillText(`× ${this.player.coins}`, GAME_WIDTH - 20, 65);

            // Stage
            ctx.textAlign = 'center';
            ctx.fillText(`STAGE ${this.stageNum}`, GAME_WIDTH/2, 38);

            // Weapon display
            ctx.textAlign = 'left';
            ctx.font = '14px monospace';
            ctx.fillStyle = '#DAA520';
            ctx.fillText(`♟ ${this.player.getWeaponName()}`, 20, 70);

            // Combo counter (with pulse effect)
            if (this.player.combo > 0) {
                const pulse = 1 + Math.sin(Date.now() / 100) * 0.1;
                const comboColors = ['#FFFFFF', '#FFFF00', '#FF8800', '#FF0000', '#FF00FF'];
                const colorIndex = Math.min(Math.floor(this.player.combo / 3), comboColors.length - 1);

                ctx.save();
                ctx.translate(GAME_WIDTH / 2, 70);
                ctx.scale(pulse, pulse);
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = comboColors[colorIndex];
                ctx.fillText(`${this.player.combo} COMBO!`, 0, 0);

                // Multiplier
                ctx.font = '14px sans-serif';
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(`×${this.player.getComboMultiplier().toFixed(1)}`, 0, 18);
                ctx.restore();
            }

            // Dash cooldown indicator
            if (this.player.dashCooldown > 0) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(20, 85, 60 * (1 - this.player.dashCooldown / 60), 4);
            } else {
                ctx.fillStyle = '#00FF00';
                ctx.fillRect(20, 85, 60, 4);
                ctx.font = '10px monospace';
                ctx.fillStyle = '#00FF00';
                ctx.fillText('DASH', 20, 98);
            }

            ctx.textAlign = 'left';
        },

        renderGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = '#FF4444';
            ctx.font = 'bold 48px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', GAME_WIDTH/2, GAME_HEIGHT/2 - 30);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '24px sans-serif';
            ctx.fillText(`Final Score: ${this.score}`, GAME_WIDTH/2, GAME_HEIGHT/2 + 20);

            ctx.fillStyle = '#888';
            ctx.font = '18px sans-serif';
            ctx.fillText('Press SPACE to Return to Title', GAME_WIDTH/2, GAME_HEIGHT/2 + 80);

            ctx.textAlign = 'left';
        },

        renderVictory() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Animated stars background
            ctx.fillStyle = '#FFD700';
            for (let i = 0; i < 20; i++) {
                const x = (Date.now() / 50 + i * 100) % GAME_WIDTH;
                const y = Math.sin(i + Date.now() / 500) * 50 + GAME_HEIGHT / 2;
                const size = Math.sin(Date.now() / 200 + i) * 2 + 3;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = '#DAA520';
            ctx.font = 'bold 56px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('♚ VICTORY! ♚', GAME_WIDTH/2, 140);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '28px Georgia, serif';
            ctx.fillText('Caiso has been defeated!', GAME_WIDTH/2, 200);
            ctx.fillText('You saved your friend!', GAME_WIDTH/2, 240);

            // Stats box
            ctx.fillStyle = 'rgba(218, 165, 32, 0.2)';
            ctx.fillRect(GAME_WIDTH/2 - 150, 270, 300, 150);
            ctx.strokeStyle = '#DAA520';
            ctx.strokeRect(GAME_WIDTH/2 - 150, 270, 300, 150);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '22px monospace';
            ctx.fillText(`Final Score: ${this.score.toLocaleString()}`, GAME_WIDTH/2, 310);

            ctx.font = '18px monospace';
            ctx.fillText(`Coins Collected: ${this.player.coins}`, GAME_WIDTH/2, 345);
            ctx.fillText(`Max Combo: ${this.player.maxCombo}`, GAME_WIDTH/2, 375);
            ctx.fillText(`Final Weapon: ${this.player.getWeaponName()}`, GAME_WIDTH/2, 405);

            // Return prompt
            const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
            ctx.font = '20px sans-serif';
            ctx.fillText('Press SPACE to Return to Title', GAME_WIDTH/2, 480);

            ctx.textAlign = 'left';
        }
    };

    // ============================================
    // GAME LOOP
    // ============================================
    let lastTime = 0;
    const targetFPS = 60;
    const frameTime = 1000 / targetFPS;

    function gameLoop(timestamp) {
        const delta = timestamp - lastTime;

        if (delta >= frameTime) {
            lastTime = timestamp - (delta % frameTime);

            game.update();
            game.render();
        }

        requestAnimationFrame(gameLoop);
    }

    // Initialize and start
    game.init();
    requestAnimationFrame(gameLoop);
    </script>
