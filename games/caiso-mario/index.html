<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Caiso Mario - Chess Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(218, 165, 32, 0.3);
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #backBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #DAA520;
            border: 2px solid #DAA520;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            z-index: 100;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        #backBtn:hover {
            background: #DAA520;
            color: #000;
        }

        #backBtn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        #touchControls {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            padding: 0 20px;
        }

        .touch-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: rgba(218, 165, 32, 0.5);
            border-color: #DAA520;
        }

        .dpad {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
        }

        .dpad .touch-btn {
            width: 50px;
            height: 50px;
        }

        .action-btns {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            gap: 15px;
        }

        @media (max-width: 900px) or (pointer: coarse) {
            #touchControls {
                display: block;
            }
        }

        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #DAA520;
            z-index: 1000;
        }

        .loading-title {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #DAA520;
        }

        .loading-bar {
            width: 200px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
        }

        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #DAA520, #FFD700);
            width: 0%;
            transition: width 0.3s;
        }

        .loading-text {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <a href="../../" id="backBtn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Hub
        </a>
        <div id="touchControls">
            <div class="dpad">
                <div></div>
                <div class="touch-btn" data-key="up">↑</div>
                <div></div>
                <div class="touch-btn" data-key="left">←</div>
                <div></div>
                <div class="touch-btn" data-key="right">→</div>
                <div></div>
                <div class="touch-btn" data-key="down">↓</div>
                <div></div>
            </div>
            <div class="action-btns">
                <div class="touch-btn" data-key="attack" style="background: rgba(255,100,100,0.3);">⚔</div>
                <div class="touch-btn" data-key="jump" style="background: rgba(100,255,100,0.3);">⬆</div>
            </div>
        </div>
        <div id="loadingScreen">
            <div class="loading-title">♟ CAISO MARIO ♟</div>
            <div class="loading-bar">
                <div class="loading-fill" id="loadingFill"></div>
            </div>
            <div class="loading-text" id="loadingText">Loading...</div>
        </div>
    </div>

    <script>
    // ============================================
    // CAISO MARIO - Chess Platformer Game
    // ============================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game dimensions
    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;
    const TILE_SIZE = 32;

    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    // Responsive scaling
    function resizeGame() {
        const container = document.getElementById('gameContainer');
        const maxWidth = window.innerWidth - 20;
        const maxHeight = window.innerHeight - 20;
        const scale = Math.min(maxWidth / GAME_WIDTH, maxHeight / GAME_HEIGHT);

        container.style.width = (GAME_WIDTH * scale) + 'px';
        container.style.height = (GAME_HEIGHT * scale) + 'px';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
    }
    window.addEventListener('resize', resizeGame);
    resizeGame();

    // ============================================
    // PHYSICS CONSTANTS (Mario-style)
    // ============================================
    const PHYSICS = {
        GRAVITY_HOLDING: 0.45,
        GRAVITY_FALLING: 0.85,
        MAX_FALL_SPEED: 14,
        JUMP_FORCE: -13.5,
        JUMP_CUT: 0.4,
        ACCELERATION: 0.6,
        DECELERATION: 0.4,
        MAX_SPEED: 5.5,
        SPRINT_SPEED: 7.5,
        AIR_CONTROL: 0.65,
        FRICTION: 0.82,
        COYOTE_TIME: 8,
        JUMP_BUFFER: 10,
        CORNER_CORRECT: 6
    };

    // ============================================
    // INPUT HANDLER
    // ============================================
    const Input = {
        keys: {},
        justPressed: {},

        init() {
            window.addEventListener('keydown', (e) => {
                if (!this.keys[e.code]) {
                    this.justPressed[e.code] = true;
                }
                this.keys[e.code] = true;
                if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                    e.preventDefault();
                }
            });

            window.addEventListener('keyup', (e) => {
                this.keys[e.code] = false;
            });

            // Touch controls
            document.querySelectorAll('.touch-btn').forEach(btn => {
                const key = btn.dataset.key;
                const keyMap = {
                    'up': 'ArrowUp',
                    'down': 'ArrowDown',
                    'left': 'ArrowLeft',
                    'right': 'ArrowRight',
                    'jump': 'Space',
                    'attack': 'KeyZ'
                };

                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const code = keyMap[key];
                    if (!this.keys[code]) this.justPressed[code] = true;
                    this.keys[code] = true;
                });

                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.keys[keyMap[key]] = false;
                });
            });
        },

        isDown(key) {
            return this.keys[key] || false;
        },

        wasPressed(key) {
            return this.justPressed[key] || false;
        },

        clear() {
            this.justPressed = {};
        },

        get left() { return this.isDown('ArrowLeft') || this.isDown('KeyA'); },
        get right() { return this.isDown('ArrowRight') || this.isDown('KeyD'); },
        get jump() { return this.isDown('Space') || this.isDown('KeyW') || this.isDown('ArrowUp'); },
        get jumpPressed() { return this.wasPressed('Space') || this.wasPressed('KeyW') || this.wasPressed('ArrowUp'); },
        get attack() { return this.wasPressed('KeyZ') || this.wasPressed('KeyJ'); },
        get throw() { return this.wasPressed('KeyX') || this.wasPressed('KeyK'); },
        get dash() { return this.wasPressed('ShiftLeft') || this.wasPressed('ShiftRight'); },
        get sprint() { return this.isDown('ShiftLeft') || this.isDown('ShiftRight'); },
        get down() { return this.isDown('ArrowDown') || this.isDown('KeyS'); }
    };

    // ============================================
    // ENHANCED SPRITE GENERATOR (Phase 2)
    // ============================================
    const Sprites = {
        cache: {},

        // Helper: Draw pixel with outline
        drawPixelArt(ctx, x, y, w, h, color, outline = '#1a1a1a') {
            if (outline) {
                ctx.fillStyle = outline;
                ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
            }
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        },

        // Helper: Draw rounded rectangle
        drawRoundedRect(ctx, x, y, w, h, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, r);
            ctx.fill();
        },

        // Helper: Add highlight/shadow
        addShading(ctx, x, y, w, h, lightColor, shadowColor) {
            // Top highlight
            ctx.fillStyle = lightColor;
            ctx.fillRect(x, y, w, 2);
            ctx.fillRect(x, y, 2, h);
            // Bottom shadow
            ctx.fillStyle = shadowColor;
            ctx.fillRect(x, y + h - 2, w, 2);
            ctx.fillRect(x + w - 2, y, 2, h);
        },

        // Generate enhanced player sprite
        createPlayer() {
            const colors = {
                skin: '#FFD5B8',
                skinLight: '#FFE4C9',
                skinShadow: '#D4A574',
                hair: '#2D1810',
                hairLight: '#4A2C1C',
                shirt: '#FFFFFF',
                shirtShadow: '#E8E8E8',
                vest: '#7DD87D',
                vestLight: '#98E898',
                vestShadow: '#5CB85C',
                pants: '#8B5A2B',
                pantsLight: '#A0693A',
                pantsShadow: '#6B4423',
                shoes: '#2D1810',
                glasses: '#333333',
                glassesShine: '#666666',
                outline: '#1a1a1a'
            };

            // Idle animation (4 frames with breathing)
            const idleFrames = [];
            for (let f = 0; f < 4; f++) {
                const c = document.createElement('canvas');
                c.width = 32; c.height = 48;
                const ctx = c.getContext('2d');
                ctx.imageSmoothingEnabled = false;

                const breathe = Math.sin(f * Math.PI / 2) * 1;
                const blink = f === 2;

                // Shadow on ground
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(16, 46, 8, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                // LEGS with outline
                ctx.fillStyle = colors.outline;
                ctx.fillRect(9, 32 - breathe, 7, 12);
                ctx.fillRect(16, 32 - breathe, 7, 12);
                ctx.fillStyle = colors.pants;
                ctx.fillRect(10, 33 - breathe, 5, 10);
                ctx.fillRect(17, 33 - breathe, 5, 10);
                ctx.fillStyle = colors.pantsLight;
                ctx.fillRect(10, 33 - breathe, 2, 8);
                ctx.fillRect(17, 33 - breathe, 2, 8);

                // SHOES with shine
                ctx.fillStyle = colors.outline;
                ctx.fillRect(8, 42 - breathe, 8, 6);
                ctx.fillRect(16, 42 - breathe, 8, 6);
                ctx.fillStyle = colors.shoes;
                ctx.fillRect(9, 43 - breathe, 6, 4);
                ctx.fillRect(17, 43 - breathe, 6, 4);
                ctx.fillStyle = '#4A3020';
                ctx.fillRect(9, 43 - breathe, 3, 2);
                ctx.fillRect(17, 43 - breathe, 3, 2);

                // BODY with vest
                ctx.fillStyle = colors.outline;
                ctx.fillRect(6, 17 - breathe, 20, 17);
                // Shirt base
                ctx.fillStyle = colors.shirt;
                ctx.fillRect(8, 18 - breathe, 16, 15);
                ctx.fillStyle = colors.shirtShadow;
                ctx.fillRect(8, 28 - breathe, 16, 4);
                // Vest
                ctx.fillStyle = colors.vest;
                ctx.fillRect(7, 18 - breathe, 6, 14);
                ctx.fillRect(19, 18 - breathe, 6, 14);
                ctx.fillStyle = colors.vestLight;
                ctx.fillRect(8, 18 - breathe, 2, 12);
                ctx.fillRect(20, 18 - breathe, 2, 12);
                ctx.fillStyle = colors.vestShadow;
                ctx.fillRect(11, 20 - breathe, 2, 10);
                ctx.fillRect(19, 20 - breathe, 2, 10);
                // Buttons
                ctx.fillStyle = '#DAA520';
                ctx.fillRect(15, 22 - breathe, 2, 2);
                ctx.fillRect(15, 27 - breathe, 2, 2);

                // ARMS
                ctx.fillStyle = colors.outline;
                ctx.fillRect(2, 19 - breathe, 6, 12);
                ctx.fillRect(24, 19 - breathe, 6, 12);
                ctx.fillStyle = colors.skin;
                ctx.fillRect(3, 20 - breathe, 4, 10);
                ctx.fillRect(25, 20 - breathe, 4, 10);
                ctx.fillStyle = colors.skinLight;
                ctx.fillRect(3, 20 - breathe, 2, 8);
                ctx.fillRect(25, 20 - breathe, 2, 8);

                // HEAD
                ctx.fillStyle = colors.outline;
                ctx.fillRect(7, 2 - breathe, 18, 17);
                ctx.fillStyle = colors.skin;
                ctx.fillRect(8, 3 - breathe, 16, 15);
                ctx.fillStyle = colors.skinLight;
                ctx.fillRect(9, 4 - breathe, 6, 10);
                ctx.fillStyle = colors.skinShadow;
                ctx.fillRect(18, 8 - breathe, 5, 8);

                // HAIR with volume
                ctx.fillStyle = colors.outline;
                ctx.fillRect(7, 0 - breathe, 18, 8);
                ctx.fillStyle = colors.hair;
                ctx.fillRect(8, 1 - breathe, 16, 6);
                ctx.fillStyle = colors.hairLight;
                ctx.fillRect(10, 2 - breathe, 4, 3);
                // Side hair
                ctx.fillStyle = colors.hair;
                ctx.fillRect(6, 4 - breathe, 4, 6);
                ctx.fillRect(22, 4 - breathe, 4, 6);

                // GLASSES (round frames)
                ctx.fillStyle = colors.glasses;
                ctx.fillRect(9, 8 - breathe, 6, 5);
                ctx.fillRect(17, 8 - breathe, 6, 5);
                ctx.fillRect(14, 9 - breathe, 4, 2);
                // Lens reflection
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillRect(10, 9 - breathe, 2, 2);
                ctx.fillRect(18, 9 - breathe, 2, 2);

                // EYES
                if (!blink) {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(10, 9 - breathe, 4, 3);
                    ctx.fillRect(18, 9 - breathe, 4, 3);
                    ctx.fillStyle = '#3d2817';
                    ctx.fillRect(11, 10 - breathe, 2, 2);
                    ctx.fillRect(19, 10 - breathe, 2, 2);
                    // Shine in eyes
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(12, 10 - breathe, 1, 1);
                    ctx.fillRect(20, 10 - breathe, 1, 1);
                } else {
                    ctx.fillStyle = colors.outline;
                    ctx.fillRect(10, 10 - breathe, 4, 1);
                    ctx.fillRect(18, 10 - breathe, 4, 1);
                }

                // MOUTH (small smile)
                ctx.fillStyle = colors.skinShadow;
                ctx.fillRect(13, 14 - breathe, 6, 1);
                ctx.fillRect(14, 15 - breathe, 4, 1);

                idleFrames.push(c);
            }
            this.cache.playerIdle = idleFrames;

            // Running frames (8 smooth frames)
            const runFrames = [];
            for (let f = 0; f < 8; f++) {
                const c = document.createElement('canvas');
                c.width = 32; c.height = 48;
                const ctx = c.getContext('2d');
                ctx.imageSmoothingEnabled = false;

                const phase = (f / 8) * Math.PI * 2;
                const legPhase = Math.sin(phase);
                const armPhase = Math.cos(phase);
                const bodyBob = Math.abs(Math.sin(phase * 2)) * 2;
                const lean = 2; // Forward lean

                // Running dust particles
                if (f % 2 === 0) {
                    ctx.fillStyle = 'rgba(139, 90, 43, 0.5)';
                    ctx.beginPath();
                    ctx.arc(16 - legPhase * 5, 46, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // LEGS with motion
                const leftLegX = 10 + legPhase * 4;
                const rightLegX = 17 - legPhase * 4;
                const leftLegY = 32 - bodyBob + (legPhase > 0 ? -2 : 2);
                const rightLegY = 32 - bodyBob + (legPhase < 0 ? -2 : 2);

                ctx.fillStyle = colors.outline;
                ctx.fillRect(leftLegX - 1, leftLegY - 1, 7, 12);
                ctx.fillRect(rightLegX - 1, rightLegY - 1, 7, 12);
                ctx.fillStyle = colors.pants;
                ctx.fillRect(leftLegX, leftLegY, 5, 10);
                ctx.fillRect(rightLegX, rightLegY, 5, 10);
                ctx.fillStyle = colors.pantsLight;
                ctx.fillRect(leftLegX, leftLegY, 2, 8);
                ctx.fillRect(rightLegX, rightLegY, 2, 8);

                // SHOES
                ctx.fillStyle = colors.outline;
                ctx.fillRect(leftLegX - 1, leftLegY + 9, 8, 6);
                ctx.fillRect(rightLegX - 1, rightLegY + 9, 8, 6);
                ctx.fillStyle = colors.shoes;
                ctx.fillRect(leftLegX, leftLegY + 10, 6, 4);
                ctx.fillRect(rightLegX, rightLegY + 10, 6, 4);

                // BODY (leaning forward)
                ctx.fillStyle = colors.outline;
                ctx.fillRect(6 + lean, 17 - bodyBob, 20, 17);
                ctx.fillStyle = colors.shirt;
                ctx.fillRect(8 + lean, 18 - bodyBob, 16, 15);
                ctx.fillStyle = colors.vest;
                ctx.fillRect(7 + lean, 18 - bodyBob, 6, 14);
                ctx.fillRect(19 + lean, 18 - bodyBob, 6, 14);
                ctx.fillStyle = colors.vestLight;
                ctx.fillRect(8 + lean, 18 - bodyBob, 2, 12);
                ctx.fillStyle = '#DAA520';
                ctx.fillRect(15 + lean, 22 - bodyBob, 2, 2);

                // ARMS with swing
                const backArmX = 2 + lean - armPhase * 6;
                const frontArmX = 24 + lean + armPhase * 6;
                ctx.fillStyle = colors.outline;
                ctx.fillRect(backArmX, 19 - bodyBob, 6, 12);
                ctx.fillRect(frontArmX, 19 - bodyBob, 6, 12);
                ctx.fillStyle = colors.skin;
                ctx.fillRect(backArmX + 1, 20 - bodyBob, 4, 10);
                ctx.fillRect(frontArmX + 1, 20 - bodyBob, 4, 10);

                // HEAD
                ctx.fillStyle = colors.outline;
                ctx.fillRect(7 + lean, 2 - bodyBob, 18, 17);
                ctx.fillStyle = colors.skin;
                ctx.fillRect(8 + lean, 3 - bodyBob, 16, 15);
                ctx.fillStyle = colors.skinLight;
                ctx.fillRect(9 + lean, 4 - bodyBob, 6, 10);

                // HAIR (flowing back)
                ctx.fillStyle = colors.outline;
                ctx.fillRect(6 + lean, 0 - bodyBob, 19, 8);
                ctx.fillStyle = colors.hair;
                ctx.fillRect(7 + lean, 1 - bodyBob, 17, 6);
                ctx.fillRect(5 + lean, 4 - bodyBob, 4, 6);
                ctx.fillRect(22 + lean, 4 - bodyBob, 4, 6);
                // Hair flowing
                ctx.fillRect(24 + lean, 2 - bodyBob, 3, 4);

                // GLASSES
                ctx.fillStyle = colors.glasses;
                ctx.fillRect(9 + lean, 8 - bodyBob, 6, 5);
                ctx.fillRect(17 + lean, 8 - bodyBob, 6, 5);
                ctx.fillRect(14 + lean, 9 - bodyBob, 4, 2);

                // EYES (determined look)
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(10 + lean, 9 - bodyBob, 4, 3);
                ctx.fillRect(18 + lean, 9 - bodyBob, 4, 3);
                ctx.fillStyle = '#3d2817';
                ctx.fillRect(12 + lean, 10 - bodyBob, 2, 2);
                ctx.fillRect(20 + lean, 10 - bodyBob, 2, 2);

                runFrames.push(c);
            }
            this.cache.playerRun = runFrames;

            // Jump frame (dynamic upward pose)
            const jumpFrames = [];
            for (let f = 0; f < 2; f++) {
                const c = document.createElement('canvas');
                c.width = 32; c.height = 48;
                const ctx = c.getContext('2d');
                ctx.imageSmoothingEnabled = false;

                const stretch = f === 0 ? 2 : 0;

                // LEGS tucked
                ctx.fillStyle = colors.outline;
                ctx.fillRect(7, 34 + stretch, 8, 10);
                ctx.fillRect(17, 34 + stretch, 8, 10);
                ctx.fillStyle = colors.pants;
                ctx.fillRect(8, 35 + stretch, 6, 8);
                ctx.fillRect(18, 35 + stretch, 6, 8);
                ctx.fillStyle = colors.shoes;
                ctx.fillRect(8, 42 + stretch, 6, 4);
                ctx.fillRect(18, 42 + stretch, 6, 4);

                // BODY stretched up
                ctx.fillStyle = colors.outline;
                ctx.fillRect(6, 14 - stretch, 20, 22);
                ctx.fillStyle = colors.shirt;
                ctx.fillRect(8, 16 - stretch, 16, 18);
                ctx.fillStyle = colors.vest;
                ctx.fillRect(7, 16 - stretch, 6, 16);
                ctx.fillRect(19, 16 - stretch, 6, 16);
                ctx.fillStyle = colors.vestLight;
                ctx.fillRect(8, 16 - stretch, 2, 14);
                ctx.fillStyle = '#DAA520';
                ctx.fillRect(15, 20 - stretch, 2, 2);

                // ARMS reaching up
                ctx.fillStyle = colors.outline;
                ctx.fillRect(1, 8 - stretch, 6, 14);
                ctx.fillRect(25, 8 - stretch, 6, 14);
                ctx.fillStyle = colors.skin;
                ctx.fillRect(2, 9 - stretch, 4, 12);
                ctx.fillRect(26, 9 - stretch, 4, 12);

                // HEAD
                ctx.fillStyle = colors.outline;
                ctx.fillRect(7, 0 - stretch, 18, 17);
                ctx.fillStyle = colors.skin;
                ctx.fillRect(8, 1 - stretch, 16, 15);
                ctx.fillStyle = colors.skinLight;
                ctx.fillRect(9, 2 - stretch, 6, 10);

                // HAIR
                ctx.fillStyle = colors.hair;
                ctx.fillRect(8, 0 - stretch, 16, 5);
                ctx.fillRect(6, 3 - stretch, 4, 5);
                ctx.fillRect(22, 3 - stretch, 4, 5);

                // GLASSES & EYES (looking up)
                ctx.fillStyle = colors.glasses;
                ctx.fillRect(9, 6 - stretch, 6, 5);
                ctx.fillRect(17, 6 - stretch, 6, 5);
                ctx.fillRect(14, 7 - stretch, 4, 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(10, 7 - stretch, 4, 3);
                ctx.fillRect(18, 7 - stretch, 4, 3);
                ctx.fillStyle = '#3d2817';
                ctx.fillRect(11, 7 - stretch, 2, 2);
                ctx.fillRect(19, 7 - stretch, 2, 2);

                // Excited expression
                ctx.fillStyle = colors.skinShadow;
                ctx.fillRect(13, 12 - stretch, 6, 2);

                jumpFrames.push(c);
            }
            this.cache.playerJump = jumpFrames;

            // Fall frame (arms spread, worried look)
            const fallFrames = [];
            for (let f = 0; f < 2; f++) {
                const c = document.createElement('canvas');
                c.width = 32; c.height = 48;
                const ctx = c.getContext('2d');
                ctx.imageSmoothingEnabled = false;

                const wobble = f * 2;

                // Wind effect particles
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(4 + wobble, 15, 2, 8);
                ctx.fillRect(26 - wobble, 20, 2, 6);

                // LEGS dangling
                ctx.fillStyle = colors.outline;
                ctx.fillRect(8, 34, 7, 12);
                ctx.fillRect(17, 34, 7, 12);
                ctx.fillStyle = colors.pants;
                ctx.fillRect(9, 35, 5, 10);
                ctx.fillRect(18, 35, 5, 10);
                ctx.fillStyle = colors.shoes;
                ctx.fillRect(9, 44, 5, 4);
                ctx.fillRect(18, 44, 5, 4);

                // BODY
                ctx.fillStyle = colors.outline;
