# Image Agent Configuration
# Environment variables override these settings

# Generation Settings
max_iterations: 5
quality_threshold: 0.9

# Model Settings
model_name: "gemini-3-pro-preview"
max_output_tokens: 4096

# Weights for quality scoring
weights:
  transparency: 0.25
  style: 0.30
  color: 0.20
  quality: 0.25

# Logging
log_level: "INFO"

# Default output directory
output_dir: "assets/generated"

# Generation defaults
defaults:
  style: "kawaii"
  size: [64, 64]
  transparency: true
